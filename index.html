ANA[11]={r:{e:"Câu chủ đề (bảo vệ môi trường)",c:"Hành động đơn giản",b:"Trồng cây",a:"Bổ sung: sản phẩm xanh, NL tái tạo",d:"Kết luận: chung tay"},
v:{a:"Ngoài ra, việc chọn sản phẩm thân thiện môi trường và ủng hộ các nguồn năng lượng tái tạo như năng lượng mặt trời hoặc gió góp phần tạo nên hành tinh xanh hơn.",b:"Trồng cây giúp giảm lượng khí CO₂ và cải thiện chất lượng không khí.",c:"Những hành động đơn giản như giảm dùng nhựa, tái chế và tiết kiệm nước có thể tạo nên khác biệt lớn.",d:"Điều quan trọng là cá nhân, doanh nghiệp và chính phủ phải cùng hợp tác để bảo tồn tài nguyên, giảm ô nhiễm và chống biến đổi khí hậu vì các thế hệ tương lai.",e:"Bảo vệ môi trường là điều thiết yếu để đảm bảo một tương lai khỏe mạnh và bền vững."},
L:["(e) → (c): (e) nêu chủ đề; (c) gợi ý những hành động đơn giản đầu tiên.","(c) → (b): (b) thêm một hành động cụ thể: trồng cây.","(b) → (a): “Additionally” bổ sung hành động tiếp theo.","(a) → (d): (d) mở rộng phạm vi “individuals, businesses, and governments” – lời kêu gọi kết đoạn."],
t:"Câu chủ đề nêu tầm quan trọng chung (e). Câu kết kêu gọi mọi đối tượng chung tay (d). Loại D (mở bằng d). “Additionally” (a) không thể đứng thứ hai ngay sau câu chủ đề → loại B.",
w:[["sustainable future","tương lai bền vững"],["make a significant difference","tạo nên khác biệt đáng kể"],["renewable energy sources","nguồn năng lượng tái tạo"],["combat climate change","chống biến đổi khí hậu"]]};

ANA[12]={r:{c:"Câu chủ đề (AI phát triển nhanh)",b:"Quá khứ → hiện tại",d:"Công nghệ cốt lõi",a:"Tương lai & thách thức"},
v:{a:"Khi AI tiếp tục phát triển, nó có tiềm năng cách mạng hóa các lĩnh vực như y tế, giáo dục và kinh doanh, dù các vấn đề đạo đức về mất việc làm và quyền riêng tư ngày càng quan trọng.",b:"Ban đầu chỉ tập trung vào giải quyết vấn đề cơ bản và tính toán, AI giờ đây vận hành những hệ thống phức tạp, từ trợ lý ảo như Siri và Alexa đến xe tự lái và chẩn đoán y khoa tiên tiến.",c:"Trí tuệ nhân tạo (AI) đã phát triển nhanh chóng, làm thay đổi các ngành công nghiệp và cuộc sống hằng ngày.",d:"Công nghệ học máy và học sâu cho phép AI phân tích lượng dữ liệu khổng lồ, cải thiện khả năng ra quyết định."},
L:["(c) → (b): (c) nêu chủ đề “AI has rapidly evolved”; (b) kể quá trình tiến hóa “Initially… now…”.","(b) → (d): (d) giải thích công nghệ giúp AI làm được những điều ở (b).","(d) → (a): “As AI continues to advance” – hướng về tương lai, kết đoạn."],
t:"Đoạn 4 câu: câu mở định nghĩa đầy đủ “Artificial Intelligence (AI)” (c) – tên đầy đủ kèm viết tắt luôn xuất hiện lần đầu. Câu kết nói về tương lai “continues to advance” (a).",
w:[["rapidly evolve","phát triển nhanh chóng"],["virtual assistants","trợ lý ảo"],["vast amounts of data","lượng dữ liệu khổng lồ"],["job displacement","tình trạng mất việc làm (do bị thay thế)"]]};

ANA[13]={r:{a:"Câu chủ đề (có nhiều lý do)",d:"Lý do 1",b:"Giải thích lý do 1",e:"Lý do 2",c:"Hệ quả – kết luận"},
v:{a:"Có nhiều lý do khiến trẻ em ngày nay có xu hướng dành quá ít thời gian với cha mẹ.",b:"Điều này là bởi chỉ khi cả bố và mẹ đều đi làm họ mới có thể xây dựng nền tảng tài chính vững chắc cho một cuộc sống thoải mái trong xã hội hiện đại đắt đỏ này.",c:"Dễ hiểu là trẻ em có thể cảm thấy xa cách với cha mẹ.",d:"Một trong những lý do chính là nhiều gia đình hiện đại có cả bố và mẹ cùng đi làm.",e:"Một lý do khác là sau một ngày làm việc vất vả, cha mẹ thường mệt mỏi nên họ ưu tiên giải trí và nghỉ ngơi hơn là chăm sóc con cái."},
L:["(a) → (d): (a) “several reasons”; (d) “One of the primary reasons” – lý do thứ nhất.","(d) → (b): “This is because…” giải thích vì sao cả bố mẹ đều phải đi làm.","(b) → (e): “Another reason” – lý do thứ hai.","(e) → (c): “Understandably” – hệ quả tất yếu: trẻ thấy xa cách → kết."],
t:"Cặp tín hiệu “several reasons → One of… → Another reason” cho thấy d đứng trước e. “This is because” (b) phải nằm ngay sau lý do nó giải thích (d).",
w:[["two working parents","bố mẹ đều đi làm"],["financial foundation","nền tảng tài chính"],["a sense of alienation","cảm giác xa cách"],["prioritize A over B","ưu tiên A hơn B"]]};

ANA[14]={r:{d:"Câu chủ đề (3 lợi ích)",b:"Firstly – lợi ích 1",c:"Secondly – lợi ích 2",e:"Giải thích thêm lợi ích 2",a:"Finally – lợi ích 3"},
v:{a:"Cuối cùng, khi nhiều thế hệ sống cùng nhau, mọi người dễ dàng hỗ trợ lẫn nhau.",b:"Thứ nhất, trẻ em luôn có anh chị em để chơi cùng trong nhà, nhờ đó học được kỹ năng xã hội.",c:"Thứ hai, mọi người cùng chia sẻ việc nhà, giúp họ trở nên có trách nhiệm.",d:"Tôi tin rằng sống trong một đại gia đình mang lại cho con người ba lợi ích chính.",e:"Đôi khi họ cãi nhau vì những việc nhà đó, nhưng qua những lần tranh cãi, họ học được cách bảo vệ bản thân."},
L:["(d) → (b): “three main advantages” → “Firstly”.","(b) → (c): “Secondly”.","(c) → (e): “those chores” ở (e) thay cho “household tasks” ở (c) → e đứng ngay sau c.","(e) → (a): “Finally” – lợi ích cuối cùng."],
t:"Dạng liệt kê kinh điển: Câu chủ đề → Firstly → Secondly → Finally. Chỉ cần tìm câu chứa “those chores” để chèn ngay sau “household tasks”.",
w:[["extended / large family","đại gia đình"],["social skills","kỹ năng xã hội"],["household tasks / chores","việc nhà"],["mutual support","sự hỗ trợ lẫn nhau"]]};

ANA[15]={r:{c:"Câu chủ đề (vai trò truyền thông)",b:"Các hình thức",e:"Sự phát triển của Internet",d:"Mặt trái",a:"Kết luận: người dùng cần tỉnh táo"},
v:{a:"Đó là lý do tại sao người tiêu dùng cần xem xét kỹ lưỡng các phương tiện truyền thông mà họ tiếp cận.",b:"Nó bao gồm nhiều hình thức như truyền hình, radio, báo chí và các nền tảng mạng xã hội.",c:"Truyền thông đại chúng đóng vai trò quan trọng trong việc định hình dư luận và văn hóa.",d:"Tuy nhiên, dù truyền thông có thể cung cấp thông tin, nó cũng có thể gây hiểu lầm hoặc thao túng nếu không được sử dụng có trách nhiệm.",e:"Với sự phát triển của Internet, tin tức trực tuyến và nội dung số đã trở thành nguồn thông tin thiết yếu."},
L:["(c) → (b): “It includes” – “It” thay cho “mass media” ở (c).","(b) → (e): (b) nhắc “social media platforms” → (e) phát triển ý về Internet và nội dung số.","(e) → (d): “However” – chuyển sang mặt tiêu cực.","(d) → (a): “That's why…” – hệ quả rút ra từ (d) → kết."],
t:"Câu có đại từ “It” (b) hay “That's why” (a) không thể mở đầu → loại B, C. “That's why” là câu kết luận rút ra từ mặt trái ở (d).",
w:[["mass media","truyền thông đại chúng"],["shape public opinion","định hình dư luận"],["mislead or manipulate","gây hiểu lầm hoặc thao túng"],["thoughtfully examine","xem xét kỹ lưỡng"]]};

ANA[16]={r:{b:"Giới thiệu biểu đồ",d:"Tổng quan 1: biến động",c:"Tổng quan 2: so sánh",e:"Chi tiết giai đoạn đầu",a:"Chi tiết giai đoạn sau"},
v:{a:"Dù số liệu thay đổi đôi chút ở giai đoạn giữa, đến năm 2015 cả hai nhóm đều quay về tỷ lệ thất nghiệp gần như năm 1990, với 14% ở nhóm chưa tốt nghiệp và 10% ở nhóm đã tốt nghiệp.",b:"Biểu đồ đường thể hiện xu hướng thất nghiệp của sinh viên mới tốt nghiệp và người chưa tốt nghiệp từ 21 đến 30 tuổi trong giai đoạn 1990–2015.",c:"Ở mọi thời điểm, số người chưa tốt nghiệp bị thất nghiệp luôn cao hơn số sinh viên mới tốt nghiệp.",d:"Trong suốt giai đoạn, cả hai nhóm đều có biến động, giảm rồi lại tăng.",e:"Từ năm 1990 đến 2000, tỷ lệ thất nghiệp giảm, giảm nhẹ những năm đầu và giảm mạnh hơn vào khoảng năm 2000."},
L:["(b) → (d): câu giới thiệu “The line graph illustrates…” luôn đứng đầu; (d) “Throughout the period” – nhận xét tổng quan.","(d) → (c): “At all times” – đặc điểm tổng quan thứ hai.","(c) → (e): đi vào chi tiết theo thời gian: “From 1990 to 2000”.","(e) → (a): giai đoạn sau và mốc cuối “by 2015”."],
t:"Đoạn mô tả biểu đồ: Giới thiệu → Tổng quan → Chi tiết theo trình tự thời gian. Câu “The line graph illustrates” (b) chắc chắn đứng đầu; mốc thời gian muộn nhất “by 2015” (a) đứng cuối.",
w:[["The line graph illustrates…","Biểu đồ đường thể hiện…"],["fluctuation(s)","sự dao động, biến động"],["a significant decline","sự sụt giảm đáng kể"],["unemployment rate","tỷ lệ thất nghiệp"]]};

ANA[17]={r:{d:"Giới thiệu: đa dạng mặt hàng",a:"Ưu điểm: tiện lợi",b:"Thách thức",c:"Lời khuyên",e:"Mặt trái khác"},
v:{a:"Mua sắm trực tuyến mang lại sự tiện lợi, cho phép người tiêu dùng mua sản phẩm ngay tại nhà.",b:"Tuy nhiên, một trong những thách thức là khách hàng không thể kiểm tra trực tiếp sản phẩm trước khi mua.",c:"Điều quan trọng là phải đọc đánh giá sản phẩm và kiểm tra chính sách đổi trả trước khi mua hàng.",d:"Các nền tảng mua sắm trực tuyến cung cấp đa dạng mặt hàng, từ đồ điện tử đến quần áo và thực phẩm.",e:"Bất chấp sự tiện lợi, mua sắm trực tuyến đôi khi dẫn đến mua sắm bốc đồng và chi tiêu quá mức."},
L:["(d) → (a): (d) giới thiệu các nền tảng; (a) nêu ưu điểm tiện lợi.","(a) → (b): “However” – chuyển sang thách thức đối lập với ưu điểm.","(b) → (c): (c) đưa lời khuyên trực tiếp giải quyết thách thức “không kiểm tra được hàng”: đọc đánh giá, xem chính sách đổi trả.","(c) → (e): “Despite its convenience” – nêu thêm một mặt trái để khép lại."],
t:"“However” (b) phải đứng sau một câu nói về ưu điểm (a). Câu lời khuyên (c) gắn liền với vấn đề ở (b). Theo đáp án, (d) đóng vai trò câu mở giới thiệu.",
w:[["from the comfort of their homes","ngay tại nhà một cách thoải mái"],["physically examine","kiểm tra trực tiếp"],["return policy","chính sách đổi trả"],["impulse buying","mua sắm bốc đồng"]]};

ANA[18]={r:{b:"Câu chủ đề (nghề nghiệp đa dạng)",d:"Hệ quả: đào tạo chuyên sâu",c:"Thêm: nghề công nghệ số",a:"Hạn chế",e:"Kết quả: nghề phi truyền thống"},
v:{a:"Tuy nhiên, dù cơ hội tăng lên, nhiều lĩnh vực vẫn thiếu chương trình đào tạo phù hợp, nhất là ở các thị trấn nhỏ.",b:"Con đường sự nghiệp đã thay đổi mạnh mẽ qua nhiều năm, với nhiều lựa chọn hơn bao giờ hết.",c:"Sự phát triển của công nghệ số cũng tạo ra nhiều việc làm mới, đặc biệt trong các ngành như CNTT, marketing và kinh doanh trực tuyến.",d:"Sự thay đổi này trên thị trường việc làm đã dẫn đến sự bùng nổ của giáo dục và đào tạo chuyên sâu, giúp mọi người theo đuổi nhiều sở thích nghề nghiệp.",e:"Kết quả là, ngày càng nhiều người trẻ tìm kiếm những nghề phi truyền thống cho phép làm việc từ xa và giờ giấc linh hoạt."},
L:["(b) → (d): “This shift in the job market” thay cho “career paths have evolved dramatically” ở (b).","(d) → (c): “also created new jobs” – bổ sung yếu tố công nghệ số.","(c) → (a): “However, despite this increase in opportunities” – nhượng bộ sau khi đã nói nhiều cơ hội.","(a) → (e): “As a result” – kết quả chung: người trẻ chọn nghề linh hoạt."],
t:"“This shift” (d) phải đứng ngay sau câu nêu sự thay đổi (b). Phương án C mở bằng (d) → loại ngay vì câu mở không thể có đại từ thay thế “This”.",
w:[["career paths","con đường sự nghiệp"],["a surge in","sự gia tăng mạnh"],["non-traditional careers","nghề nghiệp phi truyền thống"],["flexible schedules","lịch làm việc linh hoạt"]]};
ANA[19]={r:{c:"Định nghĩa (câu chủ đề)",a:"Thực trạng: nguy cơ",e:"Vai trò của bảo tồn",d:"Cách thực hiện",b:"Kết luận – kêu gọi"},
v:{a:"Nhiều loài động vật đang gặp nguy hiểm do các yếu tố như phá rừng, ô nhiễm và săn bắt trái phép.",b:"Bằng cách nâng cao nhận thức và ủng hộ các tổ chức bảo tồn, tất cả chúng ta đều có thể góp phần bảo vệ động vật hoang dã cho thế hệ tương lai và đảm bảo một hành tinh khỏe mạnh.",c:"Bảo tồn động vật hoang dã là việc bảo vệ và gìn giữ các loài động vật cùng môi trường sống tự nhiên của chúng.",d:"Điều này có thể được thực hiện thông qua việc thành lập các khu bảo tồn, thực thi luật chống săn trộm và thúc đẩy các hoạt động bền vững.",e:"Các nỗ lực bảo tồn giúp ngăn các loài bị tuyệt chủng và giữ cho hệ sinh thái cân bằng."},
L:["(c) → (a): (c) định nghĩa bảo tồn; (a) nêu thực trạng – vì sao cần bảo tồn.","(a) → (e): (e) “Conservation efforts help prevent species from going extinct” – đáp lại nguy cơ ở (a).","(e) → (d): “This can be done through…” – “This” chỉ việc bảo tồn/ngăn tuyệt chủng ở (e).","(d) → (b): “By raising awareness… we can all contribute” – lời kêu gọi kết đoạn."],
t:"Câu kết luôn mang tính kêu gọi “we can all contribute… for future generations” (b). Chỉ A kết bằng (b). (Tài liệu gốc ghi C, nhưng C kết bằng câu nêu thực trạng (a) – không hợp lý.)",
w:[["wildlife conservation","bảo tồn động vật hoang dã"],["deforestation","nạn phá rừng"],["go extinct","bị tuyệt chủng"],["enforce laws against poaching","thực thi luật chống săn trộm"]]};

ANA[20]={r:{d:"Câu chủ đề (sự công nhận học tập suốt đời)",c:"Lý do: thị trường việc làm",e:"Kết quả: nhiều người học thêm",b:"Yếu tố hỗ trợ: học trực tuyến",a:"Rào cản (kết)"},
v:{a:"Tuy nhiên, dù học tập liên tục ngày càng quan trọng, nhiều người trưởng thành vẫn gặp rào cản trong tiếp cận giáo dục như hạn chế về thời gian và khó khăn tài chính.",b:"Sự phát triển của các khóa học trực tuyến và nền tảng tự học đã giúp mọi lứa tuổi dễ dàng tiếp thu kỹ năng mới hơn.",c:"Học tập suốt đời ngày càng thiết yếu khi thị trường việc làm thay đổi, đòi hỏi người lao động cập nhật công nghệ và phương pháp mới.",d:"Trong thập kỷ qua, giá trị của học tập suốt đời ngày càng được công nhận, cả trong công việc lẫn đời sống cá nhân.",e:"Sự thay đổi trong thái độ đối với việc học đã khiến nhiều người theo học nâng cao hơn, với số lượng ngày càng tăng đăng ký các chương trình cấp bằng trực tuyến và hội thảo kỹ năng."},
L:["(d) → (c): (d) nêu xu hướng chung; (c) giải thích vì sao học tập suốt đời trở nên thiết yếu.","(c) → (e): “This shift in attitude towards learning” tóm lại sự công nhận ở (d)–(c).","(e) → (b): (e) nhắc “online degree programs” → (b) nói về sự phát triển của khóa học trực tuyến.","(b) → (a): “However, despite the growing importance…” – nêu rào cản để kết."],
t:"“This shift” (e) không thể mở đoạn → loại C. Câu mở có mốc thời gian “Over the past decade” (d). (Tài liệu gốc ghi D – mở bằng b, nhưng khi đó “This shift in attitude” (e) không có gì để thay thế; B là phương án hợp lý nhất.)",
w:[["lifelong learning","học tập suốt đời"],["self-paced learning platforms","nền tảng tự học theo tốc độ riêng"],["acquire new skills","tiếp thu kỹ năng mới"],["time constraints","hạn chế về thời gian"]]};

ANA[21]={r:{d:"Câu chủ đề + quan điểm (2 lý do)",c:"Firstly – lý do 1",a:"Giải pháp cho lý do 1",b:"Secondly – lý do 2",e:"In conclusion"},
v:{a:"Bằng cách đặt ra giới hạn, cha mẹ có thể dành thêm thời gian cho việc học và các hoạt động ngoài trời lành mạnh hơn.",b:"Thứ hai, dùng màn hình quá mức gây nguy cơ cho sức khỏe, bao gồm tổn hại thị lực, đau đầu, rối loạn giấc ngủ và vấn đề cân nặng.",c:"Thứ nhất, sử dụng màn hình kéo dài thường cản trở thanh thiếu niên hoàn thành bài tập, ảnh hưởng đến cả kết quả học tập lẫn hoạt động ngoài trời.",d:"Thời gian dùng màn hình quá mức là vấn đề phổ biến ở thanh thiếu niên ngày nay, và tôi hoàn toàn ủng hộ việc cha mẹ đặt giới hạn nghiêm ngặt vì hai lý do quan trọng.",e:"Tóm lại, việc cha mẹ kiểm soát việc dùng thiết bị số của con là rất cần thiết để cân bằng giữa trách nhiệm học tập, hoạt động ngoài trời và bảo vệ sức khỏe tổng thể."},
L:["(d) → (c): “two crucial reasons” → “Firstly”.","(c) → (a): (a) “learning and outdoor pursuits” đáp lại trực tiếp vấn đề “homework… outdoor activities” ở (c).","(a) → (b): “Secondly” – lý do thứ hai.","(b) → (e): “In conclusion”."],
t:"Đề cho “two reasons” → Firstly – Secondly – In conclusion. Câu (a) không có từ nối nhưng nhắc lại “learning” và “outdoor” → bám vào lý do 1.",
w:[["excessive screen time","thời gian dùng màn hình quá mức"],["impose strict limits on","đặt giới hạn nghiêm ngặt"],["hinder sb from doing sth","cản trở ai làm gì"],["pose health risks","gây rủi ro cho sức khỏe"]]};

ANA[22]={r:{b:"Câu chủ đề (AI thay đổi thị trường lao động)",d:"Mối lo ngại",c:"Số liệu minh chứng",a:"Mặt tích cực",e:"Kết luận"},
v:{a:"Tuy nhiên, các chuyên gia tin rằng AI không chỉ xóa bỏ việc làm mà còn tạo ra cơ hội mới ở những lĩnh vực cần sự sáng tạo, trí tuệ cảm xúc và kỹ năng giải quyết vấn đề phức tạp của con người.",b:"Sự phát triển nhanh chóng của trí tuệ nhân tạo (AI) đang thay đổi đáng kể thị trường việc làm toàn cầu, với nhiều ngành bị ảnh hưởng.",c:"Một báo cáo cho thấy chỉ riêng năm 2023, hơn 1,5 triệu việc làm trên toàn cầu đã bị tự động hóa nhờ tiến bộ AI, và con số này dự kiến còn tăng.",d:"Nhiều người lao động ngày càng lo lắng về sự ổn định công việc khi AI tiếp tục thay thế các vị trí vốn do con người đảm nhận, đặc biệt trong sản xuất và chăm sóc khách hàng.",e:"Tóm lại, thách thức chính của lực lượng lao động là thích nghi bằng cách học lại kỹ năng và đón nhận những vai trò mới mà AI khó thay thế."},
L:["(b) → (d): (b) nêu chủ đề có “artificial intelligence (AI)” đầy đủ; (d) nêu mối lo của người lao động.","(d) → (c): (c) đưa số liệu chứng minh cho nỗi lo ở (d).","(c) → (a): “However” – đảo chiều sang mặt tích cực.","(a) → (e): “In conclusion”."],
t:"Từ viết tắt được giới thiệu đầy đủ “artificial intelligence (AI)” ở câu mở (b). “However” (a) cần một ý tiêu cực đứng trước nó (d, c) → loại A.",
w:[["job security","sự ổn định công việc"],["automate","tự động hóa"],["emotional intelligence","trí tuệ cảm xúc"],["reskilling","đào tạo lại kỹ năng"]]};

ANA[23]={r:{b:"Mở đầu: niềm đam mê",a:"Kinh nghiệm 2 năm",e:"Ý nghĩa của nghề",d:"Khó khăn nhưng đáng giá",c:"Kết luận"},
v:{a:"Suốt hai năm qua, tôi đã toàn tâm với công việc dạy tiếng Anh đầy ý nghĩa, nơi tôi giúp học sinh trau dồi năng lực ngôn ngữ và củng cố sự tự tin.",b:"Niềm đam mê lâu bền với giáo dục và sự phát triển bản thân đã thôi thúc tôi theo đuổi sự nghiệp dạy học.",c:"Tóm lại, nghề dạy học là một sự theo đuổi vô cùng mãn nguyện, hoàn toàn phù hợp với hoài bão và đam mê của tôi.",d:"Dù những thử thách trong quản lý lớp học có thể rất lớn, niềm hài lòng sâu sắc khi thấy học sinh tiến bộ khiến mọi nỗ lực đều xứng đáng.",e:"Dạy học không chỉ cho tôi đặc quyền truyền đạt kiến thức mà còn cho tôi cơ hội quý giá học hỏi từ chính học sinh."},
L:["(b) → (a): (b) nói lý do theo nghề; (a) “Throughout the past two years” – kinh nghiệm thực tế.","(a) → (e): (e) nêu ý nghĩa của việc dạy học.","(e) → (d): (d) “While the challenges… can be formidable” – nhượng bộ khó khăn.","(d) → (c): “In summation” = In conclusion → câu cuối."],
t:"“In summation” (c) chắc chắn đứng cuối. Câu mở nêu động lực “has driven me to pursue a career” (b). (Lưu ý: tài liệu gốc in phương án D là b-a-e-c-d – đặt câu kết c trước d; phương án D trong bài đã được chỉnh lại thành b-a-e-d-c cho đúng logic.)",
w:[["enduring passion","niềm đam mê bền bỉ"],["bolster self-assurance","củng cố sự tự tin"],["disseminate knowledge","truyền bá kiến thức"],["render sth worthwhile","khiến điều gì trở nên xứng đáng"]]};

ANA[24]={r:{b:"Câu chủ đề (Riverton chuyển mình)",c:"Thay đổi 1: nhà ở",d:"Thay đổi 2: kinh tế",e:"Thay đổi 3: dân số",a:"Hạn chế (kết)"},
v:{a:"Bất chấp những phát triển đáng kể, hạ tầng giao thông công cộng vẫn chưa đáp ứng được, gây khó khăn lớn cho việc đi lại hằng ngày của nhiều cư dân.",b:"Trong thập kỷ qua, Riverton đã có sự chuyển mình phi thường, với sự tăng trưởng và hiện đại hóa mạnh mẽ.",c:"Nhiều khu nhà cũ đã được thay thế bằng các khu chung cư hiện đại, thu hút đa dạng người trẻ đi làm và các gia đình.",d:"Quá trình đô thị hóa nhanh chóng này đã thúc đẩy tăng trưởng kinh tế, dẫn đến sự ra đời của các trung tâm mua sắm, nhà hàng cao cấp và văn phòng doanh nghiệp.",e:"Dân số đã tăng gần 30%, kéo theo nhu cầu nhà ở tăng và giá bất động sản tăng vọt."},
L:["(b) → (c): (b) nêu chủ đề có tên địa danh và mốc “Over the past decade”; (c) thay đổi cụ thể đầu tiên.","(c) → (d): “This swift urbanization” tóm lại quá trình hiện đại hóa ở (b)–(c).","(d) → (e): thêm thay đổi về dân số.","(e) → (a): “Despite the remarkable developments” – mặt hạn chế khép lại đoạn."],
t:"Câu mở thường chứa tên riêng + mốc thời gian (b). “Despite the remarkable developments” (a) tổng kết mọi thay đổi trước đó → câu cuối. Loại A, C, D vì mở bằng câu chứa “This” (d).",
w:[["an extraordinary transformation","sự chuyển mình phi thường"],["supplant","thay thế"],["act as a catalyst for","đóng vai trò chất xúc tác cho"],["skyrocketing property prices","giá bất động sản tăng vọt"]]};

ANA[25]={r:{a:"Câu chủ đề (toàn cầu hóa)",d:"Kết quả tích cực",b:"Mặt trái",c:"Giải pháp",e:"Kết luận"},
v:{a:"Toàn cầu hóa giúp con người từ các nền văn hóa khác nhau tương tác dễ dàng hơn bao giờ hết.",b:"Tuy nhiên, khác biệt văn hóa đôi khi có thể dẫn đến hiểu lầm và xung đột.",c:"Để vượt qua những thách thức này, mỗi người nên phát triển nhận thức về văn hóa và tôn trọng truyền thống của người khác.",d:"Kết quả là, các xã hội ngày nay ngày càng đa văn hóa và đa dạng.",e:"Bằng cách thúc đẩy sự thấu hiểu giữa các nền văn hóa, con người có thể xây dựng một thế giới hòa nhập và hài hòa hơn."},
L:["(a) → (d): “As a result” – hệ quả của toàn cầu hóa.","(d) → (b): “However” – mặt trái của sự đa dạng văn hóa.","(b) → (c): “these challenges” thay cho “misunderstandings and conflicts” ở (b).","(c) → (e): (e) khái quát lời giải → kết."],
t:"Mô hình kinh điển: Chủ đề → Kết quả → However (vấn đề) → Giải pháp (“To overcome these challenges”) → Kết luận. “these challenges” phải đứng ngay sau câu nêu vấn đề.",
w:[["globalization","toàn cầu hóa"],["multicultural and diverse","đa văn hóa và đa dạng"],["cultural awareness","nhận thức về văn hóa"],["cross-cultural understanding","sự thấu hiểu giữa các nền văn hóa"]]};

ANA[26]={r:{b:"Câu chủ đề (kỹ năng mềm quan trọng)",a:"Định nghĩa: gồm những kỹ năng nào",c:"Vai trò với nhà tuyển dụng",d:"Hậu quả nếu thiếu",e:"Kết luận"},
v:{a:"Những kỹ năng này bao gồm giao tiếp, làm việc nhóm, quản lý thời gian và giải quyết vấn đề.",b:"Ở nơi làm việc ngày nay, kỹ năng mềm cũng quan trọng như kỹ năng chuyên môn.",c:"Nhà tuyển dụng đánh giá cao ứng viên có kỹ năng mềm tốt vì họ góp phần tạo môi trường làm việc tích cực và hiệu quả.",d:"Thiếu những khả năng này, ngay cả nhân viên giỏi chuyên môn nhất cũng có thể khó hợp tác hiệu quả.",e:"Vì vậy, phát triển kỹ năng mềm nên là ưu tiên của bất kỳ ai chuẩn bị bước vào thị trường lao động."},
L:["(b) → (a): “These skills” thay cho “soft skills” ở (b).","(a) → (c): (c) nói vai trò của kỹ năng mềm với nhà tuyển dụng.","(c) → (d): “Without these abilities” – mặt ngược lại: hậu quả nếu thiếu.","(d) → (e): “Therefore” → kết luận."],
t:"“These skills” (a) phải nằm ngay sau câu nhắc “soft skills” lần đầu (b). “Therefore” (e) ở cuối. Phân biệt A/D: “Without these abilities” (d) cần đứng sau khi đã nói vai trò (c).",
w:[["soft skills","kỹ năng mềm"],["technical skills","kỹ năng chuyên môn"],["collaborate effectively","hợp tác hiệu quả"],["enter the workforce","gia nhập lực lượng lao động"]]};

ANA[27]={r:{c:"Câu chủ đề (đam mê du lịch)",a:"Những nơi đã đến",d:"Trải nghiệm ở mỗi nơi",b:"Động lực",e:"Kết luận"},
v:{a:"Vài năm qua, tôi đã đi đến nhiều nơi trên thế giới, từ những con phố nhộn nhịp ở Tokyo đến những bãi biển yên bình ở Bali.",b:"Tình yêu phiêu lưu và sự tò mò về những lối sống khác nhau đã tiếp thêm động lực khám phá cho tôi, khiến mỗi chuyến đi càng ý nghĩa hơn chuyến trước.",c:"Du lịch đến những quốc gia mới và trải nghiệm các nền văn hóa đa dạng luôn là niềm đam mê lớn nhất của tôi.",d:"Mỗi điểm đến mang lại những cuộc phiêu lưu độc đáo, dù là thưởng thức ẩm thực đường phố, khám phá di tích lịch sử hay kết nối với người dân địa phương.",e:"Tóm lại, trở thành người đi khắp thế giới không chỉ làm phong phú cuộc sống mà còn mở rộng tầm nhìn của tôi."},
L:["(c) → (a): (c) nêu niềm đam mê; (a) kể những nơi đã đi.","(a) → (d): “Each destination” chỉ các điểm đến Tokyo, Bali… ở (a).","(d) → (b): (b) nói động lực khiến “each trip more rewarding”.","(b) → (e): “In conclusion”."],
t:"“In conclusion” (e) phải đứng cuối → loại C (kết bằng a). “Each destination” (d) cần đứng sau câu liệt kê các điểm đến (a). (Tài liệu gốc ghi C – đã được sửa thành D.)",
w:[["bustling streets","những con phố nhộn nhịp"],["serene beaches","những bãi biển yên bình"],["globetrotter","người hay đi du lịch khắp thế giới"],["broaden one's perspective","mở rộng tầm nhìn"]]};

ANA[28]={r:{d:"Câu chủ đề (ô nhiễm không khí)",a:"Ví dụ: Bắc Kinh",c:"Hậu quả chung",b:"Đối tượng chịu ảnh hưởng",e:"Giải pháp"},
v:{a:"Ở những nơi như Bắc Kinh, Trung Quốc, không khí thường đầy khói và khí độc từ xe cộ và nhà máy.",b:"Trẻ em và người già đặc biệt bị ảnh hưởng bởi không khí bẩn và dễ bị ốm hơn.",c:"Ô nhiễm khiến việc thở trở nên khó khăn, và người dân đôi khi phải đeo khẩu trang để bảo vệ bản thân.",d:"Ở nhiều thành phố lớn, ô nhiễm không khí là một vấn đề nghiêm trọng.",e:"Để cải thiện tình hình, chính phủ đang phát triển giao thông công cộng tốt hơn và khuyến khích sử dụng năng lượng sạch."},
L:["(d) → (a): (d) nêu vấn đề chung “in many big cities”; (a) ví dụ cụ thể “places like Beijing”.","(a) → (c): “The pollution” ở (c) chỉ khói, khí độc vừa mô tả ở (a).","(c) → (b): từ ảnh hưởng chung (mọi người) sang nhóm đặc biệt (trẻ em, người già).","(b) → (e): “To improve the situation” – giải pháp kết đoạn."],
t:"Đi từ chung đến riêng: “many big cities” → “places like Beijing”. Giải pháp “To improve the situation” (e) đặt cuối. (Tài liệu gốc ghi C, nhưng C đặt e trước b – giải pháp chen giữa phần hậu quả là không hợp lý.)",
w:[["air pollution","ô nhiễm không khí"],["harmful gases","khí độc hại"],["the elderly","người cao tuổi"],["clean energy","năng lượng sạch"]]};

ANA[29]={r:{b:"Câu chủ đề (lợi ích việc làm thêm)",a:"To begin with – lợi ích 1",d:"Giải thích",c:"Ví dụ",e:"Kết luận nhỏ"},
v:{a:"Trước hết, học sinh có thể học và phát triển những kỹ năng quan trọng hữu ích cho sự nghiệp tương lai.",b:"Ngày nay ngày càng nhiều học sinh làm thêm khi còn đang học trung học. Có việc làm khi đi học có thể mang lại lợi ích cho học sinh theo nhiều cách.",c:"Ví dụ, nếu một học sinh làm bồi bàn, em có thể học cách chào hỏi và giao tiếp với khách hàng.",d:"Môi trường làm việc thực tế giúp học sinh học thêm kỹ năng mới cũng như cải thiện những kỹ năng sẵn có như giao tiếp, làm việc nhóm hay giải quyết vấn đề.",e:"Những người được trang bị nhiều kỹ năng sống có thể làm tốt hơn trong công việc tương lai."},
L:["(b) → (a): “in several ways” → “To begin with”.","(a) → (d): (d) giải thích cách môi trường làm việc giúp phát triển kỹ năng.","(d) → (c): “For example… waiter” minh họa kỹ năng giao tiếp ở (d).","(c) → (e): “Those who are equipped with various life skills” – khép lại ý."],
t:"“To begin with” (a) phải đứng ngay sau câu chủ đề (b) → chỉ C đúng. (Tài liệu gốc đánh dấu A – trùng với đáp án câu 30, có thể là lỗi đánh máy.)",
w:[["part-time job","việc làm bán thời gian"],["to begin with","trước hết"],["improve existing skills","cải thiện kỹ năng sẵn có"],["be equipped with","được trang bị"]]};

ANA[30]={r:{d:"Định nghĩa (câu chủ đề)",e:"Đặc điểm 1: lịch sự",a:"Đặc điểm 2: tôn trọng riêng tư",b:"Giải thích đặc điểm 2",c:"Kết quả – kết luận"},
v:{a:"Công dân số có trách nhiệm cũng tôn trọng quyền riêng tư của người khác.",b:"Họ không đăng ảnh của người khác hay bàn tán về đời tư của người khác khi chưa được phép vì điều đó có thể gây hại cho sự an toàn trên mạng của họ.",c:"Bằng cách này, công dân số giúp người khác cảm thấy an toàn và thoải mái hơn trong thế giới số.",d:"Một công dân số có trách nhiệm là người sử dụng công nghệ một cách hợp lý và khuyến khích người khác làm như vậy.",e:"Họ cẩn trọng với hành vi trên mạng và luôn cố gắng lịch sự nhất có thể, giúp người khác tránh những trải nghiệm tiêu cực."},
L:["(d) → (e): “They” ở (e) thay cho “a responsible digital citizen”.","(e) → (a): “respect other people's privacy, too” – “too” báo hiệu đặc điểm thứ hai.","(a) → (b): (b) giải thích cụ thể việc tôn trọng riêng tư.","(b) → (c): “In this way” → kết quả chung, kết đoạn."],
t:"Từ “too” ở (a) cho thấy đã có một đặc điểm khác đứng trước nó (e). “In this way” (c) là câu kết. Chỉ C phù hợp. (Tài liệu gốc ghi A – có vẻ bị lỗi đánh dấu.)",
w:[["digital citizen","công dân số"],["in a sensible way","một cách hợp lý"],["respect one's privacy","tôn trọng quyền riêng tư"],["online security","sự an toàn trên mạng"]]};

ANA[31]={r:{d:"Mở đầu: niềm đam mê bắt đầu",b:"Khám phá thể loại",e:"Các yếu tố làm phim",a:"Sức mạnh của điện ảnh",c:"Kết luận"},
v:{a:"Khả năng đưa khán giả đến những thế giới và trải nghiệm khác nhau chính là điều khiến phim ảnh trở thành loại hình giải trí mạnh mẽ.",b:"Qua nhiều năm, tôi đã khám phá nhiều thể loại phim, từ phim hành động bom tấn hồi hộp đến phim tâm lý cảm động để lại dấu ấn lâu dài.",c:"Tóm lại, phim ảnh không chỉ là thú tiêu khiển đối với tôi – chúng là nguồn cảm hứng và cánh cửa nhìn ra các nền văn hóa, góc nhìn khác nhau.",d:"Niềm đam mê điện ảnh của tôi bắt đầu từ khi còn nhỏ, lúc tôi lần đầu khám phá phép màu kể chuyện qua màn ảnh rộng.",e:"Dù là kịch bản được viết tinh tế hay kỹ thuật quay phim tuyệt đẹp, mọi yếu tố làm phim đều góp phần tạo nên trải nghiệm cuốn hút."},
L:["(d) → (b): “started at a young age” → “Over the years” – trình tự thời gian.","(b) → (e): từ thể loại phim sang các yếu tố tạo nên bộ phim.","(e) → (a): “captivating experience” ở (e) dẫn đến nhận định về sức mạnh của phim ở (a).","(a) → (c): “In conclusion”."],
t:"Câu mở “My passion… started at a young age” (d), câu kết “In conclusion” (c). Loại B, D vì không mở bằng d; loại C vì (a) – câu nhận định khái quát – chen sớm làm đứt mạch thời gian d → b.",
w:[["film genres","thể loại phim"],["action blockbusters","phim hành động bom tấn"],["cinematography","kỹ thuật quay phim"],["a window into","cánh cửa nhìn vào"]]};

ANA[32]={r:{c:"Câu chủ đề (học thêm phổ biến)",a:"Lý do",d:"Hệ quả: phụ huynh đầu tư",b:"Mặt trái",e:"Kết luận"},
v:{a:"Với nhu cầu thành tích học tập ngày càng tăng, nhiều học sinh tìm đến gia sư như một cách củng cố kiến thức và cải thiện kết quả thi.",b:"Tuy nhiên, dù học thêm có lợi ích, nó cũng làm dấy lên lo ngại về căng thẳng và áp lực lịch học quá tải của học sinh.",c:"Trong thập kỷ qua, học thêm đã trở thành thói quen phổ biến, với ngày càng nhiều học sinh đăng ký lớp phụ đạo để theo kịp môi trường học tập cạnh tranh.",d:"Kết quả là nhiều phụ huynh đầu tư mạnh vào các buổi học riêng, mong con có lợi thế trong thi cử và cơ hội nghề nghiệp sau này.",e:"Tóm lại, dù học thêm có thể hỗ trợ học tập, cần duy trì sự cân bằng để đảm bảo sức khỏe tinh thần cho học sinh và tránh áp lực quá mức."},
L:["(c) → (a): (c) nêu hiện tượng với “Over the past decade”; (a) giải thích lý do.","(a) → (d): “As a result” – hệ quả của nhu cầu thành tích.","(d) → (b): “However, while tutoring offers benefits” – chuyển sang mặt trái.","(b) → (e): “In conclusion”."],
t:"Câu mở có mốc thời gian “Over the past decade” (c). Cấu trúc: Hiện tượng → Nguyên nhân → Kết quả → However (mặt trái) → Kết luận. Loại D vì kết bằng b.",
w:[["private tutoring","học thêm, gia sư"],["competitive academic environment","môi trường học tập cạnh tranh"],["overloaded schedule","lịch trình quá tải"],["student well-being","sức khỏe tinh thần của học sinh"]]};

ANA[33]={r:{e:"Mở đầu: bước vào khuôn viên",a:"Thư viện",d:"Trung tâm khoa học",b:"Hội sinh viên",c:"Kết luận"},
v:{a:"Khi chuyến tham quan tiếp tục, hướng dẫn viên chỉ cho mọi người thư viện, nơi nổi tiếng với bộ sưu tập phong phú và không gian học yên tĩnh.",b:"Tại khu hội sinh viên, quán cà phê nhộn nhịp và các không gian sinh hoạt phản ánh tinh thần cộng đồng sôi động của trường.",c:"Những đặc điểm này kết hợp tạo nên môi trường truyền cảm hứng cho cả học tập và kết nối, để lại ấn tượng sâu sắc cho mọi du khách.",d:"Gần đó, một trung tâm khoa học hiện đại thể hiện cam kết đổi mới và nghiên cứu của trường.",e:"Đi dạo qua khuôn viên trường đại học sôi động, du khách được chào đón bởi những khu vườn xanh tươi và các tòa nhà cổ kính."},
L:["(e) → (a): “Walking through… visitors are greeted” – mở đầu chuyến tham quan; “As the tour progresses” – tiếp tục.","(a) → (d): “Nearby” – gần thư viện vừa nhắc.","(d) → (b): tiếp tục sang khu hội sinh viên.","(b) → (c): “These features” tổng hợp các địa điểm → kết luận."],
t:"Đoạn miêu tả theo không gian/hành trình. Câu bắt đầu hành trình “Walking through… visitors are greeted” (e). Câu tổng hợp “These features combine…” (c) đứng cuối.",
w:[["lush gardens","những khu vườn xanh tươi"],["state-of-the-art","hiện đại nhất"],["commitment to innovation","cam kết đổi mới"],["leave a lasting impression","để lại ấn tượng sâu sắc"]]};

ANA[34]={r:{c:"Câu chủ đề (ngôn ngữ thiểu số bị đe dọa)",d:"Biểu hiện",e:"Hậu quả",b:"Nỗ lực bảo tồn",a:"Cảnh báo (kết)"},
v:{a:"Tuy nhiên, nếu không hành động ngay, những kho báu ngôn ngữ này có thể biến mất mãi mãi, mang theo di sản hàng thế kỷ.",b:"Những nỗ lực bảo tồn ngôn ngữ có nguy cơ biến mất, như đưa chúng vào chương trình học ở trường, đã cho thấy triển vọng trong việc khơi lại sự quan tâm.",c:"Nhiều ngôn ngữ thiểu số đang bị đe dọa do sự áp đảo ngày càng tăng của các ngôn ngữ toàn cầu như tiếng Anh và tiếng Tây Ban Nha.",d:"Ở một số khu vực, thế hệ trẻ chọn nói những ngôn ngữ phổ biến hơn, để những ngôn ngữ truyền thống dần mai một.",e:"Việc mất đi những ngôn ngữ này cũng có nghĩa là mất đi bản sắc văn hóa độc đáo và tri thức truyền thống được truyền qua nhiều thế hệ."},
L:["(c) → (d): (d) minh họa cụ thể sự đe dọa: giới trẻ bỏ ngôn ngữ truyền thống.","(d) → (e): “The loss of these languages also means…” – hậu quả.","(e) → (b): chuyển sang các nỗ lực bảo tồn đã có kết quả.","(b) → (a): “Without immediate action, however” – dù có nỗ lực, vẫn cần hành động gấp → cảnh báo kết đoạn."],
t:"“these linguistic treasures… however” (a) là lời cảnh báo kết đoạn – đứng sau các nỗ lực (b). Loại C (đặt a quá sớm).",
w:[["minority languages","ngôn ngữ thiểu số"],["dominance","sự áp đảo, thống trị"],["cultural identity","bản sắc văn hóa"],["revitalise interest","khơi lại sự quan tâm"]]};

ANA[35]={r:{d:"Câu chủ đề (đồ nhựa dùng một lần)",a:"Giải thích tác hại",c:"Giải pháp thay thế",b:"Đánh giá giải pháp",e:"Nghi vấn (kết)"},
v:{a:"Những sản phẩm này, gồm ống hút, túi và dao nĩa, thường kết thúc ở bãi rác và đại dương, góp phần gây ô nhiễm và hại động vật hoang dã.",b:"Dù những giải pháp này có thể đòi hỏi thay đổi thói quen tiêu dùng và cách sản xuất, chúng có thể giảm đáng kể tác động lên hành tinh.",c:"Nhiều quốc gia đang cân nhắc các giải pháp thay thế như vật liệu phân hủy sinh học hoặc đồ tái sử dụng để giảm rác thải nhựa.",d:"Việc sử dụng rộng rãi đồ nhựa dùng một lần đã gây ra những thách thức môi trường đáng kể.",e:"Tuy nhiên, tính bền vững của các giải pháp thay thế này vẫn còn là dấu hỏi."},
L:["(d) → (a): “These products” thay cho “single-use plastic items” ở (d).","(a) → (c): sau tác hại, (c) đưa ra giải pháp thay thế.","(c) → (b): “these solutions” thay cho “alternatives” ở (c).","(b) → (e): “However… these alternatives remains questionable” – đặt vấn đề mở kết đoạn."],
t:"“These products” (a) phải đứng ngay sau (d) vì chỉ (d) nhắc đến sản phẩm nhựa → chỉ A đúng. (Tài liệu gốc ghi C – đặt c trước a, khiến “These products” bị hiểu là “alternatives”, mâu thuẫn nghĩa.)",
w:[["single-use plastic items","đồ nhựa dùng một lần"],["end up in landfills","cuối cùng nằm ở bãi rác"],["biodegradable materials","vật liệu phân hủy sinh học"],["remain questionable","vẫn còn đáng ngờ"]]};

ANA[36]={r:{e:"Mở đầu: James trở về",c:"Thay đổi 1: tiệm bánh",a:"Thay đổi 2: công viên",d:"Cảm xúc",b:"Kết: kỷ niệm còn mãi"},
v:{a:"Công viên gần đó cũng được cải tạo với thiết bị sân chơi mới và đường đi bộ, trông thân thiện và hiện đại.",b:"Ngoài ra, dù đã thay đổi, những kỷ niệm và gắn bó anh có ở đó sẽ luôn ở trong tim anh.",c:"Lái xe qua những con phố quen thuộc, anh ngạc nhiên khi thấy tiệm bánh cũ đã được thay bằng một quán cà phê hợp thời đầy người trẻ.",d:"Dù một số thay đổi khiến anh thấy lạ, như việc hiệu sách yêu thích không còn nữa, James vẫn vui khi thấy sức sống mới ở quê nhà.",e:"Sau nhiều năm sống ở nước ngoài, James cuối cùng đã về thăm quê; anh háo hức xem quê nhà đã thay đổi thế nào."},
L:["(e) → (c): (e) giới thiệu nhân vật “James” bằng tên; (c) “he” bắt đầu quan sát.","(c) → (a): “also been renovated” – thay đổi thứ hai.","(a) → (d): cảm xúc tổng hợp về những thay đổi.","(d) → (b): “despite its transformation… memories” – câu kết đầy cảm xúc."],
t:"Truyện kể: tên nhân vật đầy đủ xuất hiện ở câu mở “After years of living abroad, James…” (e). Từ “also” ở (a) cho thấy (a) đứng sau một thay đổi khác (c).",
w:[["live abroad","sống ở nước ngoài"],["a trendy café","quán cà phê hợp thời"],["be renovated","được cải tạo"],["close to one's heart","gần gũi, thân thương trong tim"]]};
ANA[37]={r:{d:"Mở đầu: bà làm ở bệnh viện dã chiến",a:"Hoàn cảnh khó khăn",c:"Sự kiên cường",b:"Ảnh hưởng tới đồng đội",e:"Kết luận: bài học"},
v:{a:"Bệnh viện được dựng ở vùng hẻo lánh, thường thiếu những vật tư cơ bản, khiến mọi công việc càng khó khăn hơn.",b:"Sự tận tụy của bà đã truyền cảm hứng cho những người khác trong đội, tạo nên tinh thần đoàn kết và mục đích chung trong lúc gian khó.",c:"Bất chấp khó khăn, bà vẫn quyết tâm, làm việc nhiều giờ liền để đảm bảo bệnh nhân được chăm sóc chu đáo.",d:"Thời trẻ, bà tôi đã làm việc không mệt mỏi ở một bệnh viện dã chiến, chăm sóc những người lính bị thương.",e:"Những trải nghiệm này không chỉ hình thành tính cách của bà mà còn dạy bà giá trị của sự kiên cường và lòng trắc ẩn."},
L:["(d) → (a): “The hospital” ở (a) chỉ “a field hospital” ở (d) (a → the).","(a) → (c): “Despite the difficulties” – nhắc lại khó khăn vừa nêu ở (a).","(c) → (b): “Her dedication” tóm lại sự quyết tâm, làm việc miệt mài ở (c).","(b) → (e): “These experiences” tổng kết → kết luận."],
t:"Mạo từ là manh mối: “a field hospital” (lần đầu) → “The hospital” (lần sau). “Despite the difficulties” (c) cần câu nêu khó khăn (a) đứng trước.",
w:[["field hospital","bệnh viện dã chiến"],["remote area","vùng hẻo lánh"],["a sense of unity","tinh thần đoàn kết"],["resilience","sự kiên cường"]]};

ANA[38]={r:{b:"Câu chủ đề (lợi ích đi chung xe)",c:"Lợi ích 1: kết nối",a:"Lợi ích 2: giao thông bền vững",d:"Lợi ích 3: giảm ùn tắc",e:"In conclusion"},
v:{a:"Sử dụng chương trình đi chung xe cũng giúp các tổ chức và thành phố thúc đẩy phương thức giao thông bền vững hơn, góp phần chống biến đổi khí hậu.",b:"Đi chung xe mang lại nhiều cơ hội đáng chú ý cho những người đi chung đến nơi làm việc hoặc trường học.",c:"Bằng cách đi chung xe với người khác, người tham gia có thể xây dựng mối quan hệ và tình bạn, tạo tinh thần cộng đồng và hợp tác giữa những người đi lại.",d:"Ngoài ra, đi chung xe có thể giảm ùn tắc giao thông, nghĩa là ít thời gian kẹt xe hơn và chất lượng không khí tốt hơn cho mọi người.",e:"Tóm lại, lựa chọn đi chung xe như một phương thức đi lại khả thi mang lại nhiều lợi ích, từ tiết kiệm chi phí đến bảo vệ môi trường."},
L:["(b) → (c): “several notable opportunities” → lợi ích đầu tiên với cá nhân: kết nối.","(c) → (a): “also” – thêm lợi ích ở cấp độ tổ chức, thành phố.","(a) → (d): “Additionally” – lợi ích tiếp theo.","(d) → (e): “In conclusion”."],
t:"“also” (a) và “Additionally” (d) đều là từ bổ sung, không thể đứng ngay sau câu chủ đề. Lợi ích cá nhân (c) thường được nêu đầu tiên vì (b) nói về “individuals”.",
w:[["carpooling","đi chung xe"],["traffic congestion","ùn tắc giao thông"],["sustainable transportation","giao thông bền vững"],["a viable option","một lựa chọn khả thi"]]};

ANA[39]={r:{b:"Câu chủ đề (STEM quan trọng)",e:"Bằng chứng nghiên cứu",a:"Lợi ích kỹ năng",d:"Furthermore – lợi ích rộng hơn",c:"In conclusion"},
v:{a:"Mang lại trải nghiệm học tập thực hành và các dự án hấp dẫn trong STEM có thể khơi dậy hứng thú của học sinh, giúp các em phát triển tư duy phản biện và giải quyết vấn đề.",b:"Nhiều trường THPT ngày càng nhận ra tầm quan trọng của các chương trình STEM – viết tắt của khoa học, công nghệ, kỹ thuật và toán học – như thành phần thiết yếu của giáo dục hiện đại.",c:"Tóm lại, tích hợp chương trình STEM ở trường THPT là điều thiết yếu để chuẩn bị cho học sinh thành công trong thế giới công nghệ.",d:"Hơn nữa, những trường ưu tiên giáo dục STEM không chỉ chuẩn bị cho học sinh vào thị trường lao động mà còn trang bị công cụ để giải quyết thách thức toàn cầu như biến đổi khí hậu.",e:"Nghiên cứu chỉ ra rằng học sinh tham gia hoạt động STEM có khả năng theo đuổi nghề nghiệp lĩnh vực này cao hơn, với số liệu cho thấy cơ hội việc làm STEM dự kiến tăng 8% từ 2019 đến 2029."},
L:["(b) → (e): (b) giải thích đầy đủ “STEM… which stand for…”, chắc chắn là câu đầu; (e) đưa số liệu chứng minh tầm quan trọng.","(e) → (a): (a) nói cách STEM khơi dậy hứng thú và kỹ năng.","(a) → (d): “Furthermore” – lợi ích rộng hơn.","(d) → (c): “In conclusion”."],
t:"Câu giải nghĩa từ viết tắt “STEM… which stand for science, technology…” luôn là câu mở (b). Loại A, D (mở bằng d có “Furthermore”) và B (mở bằng e).",
w:[["hands-on learning","học tập thực hành"],["ignite students' interest","khơi dậy hứng thú của học sinh"],["critical thinking","tư duy phản biện"],["technology-driven world","thế giới vận hành bởi công nghệ"]]};

ANA[40]={r:{b:"Câu chủ đề (công nghệ cách mạng hóa)",a:"Ví dụ 1: Internet, smartphone",e:"Ví dụ 2: AI, robot, CN sinh học",c:"Thách thức",d:"Kết luận"},
v:{a:"Sự phát triển của Internet và điện thoại thông minh đã kết nối mọi người trên toàn cầu, cho phép giao tiếp tức thì và tiếp cận thông tin.",b:"Công nghệ và đổi mới đã cách mạng hóa cách chúng ta sống, làm việc và giao tiếp.",c:"Tuy nhiên, những thay đổi công nghệ nhanh chóng cũng đặt ra thách thức như mất việc làm và lo ngại về quyền riêng tư.",d:"Cân bằng giữa lợi ích và rủi ro của công nghệ là then chốt cho sự phát triển bền vững.",e:"Những tiến bộ trong trí tuệ nhân tạo, robot và công nghệ sinh học đang làm thay đổi các ngành công nghiệp và tạo ra cơ hội mới."},
L:["(b) → (a): (b) khái quát; (a) ví dụ cụ thể đầu tiên về giao tiếp.","(a) → (e): (e) thêm các tiến bộ khác.","(e) → (c): “However” – mặt trái.","(c) → (d): “Balancing the benefits and risks” – tổng hợp cả lợi ích (a, e) và rủi ro (c) → kết."],
t:"Câu kết tổng hợp hai mặt “benefits and risks” (d) phải đứng sau khi cả lợi ích và rủi ro đã được nêu. Câu chủ đề là câu khái quát nhất (b).",
w:[["revolutionize","cách mạng hóa"],["instant communication","giao tiếp tức thì"],["biotechnology","công nghệ sinh học"],["privacy concerns","lo ngại về quyền riêng tư"]]};

ANA[41]={r:{b:"Câu chủ đề (học ngôn ngữ khó lúc đầu)",d:"Cảm giác nản lúc đầu",a:"However – giai đoạn tiếp theo",c:"Tiến bộ dần",e:"In the end"},
v:{a:"Tuy nhiên, khi nền móng đã được đặt, công việc thật sự mới bắt đầu khi người học xây dựng những hệ thống tư duy và hiểu biết phức tạp hơn.",b:"Học một ngôn ngữ mới là thử thách, nhất là lúc đầu khi người học choáng ngợp bởi quy tắc ngữ pháp và từ vựng xa lạ.",c:"Với sự luyện tập liên tục, người học dần tự tin hơn ở kỹ năng nói, nghe và viết, dù tiến bộ ban đầu có vẻ chậm.",d:"Nhiều người học ngôn ngữ cảm thấy nản lòng ngay từ đầu, nhưng điều quan trọng là phải nhớ rằng sự lưu loát đến cùng thời gian và sự kiên trì.",e:"Cuối cùng, cảm giác thành tựu khi làm chủ một ngôn ngữ khiến mọi nỗ lực đều xứng đáng, mở ra cánh cửa đến những nền văn hóa và cơ hội mới."},
L:["(b) → (d): “challenging… at the beginning” (b) ↔ “frustration early on” (d) – cùng nói về giai đoạn đầu.","(d) → (a): “However, once the foundation is laid” – chuyển sang giai đoạn sau.","(a) → (c): “With continuous practice… gradually” – tiến bộ dần.","(c) → (e): “In the end”."],
t:"Từ đồng nghĩa là manh mối: “at the beginning” ↔ “early on”. Câu mở định nghĩa chủ đề “Learning a new language is challenging” (b). Câu kết “In the end” (e).",
w:[["be overwhelmed by","bị choáng ngợp bởi"],["lay the foundation","đặt nền móng"],["fluency","sự lưu loát"],["a sense of accomplishment","cảm giác thành tựu"]]};

ANA[42]={r:{b:"Câu chủ đề (vấn đề môi trường)",a:"Phản ứng: sáng kiến xanh",c:"However – điều kiện thành công",d:"Giải thích “habits”",e:"Kết luận"},
v:{a:"Để ứng phó, nhiều chính phủ và tổ chức đã đưa ra các sáng kiến xanh, khuyến khích cá nhân áp dụng lối sống thân thiện với môi trường.",b:"Các vấn đề môi trường như ô nhiễm, phá rừng và biến đổi khí hậu đang là mối lo ngày càng lớn trên toàn thế giới.",c:"Tuy nhiên, sự thành công của các chương trình này phụ thuộc rất nhiều vào nhận thức cộng đồng và thói quen hằng ngày.",d:"Những thói quen này bao gồm giảm rác thải, tiết kiệm nước và sử dụng năng lượng tái tạo khi có thể.",e:"Chỉ với nỗ lực chung của cá nhân, cộng đồng và chính quyền, chúng ta mới có thể đảm bảo một tương lai sạch hơn và bền vững hơn."},
L:["(b) → (a): “In response” – phản ứng trước các vấn đề ở (b).","(a) → (c): “these programs” thay cho “green initiatives” ở (a).","(c) → (d): “These habits” thay cho “daily habits” ở (c).","(d) → (e): “Only with a joint effort…” – kết luận."],
t:"Chuỗi đại từ: green initiatives → these programs; daily habits → These habits. Hai cặp này cố định thứ tự a-c-d. Câu “In response” (a) cần một vấn đề đứng trước → (b) mở đầu.",
w:[["green initiatives","các sáng kiến xanh"],["in response","để ứng phó"],["public awareness","nhận thức cộng đồng"],["a joint effort","nỗ lực chung"]]};

ANA[43]={r:{d:"Câu chủ đề (thành phố phát triển)",b:"Hệ quả: lao động nhập cư",e:"However – hạ tầng chưa theo kịp",c:"Vấn đề cụ thể",a:"Kết luận: cần quy hoạch"},
v:{a:"Những vấn đề kéo dài này cho thấy rõ nhu cầu cấp thiết về quy hoạch đô thị hiệu quả hơn và chiến lược dài hạn để hỗ trợ phát triển bền vững.",b:"Sự tăng trưởng đô thị nhanh chóng này đã thu hút hàng nghìn lao động từ các tỉnh nông thôn lân cận tìm kiếm cơ hội tốt hơn.",c:"Ùn tắc giao thông và thiếu nhà ở giờ đây đã trở thành những thách thức lớn mà chính quyền thành phố khó kiểm soát.",d:"Những năm gần đây, trung tâm thành phố chứng kiến sự gia tăng mạnh mẽ các tòa nhà cao tầng, khu mua sắm và hệ thống giao thông mới.",e:"Tuy nhiên, tốc độ phát triển hạ tầng đã không theo kịp nhu cầu ngày càng tăng của dân số."},
L:["(d) → (b): “This rapid urban growth” thay cho sự gia tăng nhà cao tầng… ở (d).","(b) → (e): “However” – dân số tăng nhưng hạ tầng không theo kịp.","(e) → (c): (c) nêu cụ thể hậu quả: ùn tắc, thiếu nhà.","(c) → (a): “These ongoing problems” tóm lại (c) → kết luận."],
t:"“This rapid urban growth” (b) không thể mở đoạn → loại B. “These ongoing problems” (a) đứng ngay sau câu liệt kê vấn đề (c) và ở cuối đoạn.",
w:[["high-rise buildings","nhà cao tầng"],["traffic congestion","ùn tắc giao thông"],["housing shortage","tình trạng thiếu nhà ở"],["urban planning","quy hoạch đô thị"]]};

ANA[44]={r:{b:"Định nghĩa (câu chủ đề)",d:"Phạm vi: từ chính quy đến tự học",a:"However – không chỉ là bằng cấp",c:"Lý do quan trọng",e:"In conclusion"},
v:{a:"Tuy nhiên, học tập suốt đời không chỉ là đạt được bằng cấp mà còn là nuôi dưỡng sự tò mò và khả năng thích nghi.",b:"Học tập suốt đời là một quá trình liên tục giúp mỗi người phát triển về chuyên môn và cá nhân trong suốt cuộc đời.",c:"Khi công nghệ phát triển nhanh chóng, khả năng học và học lại đã trở thành kỹ năng then chốt trong thế giới hiện đại.",d:"Từ giáo dục chính quy đến tự học, nó mang lại vô số cơ hội phát triển và hoàn thiện.",e:"Tóm lại, theo đuổi học tập suốt đời giúp chúng ta luôn phù hợp, thích nghi và cởi mở với thử thách mới trong một thế giới không ngừng thay đổi."},
L:["(b) → (d): đại từ “it” ở (d) thay cho “Lifelong learning” ở (b); “From formal education to self-directed learning” cụ thể hóa “ongoing process”.","(d) → (a): (d) nhắc tới “formal education” (gắn với bằng cấp) → (a) “however, not merely about acquiring qualifications”.","(a) → (c): “adaptability” ở (a) → (c) giải thích vì sao khả năng “learn and relearn” quan trọng.","(c) → (e): “In conclusion”."],
t:"Đại từ “it” (d) cần đứng ngay sau câu có danh từ gốc (b). (Tài liệu gốc ghi C (b-a-c-d-e), nhưng khi đó “it” ở (d) bị tách xa danh từ gốc và “however” ở (a) không có ý đối lập phía trước; A là phương án hợp lý hơn.)",
w:[["lifelong learning","học tập suốt đời"],["self-directed learning","tự học"],["acquire qualifications","đạt được bằng cấp"],["learn and relearn","học và học lại"]]};

ANA[45]={r:{c:"Định nghĩa: sốc văn hóa",b:"Giai đoạn đầu → nhận ra khác biệt",a:"Ví dụ về khác biệt",e:"Cảm xúc tiêu cực",d:"Kết luận"},
v:{a:"Ví dụ, những hành vi được chấp nhận ở nền văn hóa này, như nhìn thẳng vào mắt, có thể bị coi là bất lịch sự ở nền văn hóa khác.",b:"Ban đầu, mọi người có thể hào hứng khám phá nền văn hóa mới, nhưng sự hào hứng ban đầu thường phai nhạt khi họ bắt đầu nhận ra khác biệt về ngôn ngữ, phong tục và chuẩn mực xã hội.",c:"Sốc văn hóa, xảy ra khi một người gặp khó khăn trong việc thích nghi với văn hóa nước ngoài, là trải nghiệm phổ biến với du khách và người sống ở nước ngoài.",d:"Giai đoạn điều chỉnh này có thể khó khăn, nhưng cuối cùng giúp mỗi người hiểu sâu sắc và tôn trọng sự đa dạng văn hóa hơn.",e:"Những khác biệt như vậy có thể dẫn đến cảm giác thất vọng, bối rối hoặc thậm chí cô lập đối với người mới đến."},
L:["(c) → (b): (c) định nghĩa; (b) “At first” – mô tả giai đoạn đầu.","(b) → (a): “For example” minh họa “differences in customs and social norms” ở (b).","(a) → (e): “Such differences” thay cho ví dụ ở (a).","(e) → (d): “This period of adjustment” – kết luận."],
t:"“At first” (b) là mốc bắt đầu quá trình; “Such differences” (e) phải đứng sau ví dụ về khác biệt (a). Loại A, C vì đặt e/a trước b.",
w:[["culture shock","sốc văn hóa"],["expatriates","người sống ở nước ngoài"],["social norms","chuẩn mực xã hội"],["a period of adjustment","giai đoạn điều chỉnh, thích nghi"]]};

ANA[46]={r:{d:"Câu chủ đề (Redmond thay đổi)",b:"Thay đổi 1: công nghiệp hóa",c:"Thay đổi 2: doanh nghiệp mới",e:"Thay đổi 3: dân số",a:"Hạn chế: chưa có bệnh viện"},
v:{a:"Tuy nhiên, dù phát triển như vậy, Redmond vẫn chưa có bệnh viện, bệnh viện gần nhất cách hơn 30 dặm ở Longreach.",b:"Những công viên từng rất nhiều trên phố Oak và đại lộ Richmond đã bị thay thế bằng nhà máy, đánh dấu sự chuyển dịch sang công nghiệp hóa.",c:"Sự chuyển dịch công nghiệp cũng thu hút các doanh nghiệp mới, từ khu trò chơi đến cửa hàng và nhà máy, thúc đẩy kinh tế địa phương.",d:"Redmond đã thay đổi đáng kể trong thập kỷ qua.",e:"Sự tăng trưởng công nghiệp này đã dẫn đến bùng nổ dân số 25% do lượng lớn công nhân nhà máy đổ về, gây ùn tắc giao thông."},
L:["(d) → (b): (d) nêu chủ đề; (b) thay đổi đầu tiên “a shift towards industrialization”.","(b) → (c): “The industrial shift has also…” nhắc lại “shift towards industrialization” ở (b).","(c) → (e): “This industrial growth” – hệ quả tiếp theo về dân số.","(e) → (a): “However, despite this growth” – hạn chế khép lại đoạn."],
t:"Lặp từ khóa: “shift towards industrialization” (b) → “The industrial shift” (c) → “This industrial growth” (e). “However, despite this growth” (a) đứng cuối.",
w:[["industrialization","công nghiệp hóa"],["boost the local economy","thúc đẩy kinh tế địa phương"],["population boom","bùng nổ dân số"],["an influx of","sự đổ về ồ ạt của"]]};

ANA[47]={r:{d:"Mở đầu: đam mê → nghề",c:"Indeed – kinh nghiệm thực tế",b:"Ưu điểm làm từ xa",a:"Nhược điểm nhỏ",e:"In conclusion"},
v:{a:"Dù hạn chót và sự linh hoạt là những yếu tố cốt lõi của công việc này, những buổi họp ở văn phòng thỉnh thoảng để cập nhật dự án chỉ là sự đánh đổi nhỏ.",b:"Làm việc từ xa tại nhà khơi nguồn sáng tạo và tạo môi trường làm việc hiệu quả hơn.",c:"Thật vậy, trong năm qua, tôi đã phát triển mạnh ở vị trí này tại một công ty địa phương, nơi tôi sáng tạo nội dung trực tuyến hấp dẫn và xây dựng chiến lược hiệu quả.",d:"Niềm đam mê với con người và công nghệ đã đưa tôi đến với sự nghiệp quản lý mạng xã hội đầy ý nghĩa.",e:"Tóm lại, tôi vô cùng hài lòng với vị trí hiện tại và những cơ hội nó mang lại, vì nó kết hợp hoàn hảo sở thích và kỹ năng của tôi."},
L:["(d) → (c): “this role” ở (c) chỉ “social media management” ở (d); “Indeed” khẳng định thêm.","(c) → (b): (b) nêu ưu điểm của hình thức làm việc.","(b) → (a): “While… a small trade-off” – nhắc nhược điểm nhỏ.","(a) → (e): “In conclusion”."],
t:"“this role” (c) và “this job” (a) đều cần câu nêu tên nghề (d) đứng trước → (d) mở đầu. Loại A, B, C.",
w:[["social media management","quản lý mạng xã hội"],["thrive in a role","phát triển mạnh ở một vị trí"],["a trade-off","sự đánh đổi"],["work remotely","làm việc từ xa"]]};

ANA[48]={r:{b:"Câu chủ đề (Hillcrest thay đổi)",d:"Hệ quả: thu hút người trẻ",a:"Mở rộng khu mua sắm",c:"However – giá nhà tăng",e:"Hạn chế: thiếu tiện ích"},
v:{a:"Khu mua sắm của thị trấn cũng mở rộng, với nhiều cửa hàng và quán cà phê mới dọc phố Main.",b:"Vài năm qua, Hillcrest đã thay đổi mạnh mẽ với sự tăng trưởng nhanh và nhiều doanh nghiệp mới mở.",c:"Tuy nhiên, sự mở rộng đã khiến giá bất động sản tăng, khiến cư dân lâu năm khó trang trải chi phí sinh sống.",d:"Sự bùng nổ kinh tế này đã thu hút những người trẻ đi làm, làm tăng nhu cầu về nhà ở và giải trí.",e:"Bất chấp những cải thiện này, Hillcrest vẫn thiếu những tiện ích cơ bản như trung tâm cộng đồng hay bệnh viện mà cư dân yêu cầu từ lâu."},
L:["(b) → (d): “This economic boom” thay cho “rapid growth and new businesses” ở (b).","(d) → (a): “also expanded” – thêm sự thay đổi về khu mua sắm (đáp ứng nhu cầu giải trí ở d).","(a) → (c): “However, the expansion” – mặt trái của sự mở rộng ở (a).","(c) → (e): “Despite these improvements” – hạn chế cuối cùng."],
t:"Câu mở có tên riêng + mốc “Over the past few years” (b). “the expansion” (c) nhắc lại “has also expanded” (a) → a đứng ngay trước c.",
w:[["change drastically","thay đổi mạnh mẽ"],["economic boom","sự bùng nổ kinh tế"],["rising property prices","giá bất động sản tăng"],["longtime residents","cư dân lâu năm"]]};

ANA[49]={r:{b:"Mở đầu: sở thích → nghề",c:"Quá trình phát triển",d:"Môi trường áp lực nhưng đáng giá",a:"Lợi thế: nền tảng thiết kế",e:"In summary"},
v:{a:"Nền tảng thiết kế đồ họa của tôi đã vô cùng hữu ích trong vai trò hiện tại.",b:"Tôi luôn có niềm yêu thích sâu sắc với nghệ thuật và công nghệ, điều đã dẫn tôi đến sự nghiệp marketing kỹ thuật số.",c:"Trong hai năm qua, tôi đã trưởng thành vượt bậc, phát triển kỹ năng và đóng góp vào nhiều dự án.",d:"Dù làm việc trong môi trường nhịp độ nhanh có thể đòi hỏi cao, tôi thấy nó vô cùng đáng giá.",e:"Tóm lại, tôi rất hào hứng với hành trình đến nay và với những cơ hội phía trước."},
L:["(b) → (c): (b) nêu lý do chọn nghề; (c) “Over the last two years” – quá trình làm việc.","(c) → (d): (d) chia sẻ cảm nhận về môi trường làm việc.","(d) → (a): (a) nêu thế mạnh giúp tác giả làm tốt “in my current role”.","(a) → (e): “In summary”."],
t:"Câu mở giải thích “led me to pursue a career” (b). “In summary” (e) đứng cuối. Chỉ D mở bằng b.",

ANA[50]={r:{c:"Mở đầu: bản sắc văn hóa",b:"Chọn ngôn ngữ + có nhiều lý do",d:"Lý do 1: đoàn kết",a:"Lý do 2: tự hào lịch sử",e:"Lý do 3: giao tiếp, chia sẻ văn hóa"},

L:["(b) → (c): “This shift” thay cho “significant progress” ở (b).","(c) → (d): (d) nêu các chủ thể đã thúc đẩy (“advocated”).","(d) → (a): “Despite these efforts” – “these efforts” chỉ hoạt động vận động ở (d).","(a) → (e): “Nevertheless” – vẫn cần nỗ lực → kết luận."],
