["Let's meet on Saturday morning to check our progress.","Sáng thứ Bảy mình gặp nhau để kiểm tra tiến độ nhé.","Hẹn – kết thư"]],
L:["Sau tin vui là việc cần làm: chia việc.","Phân công nhóm thứ nhất.","“Meanwhile” – nhóm thứ hai làm song song.","Hẹn gặp kiểm tra tiến độ → kết thư."],
t:"“Meanwhile” chỉ việc diễn ra song song – phải đứng sau một phân công khác. Câu chuyển ý “Now we need to divide the work” đứng giữa tin vui và phân công.",
w:[["rice straw","rơm rạ"],["divide the work","chia việc"],["check our progress","kiểm tra tiến độ"]]},

{ty:"Thư hỏi anh chị về đời sống đại học (University life)",open:"Dear Phuong,",close:"Thanks in advance,<br>Your cousin Nhi",ok:"baedc",
seq:[["I hope you're enjoying your second year at the University of Economics.","Em mong chị đang vui với năm hai ở Đại học Kinh tế.","Hỏi thăm"],
["As you know, I'm thinking of applying there too, so I'd love to hear about your experience.","Như chị biết, em cũng đang tính nộp hồ sơ vào trường đó, nên em rất muốn nghe kinh nghiệm của chị.","Lý do viết thư"],
["What surprised you most when you first started university?","Điều gì khiến chị bất ngờ nhất khi mới vào đại học?","Câu hỏi 1"],
["I'm also wondering whether it's easy to find a part-time job near campus.","Em cũng đang băn khoăn liệu tìm việc làm thêm gần trường có dễ không.","Câu hỏi 2"],
["Any advice you can give me would be really helpful.","Bất kỳ lời khuyên nào của chị cũng sẽ rất hữu ích với em.","Lời cảm ơn trước – kết thư"]],
L:["“there” = the University of Economics; nêu lý do viết thư.","“your experience” → câu hỏi đầu tiên.","“also” – câu hỏi thứ hai.","Câu kết của thư xin lời khuyên."],
t:"Trạng từ “there” cần tên trường đứng trước. Câu “Any advice… would be really helpful” là câu kết quen thuộc của thư xin tư vấn.",
w:[["apply there","nộp hồ sơ vào đó"],["campus","khuôn viên trường"],["Any advice would be helpful.","Mọi lời khuyên đều hữu ích."]]},

// ---- XIN LỖI ----
{ty:"Thư xin lỗi quên sinh nhật (Forgotten birthday)",open:"Dear Nga,",close:"Your forgetful friend,<br>Thuy",ok:"dbcea",
seq:[["I'm so sorry I forgot your birthday yesterday – I feel awful about it.","Tớ rất xin lỗi vì quên sinh nhật cậu hôm qua – tớ thấy tệ lắm.","Lời xin lỗi"],
["I've been so busy preparing for the maths contest that I completely lost track of the date.","Tớ bận ôn thi toán đến mức quên mất cả ngày tháng.","Lý do"],
["That's not a good excuse, though, because you never forget mine.","Dù vậy, đó không phải lý do chính đáng, vì cậu chẳng bao giờ quên sinh nhật tớ.","Nhận lỗi"],
["To make it up to you, I'd like to take you out for hotpot this weekend – my treat!","Để chuộc lỗi, tớ muốn mời cậu đi ăn lẩu cuối tuần này – tớ khao!","Bù đắp"],
["Happy belated birthday, and I hope you can forgive me!","Chúc mừng sinh nhật muộn nhé, mong cậu tha thứ cho tớ!","Lời chúc – kết thư"]],
L:["Sau lời xin lỗi là lý do: bận ôn thi.","“That's not a good excuse, though” – “That” = lý do vừa nêu; người viết tự nhận lỗi.","“To make it up to you” – đề nghị bù đắp.","Lời chúc muộn và mong được tha thứ kết thư."],
t:"“That's not a good excuse” phải đứng ngay sau câu đưa ra lý do. “Happy belated birthday” là lời chúc muộn – đặt cuối thư xin lỗi.",
w:[["lose track of","mất dấu, quên mất"],["make it up to sb","bù đắp cho ai"],["belated","muộn"]]},

{ty:"Thư xin lỗi làm mất sách (Lost book)",open:"Dear Mr. Long,",close:"Yours sincerely,<br>Nguyen Bao Tram",ok:"aedbc",
seq:[["I am very sorry to tell you that I have lost the dictionary you kindly lent me last month.","Em rất xin lỗi phải báo với thầy rằng em đã làm mất cuốn từ điển thầy cho em mượn tháng trước.","Lời xin lỗi"],
["I think I left it on the bus on my way home from school.","Em nghĩ em đã để quên nó trên xe buýt trên đường đi học về.","Sự việc"],
["I have contacted the bus company, but unfortunately nobody has handed it in.","Em đã liên hệ công ty xe buýt nhưng tiếc là không ai trả lại.","Đã tìm cách khắc phục"],
["I know the book was a gift from your daughter, which makes me feel even worse.","Em biết cuốn sách là quà con gái thầy tặng, điều đó khiến em càng thấy có lỗi.","Cảm xúc"],
["I have ordered a new copy of the same edition, which should arrive on Thursday.","Em đã đặt một cuốn mới cùng phiên bản, dự kiến đến vào thứ Năm.","Bù đắp – kết thư"]],
L:["“it” = the dictionary; kể nơi có thể để quên.","Đã liên hệ công ty xe buýt nhưng không tìm lại được.","“even worse” – cảm giác có lỗi tăng thêm vì giá trị tinh thần của cuốn sách.","Hành động bù đắp cụ thể → kết thư."],
t:"Thư xin lỗi trang trọng: Xin lỗi → Sự việc → Đã khắc phục → Cảm xúc → Bù đắp. “even worse” cần cảm giác có lỗi đã được nêu trước.",
w:[["hand sth in","nộp lại, trả lại (đồ nhặt được)"],["a new copy","một cuốn mới"],["edition","phiên bản (sách)"]]},

{ty:"Thư làm hòa sau cãi nhau (After an argument)",open:"Hi Bach,",close:"Still your best mate,<br>Son",ok:"cdbae",
seq:[["I've been thinking a lot about what happened at football practice on Tuesday.","Tớ nghĩ nhiều về chuyện xảy ra ở buổi tập bóng đá hôm thứ Ba.","Mở đầu"],
["I shouldn't have shouted at you in front of the whole team, and I'm really sorry.","Đáng lẽ tớ không nên quát cậu trước cả đội, tớ thực sự xin lỗi.","Lời xin lỗi"],
["I was angry about losing the match, but that was no reason to blame you.","Tớ bực vì thua trận, nhưng đó không phải lý do để đổ lỗi cho cậu.","Giải thích – nhận lỗi"],
["You're the best goalkeeper we have, and our team needs you.","Cậu là thủ môn giỏi nhất của đội, và đội cần cậu.","Khẳng định giá trị"],
["Can we put this behind us and grab a drink after school tomorrow?","Mình bỏ qua chuyện này và đi uống nước sau giờ học mai nhé?","Đề nghị làm hòa – kết thư"]],
L:["“what happened” được làm rõ bằng lời xin lỗi về việc quát bạn.","Giải thích nguyên nhân và tự nhận lỗi: “no reason to blame you”.","Khẳng định giá trị của bạn với đội.","“put this behind us” – đề nghị làm hòa kết thư."],
t:"Câu mở gợi chuyện “what happened…” rồi mới xin lỗi cụ thể. Câu “Can we put this behind us…?” luôn đứng cuối thư làm hòa.",
w:[["shouldn't have + V3","đáng lẽ không nên"],["blame sb","đổ lỗi cho ai"],["put sth behind us","bỏ qua chuyện gì"]]},

{ty:"Thư xin lỗi hủy hẹn (Cancelled plan)",open:"Dear Oanh,",close:"Sorry again,<br>Thao",ok:"ebdca",
seq:[["I'm afraid I won't be able to go to the cinema with you on Saturday after all.","Tớ e là cuối cùng tớ không thể đi xem phim với cậu thứ Bảy này được.","Thông báo hủy"],
["My cousin's family is visiting from Ho Chi Minh City, and my parents want me to stay home.","Nhà anh họ tớ từ TP. Hồ Chí Minh ra chơi, và bố mẹ muốn tớ ở nhà.","Lý do"],
["I know you had already bought the tickets, so I'll pay you back for mine.","Tớ biết cậu đã mua vé rồi, nên tớ sẽ trả lại tiền vé của tớ.","Bù đắp"],
["Maybe you could ask Huong to go instead – she's been wanting to see that film too.","Có lẽ cậu rủ Hương đi thay – bạn ấy cũng đang muốn xem phim đó.","Gợi ý"],
["Let's plan something fun for next weekend to make up for it!","Cuối tuần sau mình lên kế hoạch gì đó vui để bù nhé!","Hẹn – kết thư"]],
L:["Sau thông báo hủy là lý do.","Bù đắp thiệt hại: trả lại tiền vé.","“instead” – gợi ý người đi thay để vé không lãng phí.","“make up for it” – hẹn bù vào tuần sau."],
t:"Câu “I'm afraid I won't be able to…” mở thư hủy hẹn. “instead” trong câu gợi ý người thay thế phải đứng sau khi đã nói về vé.",
w:[["I'm afraid…","Tớ e là…"],["after all","rốt cuộc, cuối cùng"],["pay sb back","trả lại tiền cho ai"]]},

{ty:"Thư xin lỗi đến muộn (Late for a meeting)",open:"Dear Ms. Lien,",close:"Yours sincerely,<br>Truong Minh Quan",ok:"bcade",
seq:[["Please accept my apologies for arriving forty minutes late to the club meeting this afternoon.","Xin cô nhận lời xin lỗi của em vì đã đến muộn bốn mươi phút buổi họp câu lạc bộ chiều nay.","Lời xin lỗi"],
["On my way to school, my bicycle got a flat tyre, and I had to push it to a repair shop.","Trên đường đến trường, xe đạp của em bị thủng lốp và em phải dắt đến tiệm sửa.","Lý do"],
["Unfortunately, my phone battery was dead, so I could not let you know.","Không may điện thoại em hết pin nên em không thể báo cô.","Lý do không báo trước"],
["I understand that my lateness delayed the planning of the school festival.","Em hiểu rằng việc em đến muộn đã làm chậm việc lên kế hoạch cho lễ hội trường.","Nhận hậu quả"],
["To catch up, I will finish the budget plan tonight and email it to you before 9 p.m.","Để bù lại, tối nay em sẽ hoàn thành kế hoạch ngân sách và gửi email cho cô trước 9 giờ.","Bù đắp – kết thư"]],
L:["Sau lời xin lỗi là lý do đến muộn: thủng lốp xe.","“Unfortunately” – lý do thứ hai: không thể báo trước.","Nhận hậu quả của việc đến muộn.","“To catch up” – hành động bù đắp cụ thể."],
t:"“Please accept my apologies for…” là câu mở xin lỗi trang trọng. Thư xin lỗi tốt luôn kết bằng hành động khắc phục cụ thể.",
w:[["Please accept my apologies for…","Xin nhận lời xin lỗi của tôi vì…"],["a flat tyre","lốp bị xẹp/thủng"],["catch up","bù lại phần chậm"]]},

// ---- LỜI KHUYÊN ----
{ty:"Thư khuyên bạn đừng bỏ câu lạc bộ (Quitting the club)",open:"Dear Hai,",close:"Your friend,<br>Nam",ok:"cbeda",
seq:[["I was surprised to hear that you're thinking of leaving the robotics club.","Tớ bất ngờ khi nghe cậu định rời câu lạc bộ robot.","Phản hồi"],
["I understand that losing the competition last month was disappointing.","Tớ hiểu thua cuộc thi tháng trước thật thất vọng.","Đồng cảm"],
["However, everyone said your design for the robot arm was the most creative in the contest.","Tuy nhiên, ai cũng nói thiết kế cánh tay robot của cậu sáng tạo nhất cuộc thi.","Phản biện"],
["If you leave now, you'll miss the chance to improve it for next year's competition.","Nếu bỏ bây giờ, cậu sẽ mất cơ hội cải tiến nó cho cuộc thi năm sau.","Hệ quả nếu bỏ"],
["Why not give it one more term before you decide?","Sao không thử thêm một học kỳ nữa rồi hãy quyết định?","Lời khuyên – kết thư"]],
L:["Sau phản hồi, người viết thể hiện sự đồng cảm với nỗi thất vọng.","“However” – lật lại vấn đề bằng điểm mạnh của bạn.","“improve it” – “it” = thiết kế cánh tay robot.","“Why not…?” – lời khuyên nhẹ nhàng kết thư."],
t:"Thư khuyên nhủ: Phản hồi → Đồng cảm (I understand…) → However (điểm sáng) → Hệ quả nếu bỏ → Lời khuyên (Why not…?).",
w:[["be thinking of + V-ing","đang tính làm gì"],["disappointing","đáng thất vọng"],["Why not…?","Sao không…?"]]},

{ty:"Thư khuyên em họ nhớ nhà (Homesick cousin)",open:"Dear Dung,",close:"Love,<br>Your cousin Thao",ok:"debac",
seq:[["Your mum told me that you've been feeling homesick since you moved into the school dormitory.","Mẹ em kể chị nghe là em nhớ nhà từ khi chuyển vào ký túc xá.","Lý do viết thư"],
["Don't worry – I felt exactly the same during my first month at boarding school.","Đừng lo – chị cũng y hệt vậy trong tháng đầu ở trường nội trú.","Đồng cảm"],
["What helped me most was joining a club, because it kept me busy and helped me make friends.","Điều giúp chị nhiều nhất là tham gia một câu lạc bộ, vì nó khiến chị bận rộn và giúp chị kết bạn.","Lời khuyên 1"],
["Another good idea is to call home at a fixed time each week rather than every night.","Một ý hay khác là gọi về nhà vào giờ cố định mỗi tuần thay vì tối nào cũng gọi.","Lời khuyên 2"],
["Believe me, in a few weeks the dormitory will start to feel like home.","Tin chị đi, vài tuần nữa ký túc xá sẽ bắt đầu giống như nhà.","Động viên – kết thư"]],
L:["Từ việc biết tin, người viết đồng cảm bằng trải nghiệm của bản thân.","Kinh nghiệm cá nhân dẫn đến lời khuyên đầu tiên: “What helped me most”.","“Another good idea” – lời khuyên thứ hai.","“Believe me” – lời động viên kết thư."],
t:"“What helped me most” (lời khuyên quan trọng nhất) đứng trước “Another good idea”. Câu động viên “Believe me…” khép thư.",
w:[["homesick","nhớ nhà"],["dormitory","ký túc xá"],["boarding school","trường nội trú"]]},

{ty:"Thư khuyên em nghiện điện thoại (Screen time)",open:"Hi Tin,",close:"Your big sister,<br>Na",ok:"aecbd",
seq:[["Mum says you've been spending up to six hours a day on your phone since the summer holiday began.","Mẹ bảo từ khi nghỉ hè em dùng điện thoại tới sáu tiếng mỗi ngày.","Lý do viết thư"],
["I'm not writing to tell you off, because I used to have the same problem.","Chị không viết để mắng em đâu, vì chị cũng từng như vậy.","Đồng cảm"],
["What worked for me was turning off notifications and leaving my phone in another room while studying.","Cách hiệu quả với chị là tắt thông báo và để điện thoại ở phòng khác khi học.","Lời khuyên 1"],
["You could also set a daily limit using the phone's screen time settings.","Em cũng có thể đặt giới hạn hằng ngày bằng cài đặt thời gian sử dụng của điện thoại.","Lời khuyên 2"],
["When I come home next week, let's go cycling together instead of staring at screens!","Tuần sau chị về, mình đạp xe cùng nhau thay vì dán mắt vào màn hình nhé!","Hẹn – kết thư"]],
L:["“tell you off” – người viết nói rõ không trách mắng, vì từng gặp vấn đề tương tự.","“What worked for me” – kinh nghiệm bản thân → lời khuyên.","“also” – lời khuyên thứ hai.","Hẹn hoạt động thay thế → kết thư."],
t:"“the same problem” cần câu nêu vấn đề đứng trước. “also” xếp lời khuyên thứ hai sau lời khuyên thứ nhất.",
w:[["tell sb off","mắng ai"],["turn off notifications","tắt thông báo"],["stare at screens","dán mắt vào màn hình"]]},

{ty:"Thư khuyên tiết kiệm tiền (Saving money)",open:"Dear Hoa,",close:"Best,<br>Diep",ok:"bdcea",
seq:[["Thanks for your letter – I'd be happy to give you some tips on saving for your new bike.","Cảm ơn thư của cậu – tớ sẵn lòng chia sẻ vài mẹo tiết kiệm mua xe đạp mới.","Phản hồi"],
["First, write down everything you spend for two weeks so you can see where your money goes.","Trước tiên, ghi lại mọi khoản chi trong hai tuần để biết tiền mình tiêu vào đâu.","Lời khuyên 1"],
["You'll probably find that small things, like bubble tea, add up to a surprising amount.","Có lẽ cậu sẽ thấy những thứ nhỏ như trà sữa cộng lại thành một khoản đáng ngạc nhiên.","Kết quả dự đoán"],
["Next, put a fixed amount into a savings box as soon as you get your pocket money.","Tiếp theo, bỏ một khoản cố định vào ống tiết kiệm ngay khi nhận tiền tiêu vặt.","Lời khuyên 2"],
["If you stick to this plan, you should have enough by Tet!","Nếu kiên trì với kế hoạch này, đến Tết cậu sẽ đủ tiền!","Động viên – kết thư"]],
L:["“First” – lời khuyên đầu tiên.","Kết quả của việc ghi chép: phát hiện khoản chi nhỏ cộng dồn.","“Next” – lời khuyên thứ hai.","“this plan” gói lại hai bước → động viên kết thư."],
t:"Từ nối First → Next xác định thứ tự lời khuyên. Câu về trà sữa minh họa kết quả của việc ghi chép nên đứng ngay sau “First”.",
w:[["add up to","cộng lại thành"],["pocket money","tiền tiêu vặt"],["stick to","kiên trì với"]]},

{ty:"Thư khuyên kết bạn ở trường mới (New school)",open:"Hi Linh,",close:"Miss you,<br>Mai",ok:"ecadb",
seq:[["I'm sorry you're finding it hard to make friends at your new school.","Tớ tiếc khi biết cậu thấy khó kết bạn ở trường mới.","Đồng cảm"],
["Remember that it usually takes a few weeks for people to get to know a new classmate.","Nhớ rằng thường mất vài tuần để mọi người làm quen với một bạn mới.","Trấn an"],
["In the meantime, try to sit with different people at lunch and ask them about their hobbies.","Trong lúc đó, cậu thử ngồi ăn trưa với những bạn khác nhau và hỏi về sở thích của họ.","Lời khuyên 1"],
["Joining the volleyball team could also help, since you're so good at it.","Tham gia đội bóng chuyền cũng có thể giúp ích, vì cậu chơi giỏi mà.","Lời khuyên 2"],
["Just be yourself – anyone would be lucky to have you as a friend!","Cứ là chính mình – ai có cậu làm bạn cũng là may mắn!","Động viên – kết thư"]],
L:["Sau lời đồng cảm là lời trấn an: cần thời gian.","“In the meantime” – trong thời gian chờ đợi đó, hãy chủ động.","“also” – cách thứ hai: vào đội bóng chuyền.","“Just be yourself” – lời động viên kết thư."],
t:"“In the meantime” cần một khoảng thời gian được nhắc trước (“a few weeks”). “also” đặt lời khuyên thứ hai sau lời khuyên thứ nhất.",
w:[["make friends","kết bạn"],["in the meantime","trong lúc đó"],["be yourself","là chính mình"]]},

{ty:"Thư khuyên chọn máy tính (Choosing a laptop)",open:"Dear Uncle Tam,",close:"Thank you,<br>Quang",ok:"cabed",
seq:[["Thank you for offering to help me choose a laptop for university.","Cháu cảm ơn chú đã nhận lời giúp cháu chọn máy tính cho đại học.","Lời cảm ơn"],
["I'll be studying architecture, so I'll need to run design software like AutoCAD.","Cháu sẽ học kiến trúc nên cần chạy phần mềm thiết kế như AutoCAD.","Nhu cầu"],

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtOrder(o){return o.split("").join(" – ")}
function correctOrder(it){return it.opts[it.key]}
function itemById(id){for(const b in BANK){const f=BANK[b].items.find(x=>x.id===id);if(f)return f}return null}
function branchOf(id){for(const b in BANK){if(BANK[b].items.some(x=>x.id===id))return b}return null}

function leaveExamOk(){

$("#btnHL").addEventListener("click",()=>{

$("#btnClearHL").addEventListener("click",()=>{
  const it=currentItem(); if(!it)return;
  delete S.marks[it.id];
  document.querySelectorAll(".sentences .w.hl").forEach(w=>w.classList.remove("hl"));
  toast("Đã xóa highlight của câu này.");

function saveMarks(it){
  const arr=[...document.querySelectorAll(".sentences .w")].map((w,i)=>w.classList.contains("hl")?i:-1).filter(i=>i>=0);
  S.marks[it.id]=arr;
}
function bindHighlight(box,it){
  box.addEventListener("mouseup",()=>{
    if(!S.hl)return;
    const sel=window.getSelection();
    if(sel && !sel.isCollapsed && sel.rangeCount){
      const r=sel.getRangeAt(0);
      const ws=[...box.querySelectorAll(".w")].filter(w=>r.intersectsNode(w));
      if(ws.length){const allOn=ws.every(w=>w.classList.contains("hl"));ws.forEach(w=>w.classList.toggle("hl",!allOn));}
      sel.removeAllRanges(); saveMarks(it); box._dragged=true; setTimeout(()=>box._dragged=false,50);
    }
  });
  box.addEventListener("click",e=>{
    if(!S.hl||box._dragged)return;
    const w=e.target.closest(".w"); if(!w)return;
    w.classList.toggle("hl"); saveMarks(it);
  });
}
function wrapWords(text,counter){
  return text.split(/(\s+)/).map(t=>{
    if(/^\s+$/.test(t)||t==="")return t;
    return `<span class="w" data-i="${counter.n++}">${esc(t)}</span>`;
  }).join("");
}

/* ---------- Phân tích tự động bẫy sai ---------- */
function trapNotes(it){
  const ok=correctOrder(it), r=it.ana.r, out=[];
  it.opts.forEach((o,i)=>{
    if(i===it.key)return;
    let why;
    if(o[0]!==ok[0]) why=`Sai ngay từ câu mở đầu: câu (${o[0]}) là “${r[o[0]]}”, không thể mở ${it.cat==="letter"?"bức thư":"đoạn văn"}; câu mở đúng phải là (${ok[0]}).`;
    else if(o[o.length-1]!==ok[ok.length-1]) why=`Sai ở câu kết: (${o[o.length-1]}) là “${r[o[o.length-1]]}”, không làm nhiệm vụ khép lại; câu kết đúng là (${ok[ok.length-1]}) – “${r[ok[ok.length-1]]}”.`;
    else{
      let k=0; while(k<o.length&&o[k]===ok[k])k++;
      why=`Đứt mạch ở vị trí thứ ${k+1}: sau (${o[k-1]}) phương án này đặt (${o[k]}), nhưng mắt xích đúng là (${o[k-1]}) → (${ok[k]}). Xem lại phần giải mã bên trên.`;
    }
    out.push(`<li><b>${LET[i]}. ${fmtOrder(o)}</b>: ${why}</li>`);
  });
  return out.join("");
}
function analysisHTML(it){
  const ok=correctOrder(it), a=it.ana;
  const en = ok.split("").map(k=>`<p><span class="tag">${k}</span>${esc(it.s[k])}</p>`).join("");
  const vi = ok.split("").map(k=>`<p><span class="tag">${k}</span>${esc(a.v[k])}</p>`).join("");
  const isL=it.cat==="letter";
  const enFull = isL?`<p><i>${esc(it.open)}</i></p>${en}<p><i>${it.close}</i></p>`:en;
  const viFull = isL?`<p><i>(Lời chào mở đầu)</i></p>${vi}<p><i>(Lời chào kết thư & ký tên)</i></p>`:vi;
  let flow = ok.split("").map(k=>`<div class="st"><b>(${k})</b> ${esc(a.r[k])}</div>`).join('<span class="ar">→</span>');
  if(isL) flow = `<div class="st"><b>Lời chào</b> ${esc(it.open)}</div><span class="ar">→</span>`+flow+`<span class="ar">→</span><div class="st"><b>Ký tên</b></div>`;
  const general = isL
    ? "Khung chuẩn của thư: <b>Lời chào → Lý do viết thư → Chi tiết nội dung → Kêu gọi hành động / Lời chúc → Ký tên</b>."
    : it.ty==="c" ? "Khung chuẩn của đoạn mô tả biểu đồ: <b>Câu giới thiệu (The chart shows/illustrates…) → Tổng quan (Overall…) → Chi tiết nổi bật nhất → Chi tiết so sánh/đối lập → Nhận xét chung</b>."
    : "Khung chuẩn của đoạn văn: <b>Câu chủ đề (Topic sentence) → Luận điểm / Chi tiết → Kết luận</b>.";
  return `
  <div class="blk b1"><h4>📖 ${isL?"Bức thư":"Đoạn văn"} hoàn chỉnh &amp; Dịch song ngữ</h4><div class="bd">
    <div class="bil"><div class="col"><h5>English – thứ tự đúng: ${fmtOrder(ok)}</h5>${enFull}</div>
    <div class="col"><h5>Bản dịch tiếng Việt</h5>${viFull}</div></div></div></div>
  <div class="blk b2"><h4>🧭 Công thức xâu chuỗi &amp; Mẹo bắt mạch</h4><div class="bd">
    <div style="font-size:14px;margin-bottom:8px">${general}</div>
    <div class="flow">${flow}</div>
    <div class="tip">💡 <b>Mẹo loại trừ nhanh:</b> ${esc(a.t)}</div></div></div>
  <div class="blk b3"><h4>🔗 Giải mã từng mắt xích (${fmtOrder(ok)})</h4><div class="bd">
    <ol class="chain">${a.L.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    <div class="trap">⚠️ <b>Bẫy sai của các phương án còn lại:</b><ul>${trapNotes(it)}</ul></div></div></div>
  <div class="blk b4"><h4>📚 Từ vựng &amp; Cấu trúc đắt giá</h4><div class="bd">
    <table class="vocab">${a.w.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("")}</table></div></div>`;
}

/* ---------- Thẻ câu hỏi ---------- */
function questionHTML(it,num,total){
  const counter={n:0}, keys=Object.keys(it.s).sort();
  const lines=keys.map(k=>`<div class="sline"><span class="slab">${k}.</span><span>${wrapWords(it.s[k],counter)}</span></div>`).join("");
  const isL=it.cat==="letter";
  const instr=isL?"Choose the correct arrangement of the sentences to make a meaningful letter."
                 :"Choose the correct arrangement of the sentences to make a meaningful paragraph.";
  return `<div class="qhead"><span class="qbadge">Câu ${num}/${total}</span><span class="qtitle">${esc(it.title||BANK[branchOf(it.id)].name)}</span></div>
  <div class="qinstr">${instr}</div>
  <div class="hint ${S.hl?"show":""}" id="hlHint">🖊️ Bút highlight đang bật: bấm vào một từ hoặc bôi đen cả cụm (However, This, These…, I'm writing to…) để đánh dấu manh mối.</div>
  <div class="sentences ${S.hl?"hlmode":""}" id="sbox">
    ${isL?`<div class="frame">${esc(it.open)}</div>`:""}
    ${lines}
    ${isL?`<div class="frame close">${it.close}</div>`:""}
  </div>
  <div class="opts" id="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}.</span><span>${fmtOrder(o)}</span></button>`).join("")}</div>`;
}
function applyMarks(it){
  const m=S.marks[it.id]; if(!m)return;
  const ws=document.querySelectorAll(".sentences .w"); m.forEach(i=>ws[i]&&ws[i].classList.add("hl"));
}
function currentItem(){
  if(S.mode==="exam"){ if(S.exam&&!S.exam.done) return itemById(S.exam.ids[S.exam.idx]); return S.exam&&S.exam.reviewId?itemById(S.exam.reviewId):null;}
  return BANK[S.branch].items[S.idx[S.branch]];
}

/* ---------- LUYỆN TẬP ---------- */
function renderPractice(){
  const items=BANK[S.branch].items, i=S.idx[S.branch], it=items[i], st=S.prac[S.branch][it.id]||{};
  const stage=$("#stage");
  stage.innerHTML=`<div class="card">${questionHTML(it,i+1,items.length)}
    <div class="actions">
      <button class="btn ghost" id="bPrev" ${i===0?"disabled":""}>◀ Câu trước</button>
      <button class="btn pri" id="bCheck">✔ Kiểm tra</button>
      <button class="btn" id="bRetry" style="display:none">↺ Làm lại câu này</button>
      <span id="verdict"></span><span class="spacer"></span>
      <button class="btn ghost" id="bNext" ${i===items.length-1?"disabled":""}>Câu sau ▶</button>
    </div>
    <div class="ana" id="ana"></div></div>`;
  const sbox=$("#sbox"); bindHighlight(sbox,it); applyMarks(it);
  const opts=[...document.querySelectorAll(".opt")];
  function paint(){
    const s=S.prac[S.branch][it.id]||{};
    opts.forEach((b,k)=>{b.className="opt"+(s.pick===k?" sel":"");b.disabled=!!s.checked});
    if(s.checked){
      opts[it.key].classList.add("ok"); if(s.pick!==it.key)opts[s.pick].classList.add("bad");
      $("#verdict").innerHTML = s.pick===it.key?`<span class="verdict ok">🎉 Chính xác! Đáp án ${LET[it.key]}</span>`:`<span class="verdict bad">✘ Chưa đúng – đáp án đúng là ${LET[it.key]}</span>`;
      $("#bCheck").style.display="none"; $("#bRetry").style.display="";
      const an=$("#ana"); an.innerHTML=analysisHTML(it); an.classList.add("show");
    } else {
      $("#verdict").innerHTML=""; $("#bCheck").style.display=""; $("#bRetry").style.display="none";
      $("#ana").classList.remove("show"); $("#ana").innerHTML="";
    }
  }
  paint();
  $("#opts").addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(!b||b.disabled)return;
    const s=S.prac[S.branch][it.id]||(S.prac[S.branch][it.id]={});
    s.pick=+b.dataset.i; paint(); renderGrid(); renderProgress();
  });
  $("#bCheck").onclick=()=>{
    const s=S.prac[S.branch][it.id];
    if(!s||s.pick===undefined){toast("Hãy chọn một phương án A, B, C hoặc D trước khi kiểm tra.");return}
    s.checked=true; s.ok=(s.pick===it.key); paint(); renderGrid(); renderProgress(); maybeSavePractice();
    setTimeout(()=>$("#ana").scrollIntoView({behavior:"smooth",block:"start"}),120);
  };
  $("#bRetry").onclick=()=>{delete S.prac[S.branch][it.id]; paint(); renderGrid(); renderProgress();};
  $("#bPrev").onclick=()=>{S.idx[S.branch]--;renderAll()};
  $("#bNext").onclick=()=>{S.idx[S.branch]++;renderAll()};
}
function practiceStats(br){
  const items=BANK[br].items, P=S.prac[br];
  let done=0,ok=0;const wrong=[];
  items.forEach((it,i)=>{const s=P[it.id]; if(s&&s.checked){done++; if(s.ok)ok++; else wrong.push({n:i+1,it,pick:s.pick})}});
  return {total:items.length,done,ok,wrong};
}
function maybeSavePractice(){
  const st=practiceStats(S.branch);
  if(st.done===st.total){
    addHistory({mode:"Luyện tập",branch:BANK[S.branch].name,ok:st.ok,total:st.total,wrong:st.wrong.map(w=>w.n),time:"—"});
    toast(`Hoàn thành chuyên mục! Đúng ${st.ok}/${st.total} câu – đã lưu vào lịch sử điểm.`);
  }
}

/* ---------- THI THỬ ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderExamIntro(){
  const items=BANK[S.branch].items, n=Math.min(EXAM_SIZE,items.length);
  $("#stage").innerHTML=`<div class="card intro">
    <h2>⏱️ Thi thử: ${esc(BANK[S.branch].name)}</h2>
    <p>Đề gồm <b>${n} câu</b> được chọn ngẫu nhiên • Thời gian <b>15 phút</b> • Đáp án và lời giải sẽ hiện sau khi nộp bài.</p>
    <p style="font-size:13.5px">Bạn vẫn có thể dùng 🖊️ Bút Highlight trong khi làm bài.</p>
    <button class="btn pri" id="bStart" style="font-size:16px;padding:11px 22px">▶ Bắt đầu làm bài</button>
    <div class="result" id="lastRes"></div></div>`;
  $("#bStart").onclick=startExam;
}
function startExam(){
  if(!inName.value.trim()){ if(!confirm("Bạn chưa nhập Họ và tên. Vẫn bắt đầu làm bài?")){inName.focus();return} }
  const items=BANK[S.branch].items, n=Math.min(EXAM_SIZE,items.length);
  S.exam={branch:S.branch,ids:shuffle(items.map(x=>x.id)).slice(0,n),answers:{},idx:0,start:Date.now(),left:EXAM_SECONDS,done:false};
  S.exam.timerId=setInterval(tick,1000); tick(); renderAll();
}
function tick(){
  const E=S.exam; if(!E||E.done)return;
  E.left=Math.max(0,EXAM_SECONDS-Math.floor((Date.now()-E.start)/1000));
  const m=String(Math.floor(E.left/60)).padStart(2,"0"), s=String(E.left%60).padStart(2,"0");
  const t=$("#timer"); t.textContent=`⏳ ${m}:${s}`; t.classList.add("show");
  if(E.left===0){toast("Hết giờ! Bài thi đã được nộp tự động.");submitExam(true)}
}
function renderExamQ(){
  const E=S.exam, it=itemById(E.ids[E.idx]);
  $("#stage").innerHTML=`<div class="card">${questionHTML(it,E.idx+1,E.ids.length)}
    <div class="actions">
      <button class="btn ghost" id="bPrev" ${E.idx===0?"disabled":""}>◀ Câu trước</button>
      <button class="btn ghost" id="bNext" ${E.idx===E.ids.length-1?"disabled":""}>Câu sau ▶</button>
      <span class="spacer"></span>
      <button class="btn pri" id="bSubmit">📤 Nộp bài</button>
    </div></div>`;
  bindHighlight($("#sbox"),it); applyMarks(it);
  const opts=[...document.querySelectorAll(".opt")];
  const paint=()=>opts.forEach((b,k)=>b.classList.toggle("sel",E.answers[it.id]===k));
  paint();
  $("#opts").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;E.answers[it.id]=+b.dataset.i;paint();renderGrid();renderProgress();
    if(E.idx<E.ids.length-1)setTimeout(()=>{E.idx++;renderAll()},350)});
  $("#bPrev").onclick=()=>{E.idx--;renderAll()};
  $("#bNext").onclick=()=>{E.idx++;renderAll()};
  $("#bSubmit").onclick=()=>{
    const left=E.ids.length-Object.keys(E.answers).length;
    if(left>0&&!confirm(`Bạn còn ${left} câu chưa làm. Vẫn nộp bài?`))return;
    submitExam(false);
  };
}
function submitExam(auto){
  const E=S.exam; if(!E||E.done)return;
  clearInterval(E.timerId); E.done=true;
  const used=Math.min(EXAM_SECONDS,Math.round((Date.now()-E.start)/1000));
  let ok=0;const rows=[],wrong=[];
  E.ids.forEach((id,i)=>{const it=itemById(id),p=E.answers[id],good=p===it.key; if(good)ok++; else wrong.push(i+1); rows.push({i:i+1,it,p,good})});
  const score=Math.round(ok/E.ids.length*100)/10;
  E.result={ok,total:E.ids.length,score,used,rows,wrong,auto,date:new Date()};
  addHistory({mode:"Thi thử",branch:BANK[E.branch].name,ok,total:E.ids.length,score,wrong,time:fmtTime(used)});
  $("#timer").classList.remove("show");
  renderAll();
  window.scrollTo({top:0,behavior:"smooth"});
}
function fmtTime(sec){return `${Math.floor(sec/60)} phút ${sec%60} giây`}

    $("#revBox").innerHTML=`<div class="card" style="margin-top:14px;border:2px solid ${r.good?"var(--ok)":"var(--bad)"}">
      <div class="qhead"><span class="qbadge">Câu ${r.i}</span><span class="qtitle">Bạn chọn: <b>${r.p===undefined?"bỏ trống":LET[r.p]}</b> • Đáp án đúng: <b>${LET[it.key]}. ${fmtOrder(correctOrder(it))}</b></span></div>
      <div class="sentences">${it.cat==="letter"?`<div class="frame">${esc(it.open)}</div>`:""}${Object.keys(it.s).sort().map(k=>`<div class="sline"><span class="slab">${k}.</span><span>${wrapWords(it.s[k],counter)}</span></div>`).join("")}${it.cat==="letter"?`<div class="frame close">${it.close}</div>`:""}</div>
      <div class="opts">${it.opts.map((o,i)=>`<div class="opt ${i===it.key?"ok":(i===r.p?"bad":"")}"><span class="L">${LET[i]}.</span><span>${fmtOrder(o)}</span></div>`).join("")}</div>
      <div class="ana show">${analysisHTML(it)}</div></div>`;
    applyMarks(it);
    $("#revBox").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

/* ---------- Lưới câu & tiến độ ---------- */
function renderGrid(){
  const g=$("#grid");
  if(S.mode==="exam"){
    if(!S.exam||S.exam.done){g.innerHTML=S.exam&&S.exam.done?S.exam.result.rows.map(r=>`<button class="qn ${r.good?"ok":"bad"}" data-rv="${r.it.id}">${r.i}</button>`).join(""):'<span class="empty" style="grid-column:1/-1;font-size:13px">Bấm “Bắt đầu làm bài” để nhận đề.</span>';
      $("#gridTitle").textContent="Đề thi thử";
      $("#legend").innerHTML=S.exam&&S.exam.done?'<i style="background:var(--okSoft)"></i>Đúng &nbsp;<i style="background:var(--badSoft)"></i>Sai':"";
      return}
    const E=S.exam;
    g.innerHTML=E.ids.map((id,i)=>`<button class="qn ${E.answers[id]!==undefined?"ans":""} ${i===E.idx?"cur":""}" data-ex="${i}">${i+1}</button>`).join("");
    $("#gridTitle").textContent="Đề thi thử";
    $("#legend").innerHTML='<i style="background:var(--priSoft)"></i>Đã chọn &nbsp;<i></i>Chưa làm';
    return;
  }
  const items=BANK[S.branch].items,P=S.prac[S.branch];
  g.innerHTML=items.map((it,i)=>{const s=P[it.id];let c="";if(s){if(s.checked)c=s.ok?"ok":"bad";else if(s.pick!==undefined)c="ans"}
    return `<button class="qn ${c} ${i===S.idx[S.branch]?"cur":""}" data-pr="${i}">${i+1}</button>`}).join("");
  $("#gridTitle").textContent="Danh sách câu – "+BANK[S.branch].name;
  $("#legend").innerHTML='<i style="background:var(--okSoft)"></i>Đúng &nbsp;<i style="background:var(--badSoft)"></i>Sai<br><i style="background:var(--priSoft)"></i>Đã chọn, chưa kiểm tra';
}
$("#grid").addEventListener("click",e=>{
  const b=e.target.closest(".qn");if(!b)return;
  if(b.dataset.pr!==undefined){S.idx[S.branch]=+b.dataset.pr;renderAll();window.scrollTo({top:0,behavior:"smooth"})}
  else if(b.dataset.ex!==undefined){S.exam.idx=+b.dataset.ex;renderAll()}
  else if(b.dataset.rv){const x=document.querySelector(`[data-rev="${b.dataset.rv}"]`);x&&x.click()}
});
function renderProgress(){
  let done,total,label;
  if(S.mode==="exam"&&S.exam){total=S.exam.ids.length;done=Object.keys(S.exam.answers).length;label=S.exam.done?`Đã nộp bài • Đúng <b>${S.exam.result.ok}/${total}</b>`:`Đã làm <b>${done}/${total}</b> câu`}
  else if(S.mode==="exam"){total=0;done=0;label="Chưa bắt đầu bài thi"}
  else{const st=practiceStats(S.branch);total=st.total;done=st.done;label=`Hoàn thành <b>${done}/${total}</b> câu • Đúng <b>${st.ok}</b>`}
  const pct=total?Math.round(done/total*100):0;
  $("#pfill").style.width=pct+"%";
  $("#ptxt").innerHTML=`${label} • <b>${pct}%</b>`;
  if(!(S.mode==="exam"&&S.exam&&!S.exam.done))$("#timer").classList.remove("show");
}

/* ---------- Lịch sử điểm ---------- */
function addHistory(rec){
  const h=store.get("sx_history",[]);
  rec.date=new Date().toLocaleString("vi-VN"); rec.name=inName.value.trim(); rec.cls=inClass.value.trim();
  h.unshift(rec); store.set("sx_history",h.slice(0,50)); renderHistory();
}
function renderHistory(){
  const h=store.get("sx_history",[]);
  if(!h.length){$("#histBox").innerHTML='<div class="empty">Chưa có kết quả nào. Hãy hoàn thành một bài thi thử hoặc một chuyên mục luyện tập.</div>';return}
  $("#histBox").innerHTML=`<table><tr><th>Thời gian</th><th>Chế độ</th><th>Chuyên mục</th><th>Kết quả</th><th>Câu sai</th></tr>${
    h.slice(0,12).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.mode)}</td><td>${esc(r.branch)}</td><td><b>${r.ok}/${r.total}</b>${r.score!==undefined?` (${String(r.score).replace(".",",")} đ)`:""}</td><td>${r.wrong&&r.wrong.length?r.wrong.join(", "):"—"}</td></tr>`).join("")}</table>
    <div style="margin-top:8px"><button class="btn ghost" id="bClrH" style="font-size:12.5px;padding:5px 10px">🗑️ Xóa lịch sử</button></div>`;
  $("#bClrH").onclick=()=>{if(confirm("Xóa toàn bộ lịch sử điểm trên máy này?")){store.set("sx_history",[]);renderHistory()}};
}

/* ---------- Tải phiếu điểm (.txt) ---------- */
function slug(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").trim().replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"")}
function downloadReport(){
  const name=inName.value.trim(), cls=inClass.value.trim();
  if(!name){toast("Vui lòng nhập Họ và tên học sinh trước khi tải phiếu điểm.");inName.focus();return}
  const L=[], line="=".repeat(62), now=new Date().toLocaleString("vi-VN");
  L.push(line,"   PHIẾU KẾT QUẢ LUYỆN KỸ NĂNG SẮP XẾP THƯ & ĐOẠN VĂN LOGIC","                    (Chương trình GDPT 2018)","        Trường THPT Gia Viễn B • Tác giả: Huệ Anh",line);
  L.push(`Họ và tên học sinh : ${name}`,`Lớp                : ${cls||"(chưa nhập)"}`,`Thời điểm xuất     : ${now}`,"");
  if(S.exam&&S.exam.done){
    const R=S.exam.result;
    L.push("--- KẾT QUẢ THI THỬ GẦN NHẤT ---",`Chuyên mục         : ${BANK[S.exam.branch].name}`,`Điểm số            : ${String(R.score).replace(".",",")}/10  (đúng ${R.ok}/${R.total} câu)`,`Thời gian làm bài  : ${fmtTime(R.used)}${R.auto?" (hết giờ, nộp tự động)":""}`);
    if(R.wrong.length){L.push("Danh sách câu làm sai:");R.rows.filter(r=>!r.good).forEach(r=>L.push(`  - Câu ${r.i} [${r.it.title||"Bài "+r.it.id}]: chọn ${r.p===undefined?"(bỏ trống)":LET[r.p]} – đáp án đúng ${LET[r.it.key]} (${fmtOrder(correctOrder(r.it))})`))}
    else L.push("Danh sách câu làm sai: Không có – làm đúng toàn bộ!");
    L.push("");
  }
  L.push("--- TIẾN ĐỘ CHẾ ĐỘ LUYỆN TẬP ---");
  let any=false;
  ["letter","letter2","basic","adv"].forEach(br=>{
    const st=practiceStats(br); if(!st.done)return; any=true;
    L.push(`${BANK[br].name}: đã làm ${st.done}/${st.total} câu – đúng ${st.ok} câu`);
    st.wrong.forEach(w=>L.push(`  - Câu ${w.n}${w.it.title?" ["+w.it.title+"]":""}: chọn ${LET[w.pick]} – đáp án đúng ${LET[w.it.key]} (${fmtOrder(correctOrder(w.it))})`));
  });
  if(!any)L.push("(Chưa kiểm tra câu nào trong chế độ luyện tập ở phiên này)");
  L.push("","--- LỊCH SỬ ĐIỂM (gần nhất) ---");
  const h=store.get("sx_history",[]);
  if(h.length)h.slice(0,10).forEach(r=>L.push(`${r.date} | ${r.mode} | ${r.branch} | ${r.ok}/${r.total}${r.score!==undefined?" ("+String(r.score).replace(".",",")+" điểm)":""}${r.time&&r.time!=="—"?" | "+r.time:""}${r.wrong&&r.wrong.length?" | sai câu: "+r.wrong.join(", "):""}`));
  else L.push("(Chưa có)");
  L.push("",line,"Chữ ký học sinh: ......................   Nhận xét của giáo viên: ......................",line);
  const blob=new Blob(["﻿"+L.join("\r\n")],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`Ket_qua_Sap_xep_${slug(name)||"HocSinh"}_${slug(cls)||"Lop"}.txt`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  toast("Đã tải phiếu điểm về máy.");
}
$("#btnDownload").addEventListener("click",downloadReport);

/* ---------- Render tổng ---------- */
function renderAll(){
  renderNav();
  if(S.mode==="practice")renderPractice();
  else if(!S.exam)renderExamIntro();
  else if(!S.exam.done)renderExamQ();
  else renderExamResult();
  renderGrid(); renderProgress();
}
document.addEventListener("contextmenu",e=>{if(e.target.closest(".sentences"))e.preventDefault()});
document.addEventListener("copy",e=>{if(window.getSelection().toString().length>40){e.preventDefault();toast("Nội dung đề được bảo vệ – hãy tập trung luyện tập nhé!")}});
renderAll(); renderHistory();
/* Liên kết Học liệu số: hỏi lại trước khi rời trang nếu đang thi thử */
window.HLS_confirmLeave=()=>!(S.exam&&!S.exam.done)||confirm("Bạn đang làm bài thi thử. Rời trang sẽ mất bài đang làm. Tiếp tục?");
</script>
