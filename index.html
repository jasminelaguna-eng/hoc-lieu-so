<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUYỆN KỸ NĂNG SẮP XẾP THƯ &amp; ĐOẠN VĂN LOGIC (GDPT 2018)</title>
<style>
:root{
  --bg:#f3f6fb;--card:#ffffff;--ink:#1d2433;--muted:#5d6779;--line:#dde3ee;
  --pri:#1f4e9c;--pri2:#2f6fd6;--priSoft:#e8f0fd;
  --ok:#1e8e4f;--okSoft:#e3f6eb;--bad:#c9352b;--badSoft:#fde8e6;
  --hl:#fff176;--gold:#b8860b;--shadow:0 2px 10px rgba(20,40,80,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5}
button{font-family:inherit;font-size:14px;cursor:pointer}
input{font-family:inherit}

/* HEADER */
header{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#163a78,#1f4e9c 55%,#2f6fd6);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.hwrap{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{flex:1 1 360px;min-width:0}
.brand h1{margin:0;font-size:17px;letter-spacing:.3px;line-height:1.3}
.brand .credit{font-size:12.5px;opacity:.92;margin-top:2px}
.brand .credit b{color:#ffe082;font-weight:600}
.profile{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.profile label{font-size:12px;opacity:.9;display:flex;flex-direction:column;gap:2px}
.profile input{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:7px;padding:6px 9px;font-size:14px;outline:none}
.profile input::placeholder{color:rgba(255,255,255,.65)}
.profile input:focus{background:rgba(255,255,255,.22);border-color:#ffe082}
#inName{width:210px}#inClass{width:90px}
.saved{font-size:11px;color:#b9f6ca;min-width:60px}

main{max-width:1180px;margin:0 auto;padding:16px}

/* NAV */
.nav1{display:flex;gap:10px;flex-wrap:wrap}
.tab1{flex:1 1 240px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);transition:.15s}
.tab1 .t{font-weight:700;font-size:15.5px;color:var(--pri)}
.tab1 .s{font-size:12.5px;color:var(--muted)}
.tab1:hover{border-color:var(--pri2)}
.tab1.on{border-color:var(--pri);background:var(--priSoft)}
.nav2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tab2{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;color:var(--ink)}
.tab2.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tab2 small{opacity:.8}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
.seg{display:inline-flex;border:1.5px solid var(--pri);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--pri);padding:8px 14px;font-weight:600}
.seg button.on{background:var(--pri);color:#fff}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 13px;font-weight:600}
.btn:hover{border-color:var(--pri2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.hlOn{background:var(--hl);border-color:#e0c200;color:#5a4a00}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}

.progress{background:var(--card);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ptrack{flex:1 1 260px;height:12px;background:#e6ebf3;border-radius:99px;overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,#2f6fd6,#1e8e4f);transition:width .35s}
.ptxt{font-size:13.5px;color:var(--muted);white-space:nowrap}
.ptxt b{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;color:var(--bad);background:var(--badSoft);padding:4px 12px;border-radius:8px;display:none}
.timer.show{display:inline-block}

.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:14px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.side{background:var(--card);border-radius:12px;padding:12px;box-shadow:var(--shadow);position:sticky;top:96px}
@media(max-width:860px){.side{position:static}}
.side h3{margin:0 0 8px;font-size:13.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(max-width:860px){.grid{grid-template-columns:repeat(10,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:repeat(7,1fr)}}
.qn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-weight:700;font-size:13px;color:var(--ink)}
.qn.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.qn.ans{background:var(--priSoft);border-color:#9dbcf0}
.qn.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.qn.bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad)}
.legend{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #bbb}

.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qbadge{background:var(--pri);color:#fff;font-weight:700;border-radius:8px;padding:3px 10px;font-size:14px}
.qtitle{color:var(--muted);font-size:13.5px}
.qinstr{font-size:14px;color:var(--muted);margin:4px 0 12px;font-style:italic}
.sentences{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.75;border:1px dashed #cfd8e6;border-radius:10px;padding:12px 16px;background:#fbfcff}
.sentences.hlmode{cursor:text;border-color:#e0c200;background:#fffef2}
.sline{display:flex;gap:10px;padding:5px 0}
.sline+.sline{border-top:1px solid #eef1f6}
.slab{font-weight:700;color:var(--pri);min-width:22px}
.frame{font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#334;padding:4px 0 6px;font-style:italic}
.frame.close{padding:8px 0 2px}
.w{border-radius:3px;transition:background .1s}
.hlmode .w:hover{background:#fff8c4}
.w.hl{background:var(--hl);box-shadow:0 0 0 1px #f0d800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:16px;text-align:left;color:var(--ink)}
.opt .L{font-weight:800;color:var(--pri);min-width:20px}
.opt:hover{border-color:var(--pri2)}
.opt.sel{border-color:var(--pri);background:var(--priSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}
.opt.ok .L{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}
.opt.bad .L{color:var(--bad)}
.opt:disabled{cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.verdict{font-weight:700;padding:6px 12px;border-radius:8px}
.verdict.ok{background:var(--okSoft);color:var(--ok)}
.verdict.bad{background:var(--badSoft);color:var(--bad)}

/* ANALYSIS */
.ana{margin-top:18px;display:none}
.ana.show{display:block}
.blk{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:#fff}
.blk>h4{margin:0;padding:10px 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.blk .bd{padding:12px 16px}
.b1>h4{background:#e8f0fd;color:#163a78}
.b2>h4{background:#fff4dc;color:#7a5200}
.b3>h4{background:#e6f6ee;color:#136b3b}
.b4>h4{background:#f3e9fb;color:#5b2a86}
.bil{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.bil{grid-template-columns:1fr}}
.bil .col{background:#fafbfe;border-radius:10px;padding:10px 12px;font-family:Arial,Helvetica,sans-serif;font-size:15.5px;line-height:1.7}
.bil .col h5{margin:0 0 6px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-family:"Segoe UI",Arial,sans-serif}
.bil .col p{margin:0 0 6px}
.tag{display:inline-block;background:var(--pri);color:#fff;border-radius:5px;font-size:11.5px;padding:0 6px;margin-right:4px;font-weight:700;vertical-align:1px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{background:#fff8e6;border:1px solid #f0d58a;border-radius:9px;padding:6px 10px;font-size:13.5px}
.flow .st b{color:#7a5200}
.flow .ar{align-self:center;color:#c49a2c;font-weight:800}
.tip{margin-top:10px;background:#fffbea;border-left:4px solid #e0a800;padding:8px 12px;border-radius:6px;font-size:14px}
.chain li{margin:6px 0}
.trap{margin-top:10px;background:#fff5f4;border-left:4px solid var(--bad);padding:8px 12px;border-radius:6px;font-size:14px}
.trap ul{margin:4px 0 0;padding-left:18px}
.vocab{width:100%;border-collapse:collapse;font-size:14.5px}
.vocab td{border-bottom:1px solid #eee;padding:7px 8px;vertical-align:top}
.vocab td:first-child{font-weight:700;color:#5b2a86;font-family:Arial,Helvetica,sans-serif;width:48%}

/* EXAM / RESULT */
.intro{text-align:center;padding:26px 16px}
.intro h2{margin:0 0 6px;color:var(--pri)}
.intro p{color:var(--muted);margin:4px 0 14px}
.result{margin-top:14px}
.sheet{border:2px solid var(--pri);border-radius:14px;padding:16px 18px;background:linear-gradient(180deg,#f5f9ff,#fff)}
.sheet h2{margin:0;text-align:center;color:var(--pri);font-size:19px}
.sheet .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.sheet .row{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;font-size:14.5px}
.score{font-size:42px;font-weight:800;text-align:center;color:var(--ok);margin:8px 0 2px}
.score.low{color:var(--bad)}
.rtable{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.rtable th,.rtable td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.rtable th{background:#f0f4fb}
.rtable td.l{text-align:left}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}

.hist{margin-top:16px}
.hist table{width:100%;border-collapse:collapse;font-size:13.5px}
.hist th,.hist td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.hist th{color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-style:italic}

footer{text-align:center;color:var(--muted);font-size:13px;padding:22px 16px 30px}
footer b{color:var(--pri)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:#1d2433;color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:12.5px;color:#7a6400;background:#fffbe0;border:1px solid #f1e08a;border-radius:8px;padding:6px 10px;margin:0 0 10px;display:none}
.hint.show{display:block}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <h1>LUYỆN KỸ NĂNG SẮP XẾP THƯ &amp; ĐOẠN VĂN LOGIC (GDPT 2018)</h1>
      <div class="credit">Trường THPT Gia Viễn B • Tác giả: <b>Huệ Anh</b></div>
    </div>
    <div class="profile">
      <label>Họ và tên học sinh<input id="inName" placeholder="Nhập họ và tên…" autocomplete="off"></label>
      <label>Lớp<input id="inClass" placeholder="VD: 12A10" autocomplete="off"></label>
      <span class="saved" id="savedMsg"></span>
    </div>
  </div>
</header>

<main>
  <div class="nav1" id="nav1">
    <button class="tab1" data-cat="letter"><div class="t">✉️ SẮP XẾP THƯ TÍN</div><div class="s">Letter Arrangement – thư xin việc, cảm ơn, mời, phàn nàn…</div></button>
    <button class="tab1" data-cat="para"><div class="t">🧩 SẮP XẾP ĐOẠN VĂN LOGIC</div><div class="s">Paragraph Arrangement – Cơ bản &amp; Nâng cao</div></button>
  </div>
  <div class="nav2" id="nav2"></div>

  <div class="bar">
    <div class="seg" id="modeSeg">
      <button data-mode="practice" class="on">📘 Chế độ Luyện tập</button>
      <button data-mode="exam">⏱️ Chế độ Thi thử</button>
    </div>
    <button class="btn" id="btnHL" title="Bật rồi bấm vào từ hoặc bôi đen cụm từ trong các câu a, b, c, d, e">🖊️ Bút Highlight từ nối &amp; manh mối</button>
    <button class="btn" id="btnClearHL">🧽 Xóa highlight</button>
    <span class="spacer"></span>
    <button class="btn pri" id="btnDownload">📥 Tải Phiếu Điểm Về Máy</button>
  </div>

  <div class="progress">
    <div class="ptrack"><div class="pfill" id="pfill"></div></div>
    <div class="ptxt" id="ptxt"></div>
    <div class="timer" id="timer">15:00</div>
  </div>

  <div class="layout">
    <aside class="side">
      <h3 id="gridTitle">Danh sách câu</h3>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
    </aside>
    <section id="stage"></section>
  </div>

  <div class="card hist">
    <h3 style="margin:0 0 8px;font-size:15px">📊 Lịch sử điểm của bạn (lưu trên máy này)</h3>
    <div id="histBox"></div>
  </div>
</main>

<footer>
  © Trường THPT Gia Viễn B • Tác giả: <b>Huệ Anh</b><br>
  Luyện kỹ năng sắp xếp thư &amp; đoạn văn logic – Chương trình GDPT 2018
</footer>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DỮ LIỆU BÀI TẬP
   - BASIC: Sắp xếp đoạn văn – Cơ bản (trích từ tài liệu "PARAGRAPH ARRANGEMENT-1 cơ bản")
   - ADV:   Sắp xếp đoạn văn – Nâng cao
   - LETTERS: Sắp xếp thư tín
   Mỗi bài: s (các câu a–e), opts (4 phương án dạng "dacbe"), key (0–3), ana (phân tích)
   ana.r = vai trò từng câu, ana.v = bản dịch, ana.L = giải mã từng mắt xích,
   ana.t = mẹo bắt mạch, ana.w = từ vựng
   ========================================================= */
const ANA = {};
ANA[1]={r:{d:"Câu chủ đề (thay đổi lớn)",a:"Quá khứ → hiện tại",c:"Chi tiết 1: kinh doanh",b:"Chi tiết 2: công viên",e:"Kết quả – kết luận"},
v:{a:"Trước đây nơi này là một khu yên tĩnh chỉ có vài cửa hàng và nhà hàng, nhưng giờ đây nó nhộn nhịp hẳn lên.",b:"Bên cạnh các cửa hàng mới, nhiều công viên cũng được xây dựng, mang lại không gian xanh để thư giãn và vui chơi.",c:"Các doanh nghiệp mới mở cửa, thu hút cả người dân địa phương lẫn khách du lịch, làm tăng đáng kể sức sống của khu phố.",d:"Trung tâm thành phố đã trải qua những thay đổi đáng kể trong thập kỷ qua.",e:"Nhờ những cải thiện này, trung tâm thành phố đã trở thành điểm đến nổi tiếng cho các sự kiện và hội họp, gắn kết tinh thần cộng đồng."},
L:["(d) → (a): (d) nêu chủ đề chung “thay đổi đáng kể”; (a) dùng đại từ “It” thay cho “the city center” và so sánh “formerly … but now”.","(a) → (c): sau khi nói nơi này “nhộn nhịp”, (c) giải thích lý do: “New businesses have opened”.","(c) → (b): “In addition to the new shops” ở (b) nhắc lại “new businesses/shops” ở (c) → (b) phải đứng sau (c).","(b) → (e): “As a result of these improvements” tổng hợp mọi cải thiện (cửa hàng, công viên) → câu kết."],
t:"Câu mở đầu là câu nói chung, không có đại từ “It/These”: (d). Câu kết có “As a result of these improvements”: (e). Chỉ phương án B mở bằng d và kết bằng e theo đúng mạch.",
w:[["undergo significant changes","trải qua những thay đổi đáng kể"],["bustling with activity","nhộn nhịp, sôi động"],["enhance the vibrancy","tăng sức sống, sự sôi động"],["foster a sense of community","nuôi dưỡng tinh thần cộng đồng"]]};

ANA[2]={r:{c:"Câu chủ đề (từ thiện thật ý nghĩa)",a:"Trải nghiệm cụ thể",d:"Cảm xúc từ trải nghiệm",b:"Khó khăn nhưng hạnh phúc",e:"Kết luận"},
v:{a:"Trong năm qua, tôi làm tình nguyện tại một trại trẻ mồ côi, nơi tôi giúp tổ chức các hoạt động giáo dục cho trẻ em.",b:"Dù công việc này không phải lúc nào cũng dễ dàng, tôi tìm thấy niềm hạnh phúc lớn lao khi biết mình đang tạo ảnh hưởng tích cực cho cộng đồng.",c:"Tham gia công tác từ thiện là một trải nghiệm vô cùng ý nghĩa đối với tôi.",d:"Thực tế, việc nhìn thấy nụ cười và niềm vui của các em đã thúc đẩy tôi tiếp tục nỗ lực trong lĩnh vực này.",e:"Tóm lại, làm từ thiện không chỉ giúp đỡ những người khó khăn mà còn dạy tôi những bài học quý giá về lòng trắc ẩn và biết ơn."},
L:["(c) → (a): (c) nêu chủ đề chung “charity work”; (a) đưa ví dụ cụ thể: tình nguyện ở trại trẻ mồ côi.","(a) → (d): “their smiles” ở (d) – “their” chỉ “the children” ở (a).","(d) → (b): “this work” ở (b) chỉ công việc vừa kể; (b) nói về khó khăn và niềm vui chung.","(b) → (e): “In conclusion” → câu kết."],
t:"Câu kết có “In conclusion” – (e). Câu mở là câu khái quát “Participating in charity work…” – (c). Loại A, C, D vì không mở bằng (c).",
w:[["a profoundly rewarding experience","một trải nghiệm vô cùng ý nghĩa"],["orphanage","trại trẻ mồ côi"],["make a positive impact on","tạo ảnh hưởng tích cực đến"],["compassion and gratitude","lòng trắc ẩn và sự biết ơn"]]};

ANA[3]={r:{c:"Mở đầu: khởi nguồn trải nghiệm",e:"Các hoạt động đã tham gia",a:"Nhận thức rút ra",b:"Khoảnh khắc ấn tượng nhất",d:"Kết luận"},
v:{a:"Thật mở mang tầm mắt khi tận mắt thấy những hành động nhỏ có thể góp phần bảo tồn môi trường sống tự nhiên.",b:"Một trong những khoảnh khắc ấn tượng nhất là chứng kiến các con vật đã được phục hồi được thả về tự nhiên, khi biết rằng nỗ lực của chúng tôi đã góp phần giúp chúng hồi phục.",c:"Trải nghiệm bảo tồn của tôi bắt đầu khi tôi làm tình nguyện cho một dự án bảo vệ động vật hoang dã ở địa phương.",d:"Tóm lại, đó là một trải nghiệm ý nghĩa giúp tôi càng trân trọng thiên nhiên hơn.",e:"Tôi được tham gia nhiều hoạt động, từ trồng cây đến giúp theo dõi các loài có nguy cơ tuyệt chủng."},
L:["(c) → (e): (c) “started when I volunteered” (khởi đầu) → (e) kể các hoạt động trong dự án.","(e) → (a): sau khi kể hoạt động nhỏ (trồng cây, theo dõi loài), (a) rút ra nhận xét “small actions can contribute…”.","(a) → (b): “One of the most impactful moments” – bổ sung khoảnh khắc đáng nhớ nhất.","(b) → (d): “To sum up” → kết luận."],
t:"“started when…” là dấu hiệu câu mở (c). “To sum up” là câu kết (d). Chỉ D vừa mở bằng c vừa kết bằng d.",
w:[["eye-opening","mở mang tầm mắt"],["natural habitats","môi trường sống tự nhiên"],["rehabilitated animals","động vật đã được phục hồi"],["endangered species","các loài có nguy cơ tuyệt chủng"]]};

ANA[4]={r:{e:"Câu chủ đề (y học tiến bộ)",a:"Luận điểm 1: điều trị mới",c:"Ví dụ: kháng sinh",b:"Luận điểm 2: y tế từ xa",d:"Kết luận: tác động"},
v:{a:"Với sự phát triển của các phương pháp điều trị và công nghệ mới, những căn bệnh từng không thể chữa khỏi nay có thể được kiểm soát hoặc thậm chí bị xóa sổ.",b:"Hơn nữa, những đổi mới như y tế từ xa đã giúp chăm sóc sức khỏe dễ tiếp cận hơn, cho phép bệnh nhân tư vấn bác sĩ từ xa, nhất là ở vùng nông thôn.",c:"Ví dụ, việc phát minh ra kháng sinh đã cách mạng hóa việc điều trị nhiễm trùng, cứu sống hàng triệu người.",d:"Những thay đổi này không chỉ làm tăng tuổi thọ mà còn nâng cao chất lượng cuộc sống của nhiều người.",e:"Những tiến bộ trong y học đã cải thiện đáng kể việc chăm sóc sức khỏe qua nhiều năm."},
L:["(e) → (a): (e) nêu chủ đề; (a) là luận điểm đầu tiên – phương pháp điều trị mới.","(a) → (c): “For instance” đưa ví dụ cho (a): kháng sinh chữa được bệnh nhiễm trùng.","(c) → (b): “Furthermore” thêm luận điểm thứ hai – telemedicine.","(b) → (d): “These changes” tổng hợp tất cả thay đổi → kết luận."],
t:"Mọi phương án đều mở bằng (e). Hãy nhìn câu cuối: “These changes…” (d) tổng kết – chỉ A kết bằng (d) đúng logic. Ví dụ “For instance” (c) phải đứng ngay sau ý nó minh họa (a).",
w:[["advancement(s) in medicine","những tiến bộ y học"],["eradicate","xóa sổ, diệt trừ"],["revolutionize","cách mạng hóa"],["telemedicine","y tế từ xa"],["life expectancy","tuổi thọ trung bình"]]};

ANA[5]={r:{e:"Mở đầu: cam kết sống xanh",b:"Hành động cụ thể",c:"Tác động tới bản thân",a:"Khó khăn nhưng đáng giá",d:"Kết luận"},
v:{a:"Dù đôi khi cần thêm nỗ lực để mua sắm bền vững và tránh đồ tiện lợi, tác động tích cực là hoàn toàn xứng đáng.",b:"Trong năm qua, tôi đã tạo ra thay đổi bằng cách giảm dùng nhựa, tái chế và ủng hộ các dự án bảo tồn địa phương.",c:"Sống bền vững tại nhà khuyến khích tôi tìm ra những giải pháp sáng tạo để giảm thiểu rác thải.",d:"Tóm lại, tôi vô cùng tự hào về lối sống thân thiện với môi trường của mình, vì nó phù hợp với giá trị bảo vệ hành tinh của tôi.",e:"Tình yêu thiên nhiên và sự bền vững đã truyền cảm hứng để tôi áp dụng những thói quen thân thiện với môi trường trong cuộc sống hằng ngày."},
L:["(e) → (b): (e) nêu cam kết chung; (b) kể hành động cụ thể “reducing plastic use, recycling…”.","(b) → (c): (c) mở rộng: sống bền vững tại nhà giúp tôi sáng tạo để giảm rác.","(c) → (a): (a) “While it sometimes requires extra effort” – nhượng bộ về khó khăn, chuẩn bị cho kết luận.","(a) → (d): “In conclusion” → câu kết."],
t:"Câu mở phải giới thiệu lý do bắt đầu (“inspired me to adopt eco-friendly habits”) – (e). Câu kết “In conclusion” – (d). Chỉ D mở bằng e.",
w:[["eco-friendly habits","thói quen thân thiện với môi trường"],["minimize waste","giảm thiểu rác thải"],["align with one's values","phù hợp với giá trị của ai"],["eco-conscious lifestyle","lối sống có ý thức về môi trường"]]};

ANA[6]={r:{d:"Câu chủ đề (cửa hàng thay đổi)",a:"Giai đoạn đầu: mở rộng hàng hóa",e:"Cải tạo không gian",b:"Hiện tại: sự kiện khuyến mãi",c:"Kết luận: nhờ tâm huyết chủ"},
v:{a:"Ban đầu cửa hàng chỉ bán một số ít hàng tạp hóa, nhưng nhu cầu tăng đã thúc đẩy chủ cửa hàng mở rộng mặt hàng gồm cả nông sản tươi và đồ gia dụng.",b:"Hiện nay cửa hàng thường xuyên tổ chức các sự kiện khuyến mãi như giảm giá và bán hàng theo mùa, thu hút thêm khách và tạo không khí sôi nổi trong cộng đồng.",c:"Nhờ sự tận tâm không ngừng và cam kết phục vụ chất lượng của chủ cửa hàng, nơi đây đã trở thành địa điểm được yêu mến trong khu phố.",d:"Cửa hàng nhỏ ở địa phương đã trải qua sự thay đổi đáng kể qua nhiều năm.",e:"Sau khi cải tạo không gian cho hấp dẫn hơn, cửa hàng đã thu hút được lượng khách lớn hơn, giúp tăng doanh số."},
L:["(d) → (a): “It originally offered…” – “It” thay cho “the small local shop”; “originally” là mốc đầu tiên.","(a) → (e): “After renovating the space” – bước tiếp theo sau khi mở rộng hàng hóa.","(e) → (b): “now hosts regular promotional events” – mốc hiện tại.","(b) → (c): “Thanks to the owner's dedication…” đánh giá tổng thể → kết."],
t:"Đây là đoạn kể theo trình tự thời gian: originally → after renovating → now. Câu kết là câu tổng kết “has become a beloved fixture” (c).",
w:[["undergo transformation","trải qua sự chuyển mình"],["expand the inventory","mở rộng mặt hàng"],["customer base","lượng khách hàng"],["a beloved fixture","một địa điểm quen thuộc, được yêu mến"]]};

ANA[7]={r:{d:"Mở đầu: bắt đầu tình nguyện",a:"Lúc đầu: bỡ ngỡ",c:"Làm việc nhóm",e:"Hiện tại: dự án mới",b:"Kết luận"},
v:{a:"Lúc đầu, tôi không chắc nên dạy các em thế nào, nhưng tôi nhanh chóng học được những kỹ thuật hiệu quả.",b:"Tóm lại, tôi rất vui khi có cơ hội giúp các em cải thiện kỹ năng đọc và tự hào về sự tiến bộ của các em.",c:"Các bạn tình nguyện viên và tôi cùng nhau thiết kế những hoạt động hấp dẫn giúp việc học trở nên thú vị với mọi người.",d:"Tôi đã có được kinh nghiệm quý báu về giáo dục và hướng dẫn kể từ khi bắt đầu làm tình nguyện tại chương trình xóa mù chữ ở địa phương.",e:"Hiện tại, chúng tôi đang tổ chức một thử thách đọc sách đòi hỏi sự lên kế hoạch và phối hợp cẩn thận."},
L:["(d) → (a): (d) giới thiệu việc tình nguyện; (a) “At first” – thời điểm đầu tiên.","(a) → (c): sau khi học được kỹ thuật, (c) kể cách làm việc cùng các tình nguyện viên khác.","(c) → (e): “Currently” – mốc hiện tại, hoạt động đang làm.","(e) → (b): “To sum up” → kết luận."],
t:"Dấu hiệu thời gian: since I began (d) → At first (a) → Currently (e). “To sum up” luôn ở cuối (b).",
w:[["gain valuable experience","có được kinh nghiệm quý báu"],["literacy program","chương trình xóa mù chữ / dạy đọc viết"],["engaging activities","những hoạt động hấp dẫn"],["careful planning and coordination","lên kế hoạch và phối hợp cẩn thận"]]};

ANA[8]={r:{d:"Câu chủ đề (học ngoại ngữ phổ biến)",b:"Lợi ích 1: nhận thức",c:"Lợi ích 2: văn hóa, kết nối",a:"Ví dụ cho lợi ích 2",e:"Lợi ích 3: việc làm"},
v:{a:"Ví dụ, du lịch trở nên thú vị và ý nghĩa hơn khi bạn có thể giao tiếp với người địa phương, biến mỗi lần trò chuyện thành cơ hội học điều mới.",b:"Các nghiên cứu cho thấy người song ngữ thường có khả năng nhận thức tốt hơn, giúp cải thiện kỹ năng giải quyết vấn đề và ghi nhớ.",c:"Biết nói một ngôn ngữ khác không chỉ mở ra những trải nghiệm văn hóa mới mà còn giúp con người kết nối sâu sắc hơn với người khác.",d:"Học ngoại ngữ thứ hai đã trở thành mục tiêu phổ biến của mọi lứa tuổi.",e:"Hơn nữa, kỹ năng ngoại ngữ được đánh giá cao trong thị trường việc làm toàn cầu ngày nay, nơi nhà tuyển dụng tìm kiếm ứng viên giao tiếp được giữa các nền văn hóa."},
L:["(d) → (b): (d) nêu chủ đề; (b) đưa bằng chứng nghiên cứu đầu tiên về lợi ích.","(b) → (c): (c) nêu thêm lợi ích về văn hóa và kết nối con người.","(c) → (a): “For instance, traveling…” minh họa trực tiếp cho “connect with others/new cultural experiences” ở (c).","(a) → (e): “Moreover” bổ sung lợi ích cuối – việc làm."],
t:"Ví dụ “For instance” (a) phải đứng NGAY SAU ý về văn hóa – giao tiếp (c). “Moreover” (e) không thể đứng ngay sau câu chủ đề. Loại A, C vì (a)/(e) đặt sai chỗ.",
w:[["bilingual individuals","người song ngữ"],["cognitive abilities","khả năng nhận thức"],["memory retention","khả năng ghi nhớ"],["global job market","thị trường việc làm toàn cầu"]]};

ANA[9]={r:{b:"Mở đầu: khởi nghiệp tiệm bánh",e:"Những việc đã làm",a:"Vất vả nhưng xứng đáng",c:"Ngày khó khăn & bài học",d:"Kết luận"},
v:{a:"Điều hành một doanh nghiệp nhỏ đòi hỏi làm việc nhiều giờ và sự tận tụy liên tục, nhưng thấy phản hồi tích cực từ khách hàng khiến mọi thứ đều xứng đáng.",b:"Mở tiệm bánh trực tuyến là ước mơ tôi ấp ủ nhiều năm, và vào năm 2024, tôi cuối cùng đã mạnh dạn thực hiện.",c:"Có những ngày vất vả, nhất là vào mùa cao điểm, nhưng tôi đã học được cách đối phó với căng thẳng và thích nghi nhanh.",d:"Cuối cùng, việc xây dựng một thứ từ con số không và nhìn nó lớn lên là một trong những trải nghiệm mãn nguyện nhất đời tôi.",e:"Từ thiết kế trang web đến thử nghiệm các công thức độc đáo, tôi đã dồn hết tâm huyết vào mọi khía cạnh của công việc kinh doanh."},
L:["(b) → (e): (b) kể việc bắt đầu; (e) kể những công việc cụ thể khi bắt đầu (thiết kế web, công thức).","(e) → (a): (a) nhận xét chung về việc điều hành kinh doanh: vất vả nhưng đáng.","(a) → (c): (c) nói tiếp về “tough days” – triển khai ý “long hours” ở (a).","(c) → (d): “In the end” → kết luận."],
t:"Câu mở có mốc thời gian bắt đầu “in 2024, I finally took the leap” (b). Câu kết “In the end” (d). Chỉ B mở bằng b.",
w:[["take the leap","mạnh dạn quyết định làm điều gì"],["put one's heart and soul into","dồn hết tâm huyết vào"],["peak seasons","mùa cao điểm"],["build something from scratch","xây dựng thứ gì từ con số không"]]};

ANA[10]={r:{c:"Câu chủ đề (xu hướng làm vườn đô thị)",a:"Mô tả xu hướng",d:"Lợi ích 1",b:"Lợi ích 2",e:"Hạn chế"},
v:{a:"Cư dân thành phố đã bắt đầu tự trồng rau và thảo mộc trên ban công, sân thượng và vườn cộng đồng.",b:"Khi ngày càng nhiều người tham gia, mạng lưới thực phẩm địa phương được củng cố, giảm sự phụ thuộc vào hàng nhập khẩu.",c:"Làm vườn đô thị đã trở nên phổ biến đáng kể trong những năm gần đây.",d:"Xu hướng này không chỉ cung cấp nông sản tươi mà còn thúc đẩy môi trường đô thị xanh hơn.",e:"Tuy nhiên, chi phí cao của vật liệu và dụng cụ có thể là rào cản với một số người làm vườn."},
L:["(c) → (a): (a) mô tả cụ thể việc làm vườn: trồng trên ban công, sân thượng.","(a) → (d): “This trend” thay cho hoạt động trồng rau được mô tả ở (a)/(c).","(d) → (b): “As more people participate” – thêm lợi ích khi xu hướng lan rộng.","(b) → (e): “However” chuyển sang mặt hạn chế ở cuối đoạn."],
t:"“This trend” (d) phải đứng sau câu mô tả xu hướng. “However” (e) nêu mặt trái thường đứng cuối sau khi đã nói hết lợi ích.",
