ana:{r:{c:"Mô tả hiện tượng (chưa gọi tên)",a:"Gọi tên + tác hại",e:"Ví dụ minh họa tác hại",b:"Phản đề: mặt tích cực",d:"Kết luận mở"},
v:{a:"Hiện tượng này, thường được gọi là “chảy máu chất xám”, tước đi của quê hương họ chính những nhân tài cần thiết cho sự phát triển.",b:"Tuy vậy, bức tranh không hoàn toàn ảm đạm, vì nhiều người di cư gửi tiền về nhà và sau này trở về với kinh nghiệm quốc tế quý giá.",c:"Mỗi năm, hàng nghìn chuyên gia trình độ cao rời các nước đang phát triển để tìm mức lương và điều kiện làm việc tốt hơn ở nước ngoài.",d:"Nhìn từ góc độ này, dòng chảy nhân tài cuối cùng có thể biến thành “thu hút chất xám” nếu chính phủ tạo ra những ưu đãi phù hợp để họ quay về.",e:"Chẳng hạn, các bệnh viện chật vật giữ chân bác sĩ và y tá, trong khi các trường đại học mất đi những nhà nghiên cứu triển vọng nhất."},
L:["(c) → (a): (c) mô tả hiện tượng; (a) “This phenomenon” gọi tên nó là “brain drain”; “their home nations” = “developing countries”.","(a) → (e): “for instance” minh họa cho việc mất nhân tài: bệnh viện, trường đại học.","(e) → (b): “Nevertheless, the picture is not entirely bleak” – đảo chiều sang mặt tích cực.","(b) → (d): “Seen from this perspective” chỉ góc nhìn tích cực ở (b) → “brain gain” (trái nghĩa với brain drain) → kết."],
t:"Lối viết quy nạp: mô tả trước, gọi tên sau. Câu có “This phenomenon” (a) không thể đứng đầu → loại A. Cặp trái nghĩa “brain drain” ↔ “brain gain” cho biết (d) là câu kết, sau phản đề “Nevertheless” (b) → loại D.",
w:[["brain drain / brain gain","chảy máu chất xám / thu hút chất xám"],["deprive sb of sth","tước đi của ai cái gì"],["the picture is not entirely bleak","bức tranh không hoàn toàn ảm đạm"],["create the right incentives","tạo ra những ưu đãi phù hợp"]]}},

{id:"A3",title:"Fast fashion",
s:{a:"The industry is responsible for a significant share of global water pollution, and most cheap garments end up in landfills after only a few wears.",b:"Behind these bargains, however, lies an enormous environmental cost.",c:"If this trend continues, it could force brands to rethink a business model built on quantity rather than quality.",d:"Fast fashion has transformed the clothing industry by making trendy garments available at remarkably low prices.",e:"Faced with such evidence, a growing number of consumers are turning to second-hand shopping and clothing rental services."},
opts:["dbaec","dabec","bdaec","daebc"],key:0,
ana:{r:{d:"Câu chủ đề (thời trang nhanh)",b:"Bước ngoặt: cái giá phải trả",a:"Bằng chứng về cái giá",e:"Phản ứng của người tiêu dùng",c:"Dự báo – kết luận"},
v:{a:"Ngành này chịu trách nhiệm cho một phần đáng kể ô nhiễm nguồn nước toàn cầu, và phần lớn quần áo giá rẻ bị đưa ra bãi rác chỉ sau vài lần mặc.",b:"Tuy nhiên, đằng sau những món hời này là một cái giá môi trường khổng lồ.",c:"Nếu xu hướng này tiếp diễn, nó có thể buộc các thương hiệu phải xem lại mô hình kinh doanh dựa trên số lượng thay vì chất lượng.",d:"Thời trang nhanh đã làm thay đổi ngành may mặc bằng cách đưa những bộ quần áo hợp mốt đến tay người mua với giá rẻ đáng kinh ngạc.",e:"Trước những bằng chứng như vậy, ngày càng nhiều người tiêu dùng chuyển sang mua đồ cũ và dịch vụ thuê quần áo."},
L:["(d) → (b): “these bargains” (những món hời) là từ thay thế cho “trendy garments at remarkably low prices” ở (d).","(b) → (a): (a) cụ thể hóa “environmental cost”: ô nhiễm nước, rác thải.","(a) → (e): “Faced with such evidence” – “such evidence” chính là số liệu ở (a).","(e) → (c): “this trend” thay cho việc người tiêu dùng chuyển sang đồ cũ ở (e) → dự báo kết đoạn."],
t:"Không có từ nối liệt kê – phải dựa vào từ thay thế: low prices → these bargains; pollution/landfills → such evidence; turning to second-hand → this trend. Câu chứa “these bargains” (b) không thể mở đoạn → loại C.",
w:[["fast fashion","thời trang nhanh"],["Behind…, however, lies…","Tuy nhiên, đằng sau… là… (đảo ngữ)"],["end up in landfills","cuối cùng bị đưa ra bãi rác"],["quantity rather than quality","số lượng thay vì chất lượng"]]}},

{id:"A4",title:"Teenagers & sleep",
s:{a:"The consequences of this sacrifice are far from trivial.",b:"Ironically, then, cutting sleep to gain more study time may actually undermine academic performance rather than improve it.",c:"Late-night studying, extra classes and the constant pull of smartphones all compete for the hours that should be spent resting.",d:"Poor sleep has been linked to weaker concentration, mood swings and even a higher risk of depression – the very opposite of what students need to succeed.",e:"Sleep is often the first thing teenagers sacrifice when their schedules become overloaded."},
opts:["ceadb","eacdb","ecdab","ecadb"],key:3,
ana:{r:{e:"Câu chủ đề (giấc ngủ bị hy sinh)",c:"Nguyên nhân",a:"Câu chuyển ý (hậu quả)",d:"Chi tiết hậu quả",b:"Kết luận – nghịch lý"},
v:{a:"Hậu quả của sự hy sinh này không hề nhỏ.",b:"Trớ trêu thay, việc cắt giảm giấc ngủ để có thêm thời gian học lại có thể làm giảm kết quả học tập thay vì cải thiện nó.",c:"Việc học khuya, học thêm và sức hút liên tục của điện thoại đều tranh giành những giờ lẽ ra dành cho nghỉ ngơi.",d:"Ngủ kém có liên quan đến khả năng tập trung giảm, tâm trạng thất thường và thậm chí nguy cơ trầm cảm cao hơn – trái ngược hoàn toàn với những gì học sinh cần để thành công.",e:"Giấc ngủ thường là thứ đầu tiên thanh thiếu niên hy sinh khi lịch trình trở nên quá tải."},
L:["(e) → (c): (e) nêu “overloaded schedules”; (c) liệt kê cụ thể những gì khiến lịch quá tải.","(c) → (a): “this sacrifice” là danh từ hóa của động từ “sacrifice” ở (e), sau khi (c) đã giải thích nguyên nhân.","(a) → (d): (a) là câu chuyển ý ngắn báo hiệu hậu quả; (d) liệt kê hậu quả cụ thể.","(d) → (b): “Ironically, then” – rút ra nghịch lý từ (d): mất ngủ vì học lại làm học kém."],
t:"Câu ngắn “The consequences of this sacrifice…” (a) là câu chuyển ý: đứng sau phần nguyên nhân, trước phần hậu quả. “then” trong “Ironically, then” báo hiệu suy luận cuối cùng → (b) kết đoạn. Loại A (mở bằng c), B (đặt a quá sớm, cắt mạch e → c).",
w:[["far from trivial","không hề nhỏ nhặt"],["compete for","tranh giành"],["mood swings","tâm trạng thất thường"],["undermine academic performance","làm suy giảm kết quả học tập"]]}}
];

const BASIC_RAW=[{"id": "B1", "n": 1, "cat": "basic", "title": "Đoạn văn số 1", "s": {"a": "It was formerly a quiet area with only a few shops and restaurants, but now it is bustling with activity.", "b": "In addition to the new shops, several parks have been developed, providing green spaces for relaxation and recreation.", "c": "New businesses have opened, attracting both locals and tourists, which has greatly enhanced the vibrancy of the neighborhood.", "d": "The city center has undergone significant changes over the past decade.", "e": "As a result of these improvements, the city center has become a popular destination for events and gatherings, fostering a strong sense of community."}, "opts": ["deacb", "dacbe", "dbeca", "dceab"], "key": 1}, {"id": "B2", "n": 2, "cat": "basic", "title": "Đoạn văn số 2", "s": {"a": "Over the past year, I volunteered at an orphanage where I helped organize educational activities for the children.", "b": "While this work is not always easy, I find immense happiness in knowing that I am making a positive impact on the community.", "c": "Participating in charity work has been a profoundly rewarding experience for me.", "d": "In fact, seeing their smiles and joy motivated me to continue my efforts in this field.", "e": "In conclusion, engaging in charity not only helps those in need but also teaches me valuable lessons about compassion and gratitude."}, "opts": ["bcade", "cadbe", "dcabe", "acbde"], "key": 1}, {"id": "B3", "n": 3, "cat": "basic", "title": "Đoạn văn số 3", "s": {"a": "It was eye-opening to see firsthand how small actions can contribute to preserving natural habitats.", "b": "One of the most impactful moments was witnessing the release of rehabilitated animals back into the wild, knowing that our efforts played a role in their recovery.", "c": "My experience with conservation started when I volunteered for a local wildlife protection project.", "d": "To sum up, it was a rewarding experience that deepened my appreciation for nature.", "e": "I was able to participate in various activities, from planting trees to helping monitor endangered species."}, "opts": ["aebcd", "bcead", "ebcad", "ceabd"], "key": 3}, {"id": "B4", "n": 4, "cat": "basic", "title": "Đoạn văn số 4", "s": {"a": "With the development of new treatments and technologies, diseases that were once incurable can now be managed or even eradicated.", "b": "Furthermore, innovations like telemedicine have made healthcare more accessible, allowing patients to consult with doctors remotely, especially in rural areas.", "c": "For instance, the discovery of antibiotics revolutionized the treatment of infections, saving millions of lives.", "d": "These changes have not only increased life expectancy but also enhanced the quality of life for many individuals.", "e": "The advancements in medicine have dramatically improved healthcare over the years."}, "opts": ["eacbd", "ebadc", "edacb", "ecdba"], "key": 0}, {"id": "B5", "n": 5, "cat": "basic", "title": "Đoạn văn số 5", "s": {"a": "While it sometimes requires extra effort to shop sustainably and avoid convenience items, the positive impact is worth it.", "b": "Over the past year, I've made an impact by reducing plastic use, recycling, and supporting local conservation projects.", "c": "Living sustainably at home encourages me to find creative solutions to minimize waste.", "d": "In conclusion, I'm incredibly proud of my eco-conscious lifestyle, as it aligns with my values of preserving the planet.", "e": "My commitment to nature and sustainability inspired me to adopt eco-friendly habits in my daily life."}, "opts": ["acbed", "cbead", "bcead", "ebcad"], "key": 3}, {"id": "B6", "n": 6, "cat": "basic", "title": "Đoạn văn số 6", "s": {"a": "It originally offered only a limited selection of groceries, but the growing demand prompted the owner to expand the inventory to include fresh produce and household items.", "b": "The shop now hosts regular promotional events, such as discounts and seasonal sales, which draw in more customers and create excitement within the community.", "c": "Thanks to the owner's unwavering dedication and commitment to quality service, the shop has become a beloved fixture in the neighborhood.", "d": "The small local shop has undergone significant transformation over the years.", "e": "After renovating the space to create a more inviting atmosphere, the shop successfully attracted a larger customer base, resulting in increased sales."}, "opts": ["decab", "dcabe", "daebc", "dbcae"], "key": 2}, {"id": "B7", "n": 7, "cat": "basic", "title": "Đoạn văn số 7", "s": {"a": "At first, I was unsure how to approach teaching the children, but I quickly learned effective techniques.", "b": "To sum up, I'm thrilled about the opportunity to help these kids improve their reading skills and proud of the progress they've made.", "c": "My fellow volunteers and I work together to create engaging activities that make learning enjoyable for everyone.", "d": "I have gained valuable experience in education and mentoring since I began volunteering at the local literacy program.", "e": "Currently, we're organizing a reading challenge that requires careful planning and coordination."}, "opts": ["cadeb", "eacdb", "daceb", "aedcb"], "key": 2}, {"id": "B8", "n": 8, "cat": "basic", "title": "Đoạn văn số 8", "s": {"a": "For instance, traveling becomes more enjoyable and meaningful when you can communicate with locals, making each interaction a chance to learn something new.", "b": "Studies show that bilingual individuals often have improved cognitive abilities, which can lead to better problem-solving skills and memory retention.", "c": "Being able to speak another language not only opens doors to new cultural experiences but also allows people to connect more deeply with others.", "d": "Learning a second language has become a popular goal for people of all ages.", "e": "Moreover, language skills are highly valued in today's global job market, where employers seek candidates who can communicate across cultures."}, "opts": ["decba", "dbcae", "dacbe", "dcaeb"], "key": 1}, {"id": "B9", "n": 9, "cat": "basic", "title": "Đoạn văn số 9", "s": {"a": "Running a small business requires long hours and constant dedication, but seeing the positive feedback from customers makes it all worthwhile.", "b": "Launching my own online bakery was a dream I had for years, and in 2024, I finally took the leap.", "c": "There have been tough days, especially during peak seasons, but I've learned to handle stress and adapt quickly.", "d": "In the end, building something from scratch and watching it grow has been one of the most satisfying experiences of my life.", "e": "From designing the website to experimenting with unique recipes, I've put my heart and soul into every aspect of the business."}, "opts": ["acebd", "beacd", "ecbad", "cebad"], "key": 1}, {"id": "B10", "n": 10, "cat": "basic", "title": "Đoạn văn số 10", "s": {"a": "City dwellers have started growing their own vegetables and herbs on balconies, rooftops, and community gardens.", "b": "As more people participate, local food networks have strengthened, reducing the reliance on imported goods.", "c": "Urban gardening has seen a significant rise in popularity in recent years.", "d": "This trend not only provides access to fresh produce but also promotes a greener urban environment.", "e": "However, the high cost of materials and supplies can be a barrier for some gardeners."}, "opts": ["cadbe", "cbeda", "cedab", "cdeab"], "key": 0}, {"id": "B11", "n": 11, "cat": "basic", "title": "Đoạn văn số 11", "s": {"a": "Additionally, choosing eco-friendly products and supporting renewable energy sources, such as solar or wind power, contributes to a greener planet.", "b": "Planting trees helps reduce carbon dioxide levels and improves air quality.", "c": "Simple actions like reducing plastic use, recycling, and conserving water can make a significant difference.", "d": "It's important for individuals, businesses, and governments to work together to preserve natural resources, reduce pollution, and combat climate change for future generations.", "e": "Protecting the environment is crucial for ensuring a healthy and sustainable future."}, "opts": ["ecbad", "eacdb", "ecabd", "deacb"], "key": 0}, {"id": "B12", "n": 12, "cat": "basic", "title": "Đoạn văn số 12", "s": {"a": "As AI continues to advance, it holds the potential to revolutionize fields such as healthcare, education, and business, though ethical considerations about job displacement and privacy are increasingly important.", "b": "Initially focused on basic problem-solving and calculations, AI now powers complex systems, from virtual assistants like Siri and Alexa to self-driving cars and advanced medical diagnostics.", "c": "Artificial Intelligence (AI) has rapidly evolved, transforming industries and everyday life.", "d": "Machine learning and deep learning technologies enable AI to analyze vast amounts of data, improving its decision-making abilities."}, "opts": ["cbda", "cdab", "bcad", "cadb"], "key": 0}, {"id": "B13", "n": 13, "cat": "basic", "title": "Đoạn văn số 13", "s": {"a": "There are several reasons why modern children tend to spend insufficient time with their parents.", "b": "This is because only when both parents are employed can they build a strong financial foundation for a comfortable life in this costly modern society.", "c": "Understandably, children may experience a sense of alienation from their parents.", "d": "One of the primary reasons for this is that many modern families have two working parents.", "e": "Another reason is that, after a hard day at work, parents tend to suffer from tiredness, so they prioritize entertainment and relaxation activities over tending to their children."}, "opts": ["adbec", "adebc", "adceb", "acbed"], "key": 0}, {"id": "B14", "n": 14, "cat": "basic", "title": "Đoạn văn số 14", "s": {"a": "Finally, when different generations living together, people can easily get mutual support.", "b": "Firstly, children always have other children to play with in the same house, so they learn social skills.", "c": "Secondly, people share their household tasks, which helps them to become responsible.", "d": "I believe there are three main advantages that living in a large family brings to people.", "e": "They sometimes quarrel over those chores, but when they quarrel, they learn ways to defend themselves."}, "opts": ["dbcea", "abcde", "bcdae", "dceba"], "key": 0}, {"id": "B15", "n": 15, "cat": "basic", "title": "Đoạn văn số 15", "s": {"a": "That's why it's vital that consumers thoughtfully examine the media they access.", "b": "It includes various forms such as television, radio, newspapers, and social media platforms.", "c": "Mass media play a significant role in shaping public opinion and culture.", "d": "However, while mass media can inform, it can mislead or manipulate if not used responsibly.", "e": "With the rise of the internet, online news and digital content have become essential sources of information."}, "opts": ["cedab", "abcde", "acbed", "cbeda"], "key": 3}, {"id": "B16", "n": 16, "cat": "basic", "title": "Đoạn văn số 16", "s": {"a": "Although numbers changed slightly in the middle period, by 2015, both groups had returned to nearly the same unemployment rates as in 1990, with 14% for non-graduates and 10% for graduates.", "b": "The line graph illustrates the unemployment trends among recent graduates and non-graduates aged 21 to 30 between 1990 and 2015.", "c": "At all times, the number of unemployed non-graduates was higher than that of recent graduates.", "d": "Throughout the period, there were fluctuations in both groups, with a decline followed by an increase.", "e": "From 1990 to 2000, unemployment decreased, with a slight drop in the early years and a more significant decline towards 2000."}, "opts": ["acbde", "bdcea", "bedca", "aedbc"], "key": 1}, {"id": "B17", "n": 17, "cat": "basic", "title": "Đoạn văn số 17", "s": {"a": "Online shopping offers convenience, allowing consumers to purchase products from the comfort of their homes.", "b": "However, one of the challenges is that customers cannot physically examine the products before buying them.", "c": "It's important to read product reviews and check return policies before making a purchase.", "d": "Online shopping platforms offer a wide range of items, from electronics to clothing and groceries.", "e": "Despite its convenience, online shopping can sometimes lead to impulse buying and overspending."}, "opts": ["abcde", "cbaed", "dabce", "edbca"], "key": 2}, {"id": "B18", "n": 18, "cat": "basic", "title": "Đoạn văn số 18", "s": {"a": "However, despite this increase in opportunities, many fields still lack sufficient training programs, especially in smaller towns.", "b": "Career paths have evolved dramatically over the years, with more options available than ever before.", "c": "The rise of digital technologies has also created new jobs, especially in fields like IT, marketing, and online business.", "d": "This shift in the job market has led to a surge in specialized education and training, giving people a chance to pursue various career interests.", "e": "As a result, more young people are seeking out non-traditional careers that allow for remote work and flexible schedules."}, "opts": ["bdeca", "bcaed", "dbeca", "bdcae"], "key": 3}, {"id": "B19", "n": 19, "cat": "basic", "title": "Đoạn văn số 19", "s": {"a": "Many animals are at risk due to factors like deforestation, pollution, and illegal hunting.", "b": "By raising awareness and supporting conservation organizations, we can all contribute to protecting wildlife for future generations and ensuring a healthy planet.", "c": "Wildlife conservation is the protection and preservation of animal species and their natural habitats.", "d": "This can be done through establishing protected areas, enforcing laws against poaching, and promoting sustainable practices.", "e": "Conservation efforts help prevent species from going extinct and keep ecosystems balanced."}, "opts": ["caedb", "cbead", "cdeba", "cadeb"], "key": 0}, {"id": "B20", "n": 20, "cat": "basic", "title": "Đoạn văn số 20", "s": {"a": "However, despite the growing importance of continuous learning, many adults still face barriers to accessing education, such as time constraints and financial challenges.", "b": "The rise of online courses and self-paced learning platforms has made it easier for people of all ages to acquire new skills.", "c": "Lifelong learning is becoming increasingly essential as the job market evolves, requiring workers to stay updated with new technologies and methodologies.", "d": "Over the past decade, there has been a growing recognition of the value of lifelong learning, both in professional and personal contexts.", "e": "This shift in attitude towards learning has led to more people pursuing further education, with an increasing number of individuals enrolling in online degree programs and skill-building workshops."}, "opts": ["dbcea", "dceba", "edbca", "bedca"], "key": 1}, {"id": "B21", "n": 21, "cat": "basic", "title": "Đoạn văn số 21", "s": {"a": "By imposing restrictions, parents can allocate more time for learning and healthier outdoor pursuits.", "b": "Secondly, excessive screen time poses health risks, including potential damage to eyesight, headaches, and issues like sleep disturbances and weight problems.", "c": "Firstly, prolonged screen use often hinders teenagers from completing their homework, impacting both their academic performance and outdoor activities.", "d": "Excessive screen time is a prevalent issue among today's teenagers, and I strongly advocate for parents to impose strict limits on their usage for two crucial reasons.", "e": "In conclusion, parental control over teenagers' digital device usage is vital to ensure a balance between academic responsibilities, outdoor activities, and the protection of their overall health"}, "opts": ["cedab", "dcabe", "decab", "dceab"], "key": 1}, {"id": "B22", "n": 22, "cat": "basic", "title": "Đoạn văn số 22", "s": {"a": "However, experts believe that AI will not just eliminate jobs but also create new opportunities in areas that require human creativity, emotional intelligence, and complex problem-solving skills.", "b": "The rapid development of artificial intelligence (AI) is significantly altering the global job market, with many industries being affected.", "c": "A report showed that in 2023 alone, over 1.5 million jobs were automated globally due to advancements in AI technologies, and this number is expected to rise.", "d": "Numerous workers are growing increasingly concerned about job security as AI continues to replace positions traditionally held by humans, particularly in fields like manufacturing and customer service.", "e": "In conclusion, the key challenge for the workforce will be to adapt to these changes by reskilling and embracing new roles that AI cannot easily replace."}, "opts": ["bacde", "bdcae", "dacbe", "adcbe"], "key": 1}, {"id": "B23", "n": 23, "cat": "basic", "title": "Đoạn văn số 23", "s": {"a": "Throughout the past two years, I have been deeply immersed in the fulfilling vocation of teaching English, where I facilitate students in refining their linguistic capabilities and bolstering their self-assurance.", "b": "My enduring passion for education and personal advancement has driven me to pursue a career dedicated to teaching.", "c": "In summation, the profession of teaching epitomizes a profoundly gratifying pursuit that aligns impeccably with my ambitions and fervent interests.", "d": "While the challenges of managing a classroom can be formidable, the profound satisfaction derived from observing my students' progress renders all efforts worthwhile.", "e": "Teaching not only affords me the privilege of disseminating knowledge but also grants me the invaluable opportunity to glean insights from my students."}, "opts": ["dbcea", "abcde", "bcdae", "baedc"], "key": 3}, {"id": "B24", "n": 24, "cat": "basic", "title": "Đoạn văn số 24", "s": {"a": "Despite the remarkable developments, the public transportation infrastructure remains inadequate, creating significant challenges for the daily commutes faced by numerous residents.", "b": "Over the past decade, Riverton has experienced an extraordinary transformation, characterized by substantial growth and modernization.", "c": "Numerous outdated residential structures have been supplanted by contemporary apartment complexes, attracting a diverse array of young professionals and families.", "d": "This swift urbanization has acted as a catalyst for economic expansion, leading to the emergence of new shopping centers, upscale dining venues, and corporate office spaces.", "e": "The population has surged by nearly 30%, resulting in increased demand for housing and skyrocketing property prices."}, "opts": ["dbcea", "bcdea", "deabc", "debca"], "key": 1}, {"id": "B25", "n": 25, "cat": "basic", "title": "Đoạn văn số 25", "s": {"a": "Globalization has enabled people from different cultures to interact more easily than ever before.", "b": "However, cultural differences can sometimes lead to misunderstandings and conflicts.", "c": "To overcome these challenges, individuals should develop cultural awareness and respect for others' traditions.", "d": "As a result, societies today are becoming more multicultural and diverse.", "e": "By promoting cross-cultural understanding, people can build a more inclusive and harmonious world."}, "opts": ["abdec", "dabce", "adbce", "adebc"], "key": 2}, {"id": "B26", "n": 26, "cat": "basic", "title": "Đoạn văn số 26", "s": {"a": "These skills include communication, teamwork, time management, and problem-solving.", "b": "In today's workplace, soft skills are just as important as technical skills.", "c": "Employers highly value candidates who possess strong soft skills, as they contribute to a positive and productive work environment.", "d": "Without these abilities, even the most skilled employees may struggle to collaborate effectively.", "e": "Therefore, developing soft skills should be a priority for anyone preparing to enter the workforce."}, "opts": ["badce", "abcde", "bcade", "bacde"], "key": 3}, {"id": "B27", "n": 27, "cat": "basic", "title": "Đoạn văn số 27", "s": {"a": "Over the past few years, I've journeyed to various parts of the world, from the bustling streets of Tokyo to the serene beaches of Bali.", "b": "My love for adventure and curiosity about different ways of life has fueled my desire to explore, making each trip more rewarding than the last.", "c": "Traveling to new countries and experiencing diverse cultures has always been my greatest passion.", "d": "Each destination offers unique adventures, whether it's sampling street food, exploring historical sites, or connecting with locals who share their stories.", "e": "In conclusion, being a globetrotter not only enriches my life but also broadens my perspective, reminding me of the beauty of our diverse world."}, "opts": ["dbace", "abcde", "bcdea", "cadbe"], "key": 3}, {"id": "B28", "n": 28, "cat": "basic", "title": "Đoạn văn số 28", "s": {"a": "In places like Beijing, China, the air is often full of smoke and harmful gases from cars and factories.", "b": "Children and elderly people are especially affected by the dirty air and can get sick more easily.", "c": "The pollution makes it hard to breathe, and people sometimes wear masks to protect themselves.", "d": "In many big cities, air pollution is a serious problem.", "e": "To improve the situation, the government is working on better public transportation and encouraging the use of clean energy."}, "opts": ["dacbe", "dabec", "dcaeb", "dbcae"], "key": 0}, {"id": "B29", "n": 29, "cat": "basic", "title": "Đoạn văn số 29", "s": {"a": "To begin with, students can gain and develop important skills that may be useful in their future careers.", "b": "Today, more and more students are doing part-time jobs while they are still studying at secondary school. Having a job while at school can benefit secondary school students in several ways.", "c": "For example, if a student works as a waiter or waitress, he or she can learn how to greet and communicate with customers.", "d": "The real work environment can help students learn more new skills as well as improve existing ones such as communication, teamwork, or problem-solving skills.", "e": "Those who are equipped with various life skills can perform better in their future jobs."}, "opts": ["dbcea", "abcde", "badce", "cadbe"], "key": 2}, {"id": "B30", "n": 30, "cat": "basic", "title": "Đoạn văn số 30", "s": {"a": "Responsible digital citizens respect other people's privacy, too.", "b": "They don't post pictures of others or discuss people's personal lives without their permission because that could harm their online security.", "c": "In this way, digital citizens help others to feel safer and more comfortable in the digital world.", "d": "A responsible digital citizen is someone who uses technology in a sensible way and encourages others to do the same.", "e": "They are careful about their online behaviour and always try to be as polite as possible, which helps others to avoid having negative experiences online."}, "opts": ["dbcea", "dcabe", "deabc", "debca"], "key": 2}, {"id": "B31", "n": 31, "cat": "basic", "title": "Đoạn văn số 31", "s": {"a": "The ability of movies to transport audiences to different worlds and experiences is what makes them such a powerful form of entertainment.", "b": "Over the years, I have explored various film genres, from thrilling action blockbusters to emotional dramas that leave a lasting impact.", "c": "In conclusion, movies are more than just a pastime for me—they are a source of inspiration and a window into different cultures and perspectives.", "d": "My passion for cinema started at a young age when I first discovered the magic of storytelling through the big screen.", "e": "Whether it's a beautifully crafted screenplay or stunning cinematography, every element of filmmaking contributes to creating a captivating experience."}, "opts": ["dbeac", "adbec", "dabec", "bdaec"], "key": 0}, {"id": "B32", "n": 32, "cat": "basic", "title": "Đoạn văn số 32", "s": {"a": "With the increasing demand for academic success, many students turn to private tutoring as a way to strengthen their knowledge and improve their exam performance.", "b": "However, while tutoring offers benefits, it also raises concerns about student stress and the pressure of an overloaded schedule.", "c": "Over the past decade, tutoring has become a common practice, with more students enrolling in extra classes to keep up with the competitive academic environment.", "d": "As a result, many parents invest heavily in private lessons, hoping to give their children an advantage in exams and future career opportunities.", "e": "In conclusion, while tutoring can provide academic support, it is crucial to maintain a balance to ensure students' well-being and avoid excessive pressure."}, "opts": ["cadbe", "adcbe", "cdabe", "dcaeb"], "key": 0}, {"id": "B33", "n": 33, "cat": "basic", "title": "Đoạn văn số 33", "s": {"a": "As the tour progresses, the guide points out the library, known for its extensive collection and quiet study spaces.", "b": "In the student union, a bustling café and activity spaces reflect the campus's lively community spirit.", "c": "These features combine to create an environment that inspires both learning and connection, leaving a lasting impression on everyone who visits.", "d": "Nearby, a state-of-the-art science center showcases the university's commitment to innovation and research.", "e": "Walking through the vibrant college campus, visitors are greeted by lush gardens and historic buildings."}, "opts": ["bceda", "eadbc", "adecb", "cadbe"], "key": 1}, {"id": "B34", "n": 34, "cat": "basic", "title": "Đoạn văn số 34", "s": {"a": "Without immediate action, however, these linguistic treasures could disappear forever, taking centuries of heritage with them.", "b": "Efforts to preserve endangered languages, such as offering them in school curriculums, have shown promise in revitalising interest.", "c": "Many minority languages are under threat due to the increasing dominance of global languages like English and Spanish.", "d": "In some regions, younger generations are opting to speak more widely-used languages, leaving the traditional ones to fade.", "e": "The loss of these languages also means losing unique cultural identities and traditional knowledge passed down through generations."}, "opts": ["cbdae", "ceadb", "cabed", "cdeba"], "key": 3}, {"id": "B35", "n": 35, "cat": "basic", "title": "Đoạn văn số 35", "s": {"a": "These products, including straws, bags, and cutlery, often end up in landfills and oceans, contributing to pollution and harming wildlife.", "b": "While these solutions may require changes in consumer habits and production methods, they can significantly lessen the impact on our planet.", "c": "Many countries are now considering alternatives, such as biodegradable materials or reusable options, to reduce plastic waste.", "d": "The widespread use of single-use plastic items has created significant environmental challenges.", "e": "However, the sustainability of these alternatives remains questionable."}, "opts": ["dacbe", "cbeda", "dcabe", "deacb"], "key": 0}, {"id": "B36", "n": 36, "cat": "basic", "title": "Đoạn văn số 36", "s": {"a": "The park nearby had also been renovated with new playground equipment and walking trails, making it look welcoming and modern.", "b": "Also, despite its transformation, the memories and bonds he formed there would always remain close to his heart.", "c": "Driving through familiar streets, he was surprised to find that the old bakery had been replaced by a trendy café, filled with young people.", "d": "While some changes felt strange, like the absence of his favourite bookshop, James was glad to see the new life in his hometown.", "e": "After years of living abroad, James finally returned to visit his hometown; he was excited to see how it had changed."}, "opts": ["edacb", "decab", "eacbd", "ecadb"], "key": 3}, {"id": "B37", "n": 37, "cat": "basic", "title": "Đoạn văn số 37", "s": {"a": "The hospital, which was set up in a remote area, often lacked basic supplies, making every task more challenging.", "b": "Her dedication inspired others on the team, creating a sense of unity and purpose in difficult times.", "c": "Despite the difficulties, she remained determined, working long hours to ensure patients received the attention they needed.", "d": "During her youth, my grandmother worked tirelessly in a field hospital, providing care to injured soldiers.", "e": "These experiences not only shaped her character but also taught her the value of resilience and compassion."}, "opts": ["dacbe", "decab", "dbeca", "dceba"], "key": 0}, {"id": "B38", "n": 38, "cat": "basic", "title": "Đoạn văn số 38", "s": {"a": "Using carpooling programs can also help organizations and cities promote more sustainable transportation options, contributing to efforts in fighting climate change.", "b": "Carpooling brings about several notable opportunities for individuals who share rides to work or school.", "c": "By sharing rides with others, participants can build connections and friendships, creating a sense of community and cooperation among commuters.", "d": "Additionally, carpooling can lead to decreased traffic congestion, which means less time spent in traffic and improved air quality for everyone in the community.", "e": "In conclusion, embracing carpooling as a viable transportation option offers numerous benefits, from financial savings to environmental protection, making it a great choice for modern commuters."}, "opts": ["bacde", "bcade", "dcbae", "adcbe"], "key": 1}, {"id": "B39", "n": 39, "cat": "basic", "title": "Đoạn văn số 39", "s": {"a": "Offering hands-on learning experiences and engaging projects in STEM can ignite students' interest in these subjects, helping them develop critical thinking and problem-solving skills.", "b": "Many high schools are increasingly recognizing the importance of STEM programs, which stand for science, technology, engineering, and mathematics, as essential components of modern education.", "c": "In conclusion, integrating STEM programs in high schools is vital for preparing students for successful futures in a technology-driven world.", "d": "Furthermore, schools that prioritize STEM education not only prepare students for the workforce but also equip them with the tools to tackle global challenges, such as climate change.", "e": "Research indicates that students who participate in STEM-related activities are more likely to pursue careers in these fields, with statistics showing that job opportunities in STEM are expected to grow by 8% from 2019 to 2029."}, "opts": ["dbace", "eadbc", "beadc", "dbeac"], "key": 2}, {"id": "B40", "n": 40, "cat": "basic", "title": "Đoạn văn số 40", "s": {"a": "The rise of the internet and smartphones has connected people globally, enabling instant communication and access to information.", "b": "Technology and innovation have revolutionized the way we live, work, and communicate.", "c": "However, rapid technological changes also pose challenges, such as job displacement and privacy concerns.", "d": "Balancing the benefits and risks of technology is crucial for sustainable development.", "e": "Advances in artificial intelligence, robotics, and biotechnology are transforming industries and creating new opportunities."}, "opts": ["cdbae", "ecabd", "baecd", "abdec"], "key": 2}, {"id": "B41", "n": 41, "cat": "basic", "title": "Đoạn văn số 41", "s": {"a": "However, once the foundation is laid, the real work begins as they start building more complex systems of thought and understanding.", "b": "Learning a new language is challenging, especially at the beginning when students are overwhelmed by grammar rules and unfamiliar vocabulary.", "c": "With continuous practice, learners gradually develop confidence in their speaking, listening, and writing skills, although progress may seem slow at first.", "d": "Many language learners experience frustration early on, but it's important to remember that fluency comes with time and dedication.", "e": "In the end, the sense of accomplishment that comes from mastering a language makes the effort worthwhile, opening doors to new cultures and opportunities."}, "opts": ["bdace", "adcbe", "bacde", "dbace"], "key": 0}, {"id": "B42", "n": 42, "cat": "basic", "title": "Đoạn văn số 42", "s": {"a": "In response, many governments and organizations have introduced green initiatives, encouraging individuals to adopt eco-friendly lifestyles.", "b": "Environmental issues such as pollution, deforestation, and climate change are growing concerns worldwide.", "c": "However, the success of these programs depends greatly on public awareness and daily habits.", "d": "These habits include reducing waste, conserving water, and using renewable energy sources when possible.", "e": "Only with a joint effort from individuals, communities, and authorities can we ensure a cleaner, more sustainable future."}, "opts": ["cbade", "badce", "abcde", "bacde"], "key": 3}, {"id": "B43", "n": 43, "cat": "basic", "title": "Đoạn văn số 43", "s": {"a": "These ongoing problems clearly highlight the urgent need for more effective urban planning and long term strategies to support sustainable development.", "b": "This rapid urban growth has attracted thousands of workers from nearby rural provinces seeking better opportunities.", "c": "Traffic congestion and housing shortages have now become major challenges that city authorities struggle to manage.", "d": "In recent years, the city center has witnessed a dramatic increase in high-rise buildings, shopping complexes, and new transport systems.", "e": "However, the pace of infrastructure development has not matched the growing demands of the population."}, "opts": ["dbcea", "bdeac", "dbeca", "debca"], "key": 2}, {"id": "B44", "n": 44, "cat": "basic", "title": "Đoạn văn số 44", "s": {"a": "Lifelong learning, however, is not merely about acquiring qualifications but also about nurturing curiosity and adaptability.", "b": "Lifelong learning is an ongoing process that allows individuals to develop professionally and personally throughout their lives.", "c": "As technology continues to evolve rapidly, the ability to learn and relearn has become a critical skill in the modern world.", "d": "From formal education to self-directed learning, it provides countless opportunities for growth and improvement.", "e": "In conclusion, embracing lifelong learning enables us to remain relevant, adaptable, and open to new challenges in an ever-changing world."}, "opts": ["bdace", "badce", "bacde", "bcdae"], "key": 0}, {"id": "B45", "n": 45, "cat": "basic", "title": "Đoạn văn số 45", "s": {"a": "For example, behaviors that are acceptable in one culture, such as direct eye contact, may be considered impolite in another.", "b": "At first, people may feel excited about exploring a new culture, but this initial enthusiasm often fades as they begin to notice differences in language, customs, and social norms.", "c": "Culture shock, which occurs when individuals struggle to adapt to a foreign culture, is a common experience for travelers and expatriates.", "d": "This period of adjustment can be challenging, but it ultimately helps individuals develop a deeper understanding of and respect for cultural diversity.", "e": "Such differences can lead to feelings of frustration, confusion, or even isolation for newcomers."}, "opts": ["ceabd", "cbaed", "caebd", "cbead"], "key": 1}, {"id": "B46", "n": 46, "cat": "basic", "title": "Đoạn văn số 46", "s": {"a": "However, despite this growth, Redmond still lacks a hospital, as the nearest one is located over 30 miles away in Longreach.", "b": "Once abundant parks on Oak Street and Richmond Avenue have been replaced by factories, marking a shift towards industrialization.", "c": "The industrial shift has also attracted new businesses, from arcades to shops and factories, boosting the local economy and making Redmond more and more commercially active.", "d": "Redmond has transformed significantly over the past decade.", "e": "This industrial growth has led to a 25% population boom due to an influx of factory workers, resulting in increased traffic congestion."}, "opts": ["daebc", "debca", "dcabe", "dbcea"], "key": 3}, {"id": "B47", "n": 47, "cat": "basic", "title": "Đoạn văn số 47", "s": {"a": "While deadlines and flexibility are essential aspects of this job, the occasional office meeting for project updates, for instance, is a small trade-off.", "b": "Working remotely from home fuels my creativity and allows for a more productive environment.", "c": "Indeed, for the past year, I have thrived in this role at a local company, where I craft engaging online content and develop effective strategies.", "d": "My passion for both people and technology naturally led me to a fulfilling career in social media management.", "e": "In conclusion, I am incredibly happy with my current position and the opportunities it provides, as it perfectly combines my interests and skills."}, "opts": ["bcdae", "cadbe", "abcde", "dcbae"], "key": 3}, {"id": "B48", "n": 48, "cat": "basic", "title": "Đoạn văn số 48", "s": {"a": "The town's shopping district has also expanded, with new stores and cafes along Main Street.", "b": "Over the past few years, Hillcrest has changed drastically, with rapid growth and new businesses setting up.", "c": "However, the expansion has led to rising property prices, making it harder for longtime residents to afford living in the area.", "d": "This economic boom has attracted young professionals, leading to an increase in demand for housing and entertainment options.", "e": "Despite these improvements, Hillcrest still lacks basic facilities like a community center or hospital, which residents have long requested."}, "opts": ["baecd", "bdace", "abecd", "dbaec"], "key": 1}, {"id": "B49", "n": 49, "cat": "basic", "title": "Đoạn văn số 49", "s": {"a": "My background in graphic design has been invaluable in my current role.", "b": "I have always had a deep interest in art and technology, which led me to pursue a career in digital marketing.", "c": "Over the last two years, I have grown tremendously, developing my skills and contributing to various projects.", "d": "Although working in a fast-paced environment can be demanding, I find it incredibly rewarding.", "e": "In summary, I am thrilled with my journey so far and excited about the opportunities ahead."}, "opts": ["acbde", "cdabe", "dbace", "bcdae"], "key": 3}, {"id": "B50", "n": 50, "cat": "basic", "title": "Đoạn văn số 50", "s": {"a": "I am also proud to speak a language that has a long history. Although my country used to be invaded by other countries, the language has always been kept alive and the most powerful unifying force.", "b": "Among these features, language is what makes me Vietnamese. There are several reasons for this.", "c": "For most people, expressing one's cultural identity is often a way to show who they are and how they relate to others. It can be demonstrated through their language, food, clothing, beliefs, music and festivals.", "d": "Vietnamese is the language that can unite the people of my country in the face of any danger. Although there are over fifty ethnic groups, we all use Vietnamese as the official language.", "e": "It is the means of communication at school and in my community. It allows me to experience and share my culture."}, "opts": ["ebdca", "cbdae", "dcabe", "eabcd"], "key": 1}, {"id": "B51", "n": 51, "cat": "basic", "title": "Đoạn văn số 51", "s": {"a": "Despite these efforts, challenges such as the gender pay gap, underrepresentation of women in leadership roles, and gender-based violence remain widespread.", "b": "In recent decades, significant progress has been made toward achieving gender equality, with advancements in women's education, political participation, and workplace inclusion.", "c": "This shift has been fueled by a growing recognition that gender equality is not only a matter of social justice but also a key driver of economic growth and social stability.", "d": "International organizations, governments, and grassroots movements have increasingly advocated for the empowerment of women and the dismantling of patriarchal norms.", "e": "Nevertheless, achieving true gender parity requires continuous efforts, including policy reforms, societal changes, and increased accountability across all sectors."}, "opts": ["badce", "badec", "bdaec", "bcdae"], "key": 3}, {"id": "B52", "n": 52, "cat": "basic", "title": "Đoạn văn số 52", "s": {"a": "However, being adaptable and learning quickly are critical skills for succeeding in this fast- paced industry.", "b": "In the past three years, I have developed these abilities through various challenges and projects.", "c": "Therefore, I am confident that I can meet the demands of any high-pressure work environment.", "d": "Having a strong foundation in problem-solving has allowed me to thrive in my career.", "e": "This skillset has been essential to my progress and will be a valuable asset moving forward."}, "opts": ["bdace", "debac", "dbaec", "abdce"], "key": 1}];

seq:[["The pie charts compare the electricity generation mix of a developing nation in 2010 and 2020.","Các biểu đồ tròn so sánh cơ cấu nguồn phát điện của một quốc gia đang phát triển vào năm 2010 và 2020.","Giới thiệu biểu đồ"],
["The steepest increase was noted in renewable energy sources, which surged from 10% to 30% of the total.","Mức tăng mạnh nhất được ghi nhận ở các nguồn năng lượng tái tạo, tăng vọt từ 10% lên 30% tổng sản lượng.","Chi tiết 1: tăng mạnh nhất"],
["Concurrently, coal-fired power generation, though still dominant, reduced its share from 70% to 50%.","Đồng thời, nhiệt điện than, dù vẫn chiếm ưu thế, đã giảm tỷ trọng từ 70% xuống 50%.","Chi tiết 2: giảm"],
["Natural gas and hydropower maintained relatively consistent contributions, together accounting for the remaining percentage.","Khí tự nhiên và thủy điện duy trì mức đóng góp tương đối ổn định, cùng chiếm phần trăm còn lại.","Chi tiết 3: ổn định"],
["This transition is largely driven by stricter environmental regulations and advancements in green technologies.","Sự chuyển dịch này chủ yếu được thúc đẩy bởi các quy định môi trường chặt chẽ hơn và tiến bộ của công nghệ xanh.","Giải thích nguyên nhân – kết"]],
L:["Câu giới thiệu “The pie charts compare…” đứng đầu; tiếp theo là thay đổi nổi bật nhất “The steepest increase”.","“Concurrently” (đồng thời) nối sự sụt giảm của than với sự tăng của năng lượng tái tạo – hai thay đổi diễn ra song song.","Sau hai nguồn biến động mạnh là các nguồn “maintained relatively consistent contributions”, chiếm “the remaining percentage”.","“This transition” gói lại toàn bộ sự chuyển dịch cơ cấu → giải thích nguyên nhân ở cuối."],
t:"“Concurrently” (d) chỉ có nghĩa khi đã có một thay đổi khác đứng trước nó → (a) phải đứng trước (d), loại A và D. “This transition” (b) không thể mở đoạn → loại C.",
w:[["electricity generation mix","cơ cấu nguồn phát điện"],["surge from … to …","tăng vọt từ … lên …"],["concurrently","đồng thời"],["coal-fired power generation","nhiệt điện than"]]},

{ty:"c",src:19,ti:"Bar graph – top economic concerns",ok:"bacde",opts:["bcade","abcde","bdcae","bacde"],k:3,
seq:[["The bar graph illustrates the top five economic concerns among citizens of an industrialized nation in 2024.","Biểu đồ cột thể hiện năm mối lo ngại kinh tế hàng đầu của người dân một quốc gia công nghiệp phát triển năm 2024.","Giới thiệu biểu đồ"],
["The most significant concern was the rising cost of living, cited by 60% of respondents.","Mối lo lớn nhất là chi phí sinh hoạt tăng cao, được 60% người tham gia khảo sát nhắc đến.","Hạng 1"],
["This was followed by job security (45%) and healthcare affordability (38%).","Tiếp theo là sự ổn định việc làm (45%) và khả năng chi trả chi phí y tế (38%).","Hạng 2 – 3"],
["Inflation and national debt were also prominent, garnering 30% and 25% of mentions, respectively.","Lạm phát và nợ quốc gia cũng nổi bật, lần lượt nhận được 30% và 25% lượt đề cập.","Hạng 4 – 5"],
["The findings suggest a populace grappling with financial anxieties amidst global economic uncertainties.","Kết quả cho thấy người dân đang vật lộn với những lo âu tài chính giữa bối cảnh kinh tế toàn cầu bất ổn.","Nhận xét – kết luận"]],
L:["Sau câu giới thiệu là mối lo “most significant” – xếp hạng từ cao xuống thấp.","“This was followed by” – “This” thay cho “the rising cost of living”, dẫn tới hạng 2 và 3.","“also prominent” – bổ sung hai mục cuối với số liệu thấp hơn (30%, 25%).","“The findings suggest…” rút ra nhận xét chung → kết."],
t:"Biểu đồ xếp hạng: đi theo số liệu giảm dần 60% → 45%/38% → 30%/25%. “This was followed by” (c) cần câu hạng 1 (a) đứng ngay trước → loại A, C.",
w:[["be cited by","được nhắc đến bởi"],["cost of living","chi phí sinh hoạt"],["respectively","lần lượt (theo thứ tự)"],["grapple with","vật lộn, đối phó với"]]},

{ty:"p",src:24,ti:"E-commerce & its environmental cost",ok:"bcaed",opts:["abced","bcaed","becad","bacde"],k:1,
seq:[["E-commerce has fundamentally reshaped consumer behavior, offering unparalleled convenience and a vast array of products at competitive prices.","Thương mại điện tử đã định hình lại căn bản hành vi tiêu dùng, mang lại sự tiện lợi chưa từng có cùng vô số sản phẩm với giá cạnh tranh.","Câu chủ đề"],
["The ability to shop from anywhere at any time has made online retail an indispensable part of modern life.","Khả năng mua sắm ở bất cứ đâu, bất cứ lúc nào đã khiến bán lẻ trực tuyến trở thành một phần không thể thiếu của cuộc sống hiện đại.","Phát triển ý “tiện lợi”"],
["This convenience, however, often comes with environmental costs, including increased packaging waste and carbon emissions from delivery.","Tuy nhiên, sự tiện lợi này thường đi kèm cái giá về môi trường, gồm rác thải bao bì tăng và khí thải carbon từ việc giao hàng.","Bước ngoặt: mặt trái"],
["While benefiting from global accessibility, shoppers must also be mindful of the ecological footprint of their online purchases.","Trong khi tận hưởng khả năng tiếp cận toàn cầu, người mua cũng cần lưu tâm đến dấu chân sinh thái của các đơn hàng trực tuyến.","Trách nhiệm người mua"],
["Consequently, businesses are increasingly investing in sustainable logistics and eco-friendly packaging to address these concerns.","Do đó, các doanh nghiệp ngày càng đầu tư vào hậu cần bền vững và bao bì thân thiện môi trường để giải quyết những lo ngại này.","Phản ứng của doanh nghiệp – kết"]],
L:["(c) cụ thể hóa “unparalleled convenience” ở (b): mua sắm mọi lúc mọi nơi.","“This convenience, however” gói lại sự tiện lợi đã được trình bày đủ ở (b)–(c) rồi mới chuyển sang mặt trái.","Sau khi nêu tác hại môi trường, (e) nêu trách nhiệm của người mua: “mindful of the ecological footprint”.","“Consequently… to address these concerns” – “these concerns” chỉ các lo ngại môi trường ở (a)–(e) → kết đoạn."],
t:"Câu chứa “This convenience” (a) không thể mở đoạn → loại A. Khi (a) đứng ngay sau (b) như phương án D, câu (c) – lại ca ngợi sự tiện lợi – bị kẹt giữa phần nói về tác hại. (Tài liệu gốc đánh dấu D; em chọn B vì mạch b → c → a liền lạc hơn.)",
w:[["reshape consumer behavior","định hình lại hành vi tiêu dùng"],["unparalleled convenience","sự tiện lợi chưa từng có"],["indispensable","không thể thiếu"],["ecological footprint","dấu chân sinh thái"]]},

{ty:"p",src:25,ti:"Digital technology & wellbeing",ok:"bcaed",opts:["bcaed","bacde","abced","becad"],k:0,
seq:[["Digital technology has become an ubiquitous presence in our lives, revolutionizing communication, entertainment, and access to information.","Công nghệ số đã hiện diện khắp nơi trong cuộc sống, cách mạng hóa giao tiếp, giải trí và việc tiếp cận thông tin.","Câu chủ đề"],
["From smartphones to smart homes, these innovations offer unprecedented levels of connectivity and efficiency.","Từ điện thoại thông minh đến nhà thông minh, những đổi mới này mang lại mức độ kết nối và hiệu quả chưa từng có.","Phát triển: lợi ích"],
["However, prolonged exposure to these devices, particularly among younger generations, raises concerns about mental health and cognitive development.","Tuy nhiên, việc tiếp xúc lâu dài với các thiết bị này, nhất là ở thế hệ trẻ, làm dấy lên lo ngại về sức khỏe tinh thần và sự phát triển nhận thức.","Bước ngoặt: lo ngại"],
["The constant stream of notifications and the pressure to maintain online presence can contribute to anxiety, sleep disorders, and attention deficits.","Dòng thông báo liên tục và áp lực duy trì sự hiện diện trên mạng có thể góp phần gây lo âu, rối loạn giấc ngủ và suy giảm khả năng tập trung.","Chi tiết tác hại"],
["Experts suggest setting boundaries, encouraging offline activities, and promoting digital literacy to foster a healthier relationship with technology.","Các chuyên gia khuyên nên đặt giới hạn, khuyến khích hoạt động ngoại tuyến và nâng cao năng lực số để xây dựng mối quan hệ lành mạnh hơn với công nghệ.","Giải pháp – kết"]],
L:["“these innovations” ở (c) thay cho “digital technology” ở (b); “From smartphones to smart homes” là ví dụ cụ thể.","“However… these devices” – đảo chiều sau khi lợi ích đã được nêu; “these devices” = smartphones, smart homes ở (c).","(e) cụ thể hóa “concerns about mental health”: lo âu, rối loạn giấc ngủ, mất tập trung.","Sau vấn đề là giải pháp của chuyên gia → kết đoạn."],
t:"Cấu trúc kinh điển: Chủ đề → Lợi ích → However (vấn đề) → Chi tiết vấn đề → Giải pháp. “these innovations” (c) phải đứng ngay sau (b) → loại B. Đoạn không thể mở bằng “However” (a) → loại C.",
w:[["ubiquitous","có mặt ở khắp nơi"],["unprecedented","chưa từng có"],["prolonged exposure to","tiếp xúc lâu dài với"],["digital literacy","năng lực số"]]}
];

const ADV_NEW = [
{ty:"c",ti:"Line graph – Internet users in three countries",ok:"dbeac",
seq:[["The line graph compares the percentage of the population using the Internet in Vietnam, Thailand and Indonesia between 2005 and 2020.","Biểu đồ đường so sánh tỷ lệ dân số sử dụng Internet ở Việt Nam, Thái Lan và Indonesia từ năm 2005 đến năm 2020.","Giới thiệu biểu đồ"],
["Overall, all three countries witnessed an upward trend, with Vietnam recording the most dramatic growth.","Nhìn chung, cả ba nước đều có xu hướng tăng, trong đó Việt Nam tăng mạnh nhất.","Tổng quan"],
["Starting at just 13% in 2005, the figure for Vietnam climbed steadily to reach 70% by the end of the period.","Khởi đầu chỉ ở mức 13% năm 2005, con số của Việt Nam tăng đều và đạt 70% vào cuối giai đoạn.","Chi tiết 1: Việt Nam"],
["Thailand followed a similar trajectory, although its growth was slightly less rapid, rising from 15% to 65%.","Thái Lan có quỹ đạo tương tự, dù tốc độ tăng chậm hơn một chút, từ 15% lên 65%.","Chi tiết 2: Thái Lan"],
["Indonesia, by contrast, lagged behind its neighbours throughout, with only half of its population online in 2020.","Ngược lại, Indonesia tụt lại phía sau các nước láng giềng suốt giai đoạn, chỉ một nửa dân số dùng Internet vào năm 2020.","Chi tiết 3: Indonesia (đối lập)"]],
L:["“Overall” mở phần tổng quan ngay sau câu giới thiệu.","Tổng quan nhắc “Vietnam recording the most dramatic growth” → chi tiết bắt đầu bằng Việt Nam.","“a similar trajectory” (quỹ đạo tương tự) chỉ đường tăng của Việt Nam vừa mô tả.","“by contrast… its neighbours” – Indonesia đối lập với hai nước đã nêu → câu cuối."],
t:"“a similar trajectory” và “by contrast” đều là tín hiệu ngầm: phải có đối tượng được mô tả trước. Câu giới thiệu (compares…) luôn đứng đầu, “Overall” đứng thứ hai.",
w:[["witness an upward trend","chứng kiến xu hướng tăng"],["follow a similar trajectory","đi theo quỹ đạo tương tự"],["lag behind","tụt lại phía sau"],["by the end of the period","vào cuối giai đoạn"]]},

{ty:"p",ti:"Remote work",ok:"cadbe",
seq:[["The shift to remote work, accelerated by the pandemic, has redefined what many people consider a normal working day.","Sự chuyển dịch sang làm việc từ xa, được đẩy nhanh bởi đại dịch, đã định nghĩa lại điều mà nhiều người coi là một ngày làm việc bình thường.","Câu chủ đề"],
["For employees, this arrangement eliminates long commutes and offers greater control over their schedules.","Với người lao động, hình thức này loại bỏ những chuyến đi làm xa và cho họ quyền chủ động hơn với lịch trình.","Lợi ích"],
["Such flexibility, however, can blur the line between professional and personal life.","Tuy nhiên, sự linh hoạt như vậy có thể làm mờ ranh giới giữa công việc và đời tư.","Bước ngoặt"],
["Without a clear boundary, many remote workers find themselves answering emails late at night and struggling to switch off.","Không có ranh giới rõ ràng, nhiều người làm việc từ xa thấy mình trả lời email đến khuya và khó lòng nghỉ ngơi.","Hệ quả cụ thể"],
["The challenge for the future, therefore, is not whether to work from home but how to do so sustainably.","Vì vậy, thách thức trong tương lai không phải là có nên làm việc tại nhà hay không mà là làm thế nào cho bền vững.","Kết luận"]],
L:["“this arrangement” thay cho “remote work” ở câu chủ đề.","“Such flexibility” là từ khái quát cho “greater control over their schedules”.","“Without a clear boundary” lặp lại ý “blur the line” (ranh giới) bằng từ đồng nghĩa line ↔ boundary.","“therefore” rút ra kết luận từ cả hai mặt."],
t:"Không có Firstly/Finally – hãy dò chuỗi thay thế: remote work → this arrangement → Such flexibility; line ↔ boundary. Câu có “therefore… The challenge for the future” đứng cuối.",
w:[["accelerate","đẩy nhanh"],["eliminate long commutes","loại bỏ việc đi lại xa"],["blur the line between","làm mờ ranh giới giữa"],["switch off","thả lỏng, ngắt kết nối khỏi công việc"]]},

{ty:"c",ti:"Bar chart – teenagers' leisure time",ok:"cbdae",
seq:[["The bar chart illustrates the average number of hours teenagers in a European country spent on four leisure activities per week in 2015 and 2025.","Biểu đồ cột thể hiện số giờ trung bình mỗi tuần thanh thiếu niên ở một nước châu Âu dành cho bốn hoạt động giải trí vào năm 2015 và 2025.","Giới thiệu biểu đồ"],
["It is clear that screen-based activities gained popularity at the expense of more traditional pastimes.","Rõ ràng là các hoạt động trên màn hình trở nên phổ biến hơn, đánh đổi bằng các thú tiêu khiển truyền thống.","Tổng quan"],
["Time devoted to social media nearly doubled, jumping from 8 to 15 hours.","Thời gian dành cho mạng xã hội tăng gần gấp đôi, từ 8 lên 15 giờ.","Chi tiết: hoạt động tăng"],
["Meanwhile, reading for pleasure fell from 6 hours to just 3, a decline of half.","Trong khi đó, đọc sách giải trí giảm từ 6 giờ xuống chỉ còn 3, tức giảm một nửa.","Chi tiết: hoạt động giảm"],
["Sports participation also dropped, though less sharply, whereas time spent on video games remained unchanged at around 7 hours.","Việc chơi thể thao cũng giảm, dù ít hơn, trong khi thời gian chơi điện tử không đổi ở mức khoảng 7 giờ.","Chi tiết: các hoạt động còn lại"]],
L:["“It is clear that…” là câu tổng quan sau câu giới thiệu.","Tổng quan nêu “screen-based activities gained popularity” → chi tiết đầu tiên là mạng xã hội tăng.","“Meanwhile” chuyển sang phía ngược lại: hoạt động truyền thống (đọc sách) giảm.","“also dropped” tiếp nối xu hướng giảm của (d), rồi “whereas” nhắc hoạt động không đổi."],
t:"Câu tổng quan thường có “It is clear that / Overall”. “also dropped” cần một câu nói về sự sụt giảm đứng trước nó.",
w:[["at the expense of","đánh đổi bằng, gây thiệt hại cho"],["pastime","thú tiêu khiển"],["nearly double","tăng gần gấp đôi"],["remain unchanged","không thay đổi"]]},

{ty:"p",ti:"The decline of reading",ok:"edcab",
seq:[["Fewer young people today read books for pleasure than at any time in recent decades.","Ngày nay, số người trẻ đọc sách để giải trí ít hơn bất kỳ thời điểm nào trong vài thập kỷ gần đây.","Câu chủ đề: hiện tượng"],
["Some blame this on the rise of short-form video, which trains the brain to expect constant stimulation.","Một số người đổ lỗi cho sự bùng nổ video ngắn, thứ khiến não bộ quen với việc đòi hỏi kích thích liên tục.","Quan điểm 1"],
["Others argue that reading has not disappeared but merely changed form, moving from printed pages to screens.","Những người khác cho rằng việc đọc không biến mất mà chỉ đổi hình thức, chuyển từ trang giấy sang màn hình.","Quan điểm 2"],
["Whichever view is correct, the ability to concentrate on a long text remains essential for academic success.","Dù quan điểm nào đúng, khả năng tập trung vào một văn bản dài vẫn thiết yếu cho thành công trong học tập.","Nhượng bộ – khẳng định"],
["Schools, therefore, have a vital role to play in helping students rediscover the pleasure of sustained reading.","Vì vậy, nhà trường đóng vai trò quan trọng trong việc giúp học sinh tìm lại niềm vui đọc sâu, đọc dài.","Kết luận"]],
L:["“Some blame this on…” – “this” chỉ hiện tượng ít người trẻ đọc sách.","Cặp “Some … Others …” – quan điểm thứ hai đi sau quan điểm thứ nhất.","“Whichever view is correct” tổng hợp hai quan điểm vừa nêu.","“therefore” – kết luận về vai trò của nhà trường."],
t:"Cặp “Some… / Others…” và cụm “Whichever view” là mạch ngầm điển hình của đoạn nghị luận. Câu mở là câu nêu hiện tượng không chứa đại từ thay thế.",
w:[["read for pleasure","đọc sách giải trí"],["short-form video","video ngắn"],["constant stimulation","sự kích thích liên tục"],["sustained reading","đọc bền bỉ, đọc sâu"]]},

{ty:"c",ti:"Pie charts – household energy use",ok:"eacbd",
seq:[["The two pie charts show how energy was used in an average Australian household in 1990 and 2020.","Hai biểu đồ tròn cho thấy cách sử dụng năng lượng trong một hộ gia đình Úc trung bình vào năm 1990 và 2020.","Giới thiệu biểu đồ"],
["In both years, heating accounted for the largest share of consumption, although its proportion shrank from 45% to 38%.","Trong cả hai năm, sưởi ấm chiếm tỷ lệ tiêu thụ lớn nhất, dù tỷ lệ này giảm từ 45% xuống 38%.","Chi tiết 1: hạng mục lớn nhất"],
["This decrease was largely offset by a rise in the energy consumed by electronic devices, which tripled from 5% to 15%.","Mức giảm này phần lớn được bù lại bởi lượng năng lượng thiết bị điện tử tiêu thụ tăng gấp ba, từ 5% lên 15%.","Chi tiết 2: hạng mục tăng"],
["Water heating and cooking, on the other hand, saw only marginal changes over the thirty-year period.","Mặt khác, đun nước nóng và nấu ăn chỉ thay đổi không đáng kể trong ba mươi năm.","Chi tiết 3: ổn định"],
["Taken together, the data reflect a shift in household priorities from basic needs towards technology.","Nhìn tổng thể, số liệu phản ánh sự thay đổi ưu tiên của các gia đình từ nhu cầu cơ bản sang công nghệ.","Nhận xét chung – kết"]],
L:["Sau câu giới thiệu là hạng mục lớn nhất “the largest share”.","“This decrease” thay cho “its proportion shrank from 45% to 38%”.","“on the other hand” chuyển từ các hạng mục biến động sang các hạng mục ổn định.","“Taken together” tổng hợp dữ liệu → kết luận."],
t:"“This decrease” (c) phải nằm ngay sau câu có số liệu giảm. “Taken together” = “Overall” – dấu hiệu câu tổng kết ở cuối.",
w:[["account for the largest share","chiếm tỷ lệ lớn nhất"],["be offset by","được bù lại bởi"],["marginal changes","thay đổi không đáng kể"],["taken together","nhìn tổng thể"]]},

{ty:"p",ti:"The urban heat island",ok:"bdaec",
seq:[["Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect.","Các thành phố thường nóng hơn vùng nông thôn xung quanh vài độ, một hiện tượng được gọi là hiệu ứng đảo nhiệt đô thị.","Câu chủ đề – định nghĩa"],
["The main cause lies in the materials that dominate urban landscapes: concrete and asphalt absorb heat during the day and release it slowly at night.","Nguyên nhân chính nằm ở vật liệu chiếm ưu thế trong cảnh quan đô thị: bê tông và nhựa đường hấp thụ nhiệt ban ngày và tỏa ra chậm vào ban đêm.","Nguyên nhân 1"],
["The lack of vegetation makes matters worse, since trees would otherwise cool the air through shade and evaporation.","Việc thiếu cây xanh làm vấn đề tệ hơn, vì nếu có, cây sẽ làm mát không khí nhờ bóng râm và sự bốc hơi.","Nguyên nhân 2"],
["The consequences of this extra heat range from higher electricity bills to increased risks of heatstroke among the elderly.","Hậu quả của lượng nhiệt dư thừa này trải dài từ hóa đơn điện cao hơn đến nguy cơ say nắng tăng ở người cao tuổi.","Hậu quả"],
["Planting more trees and installing green roofs are thus among the simplest yet most effective countermeasures.","Vì vậy, trồng thêm cây và lắp mái nhà xanh là một trong những biện pháp đối phó đơn giản mà hiệu quả nhất.","Giải pháp – kết"]],
L:["“The main cause” – sau khi gọi tên hiện tượng, tác giả giải thích nguyên nhân.","“makes matters worse” bổ sung nguyên nhân thứ hai, làm trầm trọng thêm nguyên nhân thứ nhất.","“this extra heat” tóm lại lượng nhiệt do bê tông và thiếu cây xanh gây ra → chuyển sang hậu quả.","“thus” – giải pháp “planting more trees” đáp lại trực tiếp nguyên nhân “lack of vegetation”."],
t:"Mô hình Hiện tượng → Nguyên nhân → Hậu quả → Giải pháp. “makes matters worse” (cụm bổ sung) không thể đứng ngay sau câu chủ đề.",
w:[["urban heat island effect","hiệu ứng đảo nhiệt đô thị"],["make matters worse","làm tình hình tệ hơn"],["heatstroke","say nắng, sốc nhiệt"],["countermeasure","biện pháp đối phó"]]},

{ty:"c",ti:"Table – international tourist arrivals",ok:"bdace",
seq:[["The table provides information about the number of international tourists visiting four Asian cities in 2019 and 2023.","Bảng số liệu cung cấp thông tin về số lượng khách du lịch quốc tế đến bốn thành phố châu Á vào năm 2019 và 2023.","Giới thiệu bảng"],
["Bangkok was the most visited destination in both years, welcoming over 22 million visitors in 2019.","Bangkok là điểm đến được ghé thăm nhiều nhất trong cả hai năm, đón hơn 22 triệu lượt khách năm 2019.","Chi tiết 1: dẫn đầu"],
["However, this figure fell to 17 million in 2023, reflecting the lingering effects of the pandemic.","Tuy nhiên, con số này giảm xuống 17 triệu năm 2023, phản ánh tác động kéo dài của đại dịch.","Chi tiết 2: biến động"],
["Singapore and Tokyo experienced a similar dip, whereas Hanoi bucked the trend with a modest increase from 7 to 8 million.","Singapore và Tokyo cũng sụt giảm tương tự, trong khi Hà Nội đi ngược xu hướng với mức tăng nhẹ từ 7 lên 8 triệu.","Chi tiết 3: so sánh"],
["Overall, while most cities had yet to recover fully, emerging destinations appeared more resilient.","Nhìn chung, trong khi phần lớn thành phố chưa phục hồi hoàn toàn, các điểm đến mới nổi tỏ ra bền bỉ hơn.","Tổng kết"]],
L:["Sau câu giới thiệu là thành phố dẫn đầu.","“this figure” thay cho “over 22 million visitors” của Bangkok.","“a similar dip” (sụt giảm tương tự) so sánh với mức giảm của Bangkok ở (a).","“Overall” tổng kết ở cuối đoạn."],
t:"“this figure” và “a similar dip” là chuỗi tham chiếu: 22 triệu → this figure fell → a similar dip. Không câu nào trong chuỗi này có thể đảo vị trí.",
w:[["the most visited destination","điểm đến được ghé thăm nhiều nhất"],["lingering effects","tác động kéo dài"],["buck the trend","đi ngược xu hướng"],["resilient","bền bỉ, có sức chống chịu"]]},

{ty:"p",ti:"Voluntourism",ok:"aecdb",
seq:[["Volunteering abroad has become increasingly popular among young people seeking meaningful travel experiences.","Đi tình nguyện ở nước ngoài ngày càng phổ biến với người trẻ tìm kiếm những chuyến đi ý nghĩa.","Câu chủ đề"],
["Critics, however, argue that short-term volunteers often lack the skills needed to make a genuine difference.","Tuy nhiên, những người phản đối cho rằng tình nguyện viên ngắn hạn thường thiếu kỹ năng cần thiết để tạo ra thay đổi thực sự.","Phản biện"],
["In some cases, their presence may even do more harm than good, for instance when children in orphanages form attachments to visitors who soon leave.","Trong một số trường hợp, sự có mặt của họ thậm chí có hại nhiều hơn lợi, chẳng hạn khi trẻ ở trại mồ côi gắn bó với những người khách sớm ra đi.","Mở rộng phản biện"],
["This does not mean that all such programmes should be abandoned.","Điều này không có nghĩa là mọi chương trình như vậy đều nên bị loại bỏ.","Nhượng bộ"],
["Rather, volunteers should choose organisations carefully and focus on projects that match their abilities.","Thay vào đó, tình nguyện viên nên chọn tổ chức cẩn thận và tập trung vào những dự án phù hợp với khả năng của mình.","Giải pháp – kết"]],
L:["“Critics, however” – phản biện xu hướng vừa nêu.","“their presence may even…” – “their” = short-term volunteers; “even” nâng mức độ phản biện.","“This does not mean” – nhượng bộ, tránh kết luận cực đoan sau hai câu phê phán.","“Rather” đưa ra hướng đi thay thế → kết."],
t:"“Rather” luôn đứng ngay sau một câu phủ định (“This does not mean…”). Cặp (d) → (b) là cặp cố định ở cuối đoạn.",
w:[["make a genuine difference","tạo ra thay đổi thực sự"],["do more harm than good","hại nhiều hơn lợi"],["form attachments to","gắn bó với"],["Rather, …","Thay vào đó, …"]]},

{ty:"c",ti:"Line graph – CO₂ emissions per person",ok:"cedab",
seq:[["The line graph depicts average carbon dioxide emissions per person in the UK, Sweden and Portugal over a forty-year period from 1970.","Biểu đồ đường mô tả lượng khí CO₂ phát thải trung bình trên đầu người ở Anh, Thụy Điển và Bồ Đào Nha trong bốn mươi năm kể từ 1970.","Giới thiệu biểu đồ"],
["In 1970, the UK had by far the highest emissions, at roughly 11 tonnes per person.","Năm 1970, Anh có lượng phát thải cao nhất với khoảng cách lớn, khoảng 11 tấn/người.","Điểm xuất phát: Anh"],
["This figure then declined gradually, falling to around 9 tonnes by 2010.","Con số này sau đó giảm dần, xuống khoảng 9 tấn vào năm 2010.","Xu hướng của Anh"],
["Sweden's emissions, which peaked at 10 tonnes in the mid-1970s, dropped even more significantly to just 5 tonnes.","Lượng phát thải của Thụy Điển, đạt đỉnh 10 tấn giữa thập niên 1970, giảm còn mạnh hơn, chỉ còn 5 tấn.","So sánh: Thụy Điển"],
["Portugal, in contrast, saw a steady rise from a much lower base, eventually reaching a level comparable to Sweden's.","Ngược lại, Bồ Đào Nha tăng đều từ mức nền thấp hơn nhiều, cuối cùng đạt mức tương đương Thụy Điển.","Đối lập: Bồ Đào Nha"]],
L:["Sau câu giới thiệu là mốc đầu 1970 với nước cao nhất.","“This figure then declined” – “This figure” = 11 tonnes của Anh; “then” cho biết diễn biến tiếp theo.","“even more significantly” so sánh với mức giảm của Anh vừa nêu.","“in contrast” + “comparable to Sweden's” – phải đứng sau câu nói về Thụy Điển."],
t:"Từ so sánh ngầm “even more significantly”, “in contrast”, “comparable to Sweden's” cho biết thứ tự Anh → Thụy Điển → Bồ Đào Nha.",
w:[["by far the highest","cao nhất với khoảng cách lớn"],["peak at","đạt đỉnh ở"],["from a much lower base","từ mức nền thấp hơn nhiều"],["comparable to","tương đương với"]]},

{ty:"p",ti:"Food waste",ok:"cebda",
seq:[["Roughly one-third of all food produced in the world is lost or wasted every year.","Mỗi năm, khoảng một phần ba lượng thực phẩm sản xuất trên thế giới bị thất thoát hoặc lãng phí.","Câu chủ đề – số liệu gây chú ý"],
["This staggering figure is not only an ethical problem in a world where millions go hungry but also an environmental one.","Con số gây sốc này không chỉ là vấn đề đạo đức trong một thế giới có hàng triệu người đói mà còn là vấn đề môi trường.","Hai khía cạnh"],
["When discarded food decomposes in landfills, it releases methane, a greenhouse gas far more potent than carbon dioxide.","Khi thực phẩm bị vứt bỏ phân hủy ở bãi rác, nó thải ra khí metan, loại khí nhà kính mạnh hơn CO₂ rất nhiều.","Giải thích khía cạnh môi trường"],
["Tackling the issue requires action at every stage, from farms and supermarkets to individual households.","Giải quyết vấn đề đòi hỏi hành động ở mọi khâu, từ trang trại, siêu thị đến từng hộ gia đình.","Giải pháp chung"],
["Simple habits such as planning meals and storing leftovers properly can make a surprising difference.","Những thói quen đơn giản như lên kế hoạch bữa ăn và bảo quản đồ ăn thừa đúng cách có thể tạo khác biệt đáng ngạc nhiên.","Giải pháp cụ thể – kết"]],
L:["“This staggering figure” thay cho “one-third of all food”.","(b) nêu “an environmental one” → (e) giải thích vì sao lãng phí thực phẩm hại môi trường.","Sau khi phân tích vấn đề, (d) chuyển sang giải pháp “Tackling the issue”.","Từ giải pháp chung (mọi khâu, hộ gia đình) đến thói quen cụ thể của từng người."],
t:"Đi từ chung đến riêng ở phần giải pháp: “every stage… households” → “simple habits”. “This staggering figure” không thể đứng đầu.",
w:[["staggering","gây sốc, đáng kinh ngạc"],["decompose","phân hủy"],["a potent greenhouse gas","khí nhà kính mạnh"],["leftovers","đồ ăn thừa"]]},

{ty:"c",ti:"Bar chart – commuting by age group",ok:"aedcb",
seq:[["The bar chart compares the means of transport used by commuters of three age groups in Hanoi in 2024.","Biểu đồ cột so sánh phương tiện đi lại của người đi làm thuộc ba nhóm tuổi ở Hà Nội năm 2024.","Giới thiệu biểu đồ"],
["Motorbikes were the dominant choice across all age groups, but especially among those aged 18–30, at 75%.","Xe máy là lựa chọn chủ đạo ở mọi nhóm tuổi, đặc biệt ở nhóm 18–30 tuổi với 75%.","Đặc điểm nổi bật nhất"],
["This proportion was noticeably lower for the over-50s, many of whom preferred travelling by bus.","Tỷ lệ này thấp hơn rõ rệt ở nhóm trên 50 tuổi, nhiều người trong số họ thích đi xe buýt.","So sánh nhóm tuổi"],
["Indeed, the bus was used by 30% of older commuters, three times the figure for the youngest group.","Thật vậy, 30% người lớn tuổi đi xe buýt, gấp ba lần nhóm trẻ nhất.","Số liệu khẳng định"],
["Cars and bicycles played only a minor role, together making up less than 15% of journeys in each category.","Ô tô và xe đạp chỉ đóng vai trò nhỏ, cộng lại chưa đến 15% số chuyến đi ở mỗi nhóm.","Các phương tiện còn lại"]],
L:["Sau câu giới thiệu là phương tiện chiếm ưu thế “the dominant choice”.","“This proportion” = 75%; “the over-50s” đối lập với nhóm 18–30.","“Indeed” dùng số liệu để khẳng định ý “preferred travelling by bus”.","Cuối cùng là các phương tiện “minor role” – ít quan trọng nhất."],
t:"“Indeed” (thật vậy) luôn khẳng định câu ngay trước nó: câu (c) nói về xe buýt phải đứng sau câu nhắc “by bus”.",
w:[["means of transport","phương tiện đi lại"],["the dominant choice","lựa chọn chủ đạo"],["the over-50s","những người trên 50 tuổi"],["play a minor role","đóng vai trò nhỏ"]]},

{ty:"p",ti:"The gig economy",ok:"debac",
seq:[["Ride-hailing and food delivery apps have created millions of jobs for workers seeking flexible income.","Các ứng dụng gọi xe và giao đồ ăn đã tạo ra hàng triệu việc làm cho người lao động muốn có thu nhập linh hoạt.","Câu chủ đề"],
["The appeal of these jobs lies in their freedom: drivers can log in and out whenever they choose.","Sức hấp dẫn của những công việc này nằm ở sự tự do: tài xế có thể bật hay tắt ứng dụng bất cứ khi nào họ muốn.","Ưu điểm"],
["Yet this freedom comes at a price, as gig workers are usually classified as independent contractors rather than employees.","Nhưng sự tự do này phải trả giá, vì lao động tự do thường được xếp vào nhóm nhà thầu độc lập thay vì nhân viên.","Bước ngoặt"],
["As a result, they are rarely entitled to sick pay, health insurance or pensions.","Do đó, họ hiếm khi được hưởng lương nghỉ ốm, bảo hiểm y tế hay lương hưu.","Hệ quả"],
["Many governments are now debating whether new laws are needed to protect this growing workforce.","Nhiều chính phủ hiện đang tranh luận liệu có cần luật mới để bảo vệ lực lượng lao động ngày càng đông này.","Kết: hướng giải quyết"]],
L:["“these jobs” thay cho “millions of jobs” ở câu chủ đề.","“this freedom” lặp lại “their freedom” – xoay ý từ ưu điểm sang cái giá phải trả.","“As a result” – không phải nhân viên chính thức nên không có phúc lợi.","“this growing workforce” = gig workers → kết đoạn bằng phản ứng của chính phủ."],
t:"Từ khóa “freedom” xuất hiện ở hai câu liền nhau: “their freedom” → “this freedom”. “As a result” (a) phải đứng sau nguyên nhân ở (b).",
w:[["ride-hailing apps","ứng dụng gọi xe"],["come at a price","phải trả giá"],["independent contractor","nhà thầu độc lập (lao động tự do)"],["be entitled to","được hưởng (quyền lợi)"]]},

{ty:"c",ti:"Line graph – rice exports",ok:"becda",
seq:[["The line graph illustrates the volume of rice exported by Vietnam, Thailand and India between 2010 and 2024.","Biểu đồ đường thể hiện sản lượng gạo xuất khẩu của Việt Nam, Thái Lan và Ấn Độ giai đoạn 2010–2024.","Giới thiệu biểu đồ"],
["At the beginning of the period, Thailand was the leading exporter, shipping around 10 million tonnes.","Đầu giai đoạn, Thái Lan là nước xuất khẩu hàng đầu với khoảng 10 triệu tấn.","Mốc đầu: Thái Lan"],
["Its position, however, was soon overtaken by India, whose exports soared after 2012 and exceeded 20 million tonnes by 2022.","Tuy nhiên, vị trí đó sớm bị Ấn Độ vượt qua; xuất khẩu của Ấn Độ tăng vọt sau 2012 và vượt 20 triệu tấn vào năm 2022.","Diễn biến: Ấn Độ vượt lên"],
["Vietnam's figures, meanwhile, fluctuated between 6 and 8 million tonnes for most of the period.","Trong khi đó, số liệu của Việt Nam dao động từ 6 đến 8 triệu tấn trong phần lớn giai đoạn.","Việt Nam: dao động"],
["In the final two years, the country's exports rose sharply, partly as a result of export restrictions imposed by India.","Trong hai năm cuối, xuất khẩu của nước này tăng mạnh, một phần do Ấn Độ áp đặt hạn chế xuất khẩu.","Việt Nam: giai đoạn cuối"]],
