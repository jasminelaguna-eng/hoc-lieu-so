L:["Mốc “At the beginning of the period” đứng ngay sau câu giới thiệu.","“Its position” = vị trí dẫn đầu của Thái Lan; “however… overtaken” – bị vượt qua.","“meanwhile” chuyển sang nước thứ ba – Việt Nam.","“the country's exports” = Việt Nam; “In the final two years” là mốc cuối cùng."],
t:"“the country” ở (a) chỉ có thể là Việt Nam khi đứng ngay sau câu nói về Việt Nam (d). Trình tự thời gian: beginning → soon → most of the period → final two years.",
w:[["the leading exporter","nước xuất khẩu hàng đầu"],["be overtaken by","bị vượt qua bởi"],["fluctuate between","dao động trong khoảng"],["export restrictions","hạn chế xuất khẩu"]]},

{ty:"p",ti:"Learning English early",ok:"baedc",
seq:[["Many parents in Vietnam now send their children to English classes before they can even read in their mother tongue.","Nhiều phụ huynh Việt Nam hiện cho con học tiếng Anh trước cả khi trẻ biết đọc tiếng mẹ đẻ.","Câu chủ đề – hiện tượng"],
["They believe that the earlier a child begins, the more likely he or she is to achieve native-like fluency.","Họ tin rằng trẻ bắt đầu càng sớm thì càng có khả năng nói lưu loát như người bản ngữ.","Niềm tin của phụ huynh"],
["Research, however, paints a more complicated picture.","Tuy nhiên, các nghiên cứu lại cho thấy một bức tranh phức tạp hơn.","Bước ngoặt (câu ngắn)"],
["While young learners do tend to develop better pronunciation, older learners often progress faster in grammar and vocabulary.","Trong khi người học nhỏ tuổi quả thực có xu hướng phát âm tốt hơn, người học lớn tuổi thường tiến bộ nhanh hơn về ngữ pháp và từ vựng.","Chi tiết nghiên cứu"],
["What appears to matter most, then, is not the starting age but the quality and consistency of exposure.","Vậy điều quan trọng nhất dường như không phải là tuổi bắt đầu mà là chất lượng và sự đều đặn của việc tiếp xúc ngôn ngữ.","Kết luận"]],
L:["“They believe” – “They” = many parents.","“Research, however” đối lập với niềm tin của phụ huynh.","(d) giải thích “a more complicated picture”: mỗi độ tuổi có ưu thế riêng.","“then” = vậy thì – rút ra kết luận từ nghiên cứu."],
t:"Câu ngắn “Research, however, paints a more complicated picture” là câu bản lề: trước nó là niềm tin, sau nó là bằng chứng. “then” trong câu kết = “therefore”.",
w:[["mother tongue","tiếng mẹ đẻ"],["native-like fluency","sự lưu loát như người bản ngữ"],["paint a complicated picture","cho thấy bức tranh phức tạp"],["exposure (to a language)","sự tiếp xúc (với ngôn ngữ)"]]},

{ty:"c",ti:"Pie chart – choosing a university",ok:"cabed",
seq:[["The pie chart shows the main factors influencing high school graduates' choice of university in a national survey conducted in 2025.","Biểu đồ tròn thể hiện các yếu tố chính ảnh hưởng đến việc chọn trường đại học của học sinh tốt nghiệp THPT trong một khảo sát toàn quốc năm 2025.","Giới thiệu biểu đồ"],
["Employment prospects after graduation were the most decisive factor, cited by 34% of students.","Triển vọng việc làm sau khi tốt nghiệp là yếu tố quyết định nhất, được 34% học sinh lựa chọn.","Yếu tố lớn nhất"],
["Tuition fees came a close second, at 28%, highlighting the financial pressure on many families.","Học phí xếp thứ hai sát nút với 28%, cho thấy áp lực tài chính lên nhiều gia đình.","Yếu tố thứ hai"],
["The remaining responses were divided between the university's reputation, its location and the influence of family members.","Các câu trả lời còn lại chia cho danh tiếng của trường, vị trí và ảnh hưởng của gia đình.","Nhóm còn lại"],
["Of these, family influence was the least significant, accounting for a mere 6%.","Trong số đó, ảnh hưởng gia đình ít quan trọng nhất, chỉ chiếm 6%.","Yếu tố nhỏ nhất – kết"]],
L:["Sau câu giới thiệu là yếu tố “most decisive”.","“came a close second” – vị trí thứ hai ngay sau yếu tố thứ nhất.","“The remaining responses” – gom các yếu tố còn lại sau khi đã nêu hai yếu tố lớn.","“Of these” = trong số ba yếu tố vừa liệt kê → nêu yếu tố nhỏ nhất."],
t:"“Of these” (trong số này) bắt buộc đứng ngay sau câu liệt kê. Thứ tự xếp hạng: most decisive → a close second → the remaining → the least significant.",
w:[["employment prospects","triển vọng việc làm"],["come a close second","xếp thứ hai sát nút"],["tuition fees","học phí"],["a mere 6%","chỉ vỏn vẹn 6%"]]},

{ty:"p",ti:"Microplastics",ok:"eadcb",
seq:[["Microplastics – fragments smaller than five millimetres – have now been found in almost every environment on Earth.","Vi nhựa – những mảnh nhỏ hơn năm milimét – hiện đã được tìm thấy ở hầu hết mọi môi trường trên Trái Đất.","Câu chủ đề – định nghĩa"],
["They have been detected in deep ocean trenches, Arctic ice and even in the air we breathe.","Chúng được phát hiện ở rãnh đại dương sâu, băng Bắc Cực và thậm chí trong không khí ta hít thở.","Minh họa"],
["More worryingly, scientists have recently identified these particles in human blood and lung tissue.","Đáng lo hơn, các nhà khoa học gần đây đã phát hiện những hạt này trong máu và mô phổi người.","Leo thang mức độ"],
["Although the long-term health effects remain unclear, the findings have raised serious concerns.","Dù tác động lâu dài đến sức khỏe vẫn chưa rõ, những phát hiện này đã gây lo ngại nghiêm trọng.","Đánh giá"],
["Reducing our dependence on single-use plastics is therefore no longer merely an environmental issue but a matter of public health.","Vì vậy, giảm phụ thuộc vào nhựa dùng một lần không còn đơn thuần là vấn đề môi trường mà là vấn đề sức khỏe cộng đồng.","Kết luận"]],
L:["“They” thay cho “microplastics”; liệt kê các môi trường cụ thể.","“More worryingly” – leo thang từ môi trường sang cơ thể con người; “these particles” = microplastics.","“the findings” = việc phát hiện vi nhựa trong máu và phổi; “health effects” nối với “human blood”.","“therefore… a matter of public health” rút ra từ lo ngại sức khỏe."],
t:"Cấu trúc tăng tiến: môi trường → “even” không khí → “More worryingly” cơ thể người. Câu định nghĩa có dấu gạch ngang giải thích thuật ngữ luôn mở đoạn.",
w:[["fragment","mảnh vụn"],["be detected in","được phát hiện trong"],["more worryingly","đáng lo hơn"],["public health","sức khỏe cộng đồng"]]},

{ty:"c",ti:"Table – graduate starting salaries",ok:"ebadc",
seq:[["The table compares the average starting salaries of university graduates in five fields in 2020 and 2025.","Bảng so sánh mức lương khởi điểm trung bình của sinh viên tốt nghiệp ở năm lĩnh vực vào năm 2020 và 2025.","Giới thiệu bảng"],
["Information technology graduates earned the most in both years, with their starting pay rising from 12 to 16 million VND.","Sinh viên công nghệ thông tin có thu nhập cao nhất trong cả hai năm, lương khởi điểm tăng từ 12 lên 16 triệu đồng.","Chi tiết 1: cao nhất"],
["A comparable increase was seen in engineering, which remained in second place throughout.","Mức tăng tương đương được ghi nhận ở ngành kỹ thuật, ngành giữ vị trí thứ hai suốt giai đoạn.","Chi tiết 2: tương tự"],
["By contrast, salaries in education and the arts showed little improvement, staying at around 7 million VND.","Ngược lại, lương ngành giáo dục và nghệ thuật hầu như không cải thiện, ở mức khoảng 7 triệu đồng.","Chi tiết 3: đối lập"],
["The figures therefore point to a widening income gap between technology-related and non-technology fields.","Vì vậy, số liệu cho thấy khoảng cách thu nhập ngày càng nới rộng giữa các ngành liên quan đến công nghệ và các ngành khác.","Kết luận"]],
L:["Sau câu giới thiệu là ngành có lương cao nhất.","“A comparable increase” so sánh với mức tăng 12 → 16 triệu của ngành CNTT.","“By contrast” – hai ngành gần như không tăng, đối lập với hai ngành công nghệ.","“therefore… a widening income gap” – tổng hợp sự đối lập → kết."],
t:"“A comparable increase” và “By contrast” đều cần mốc so sánh đứng trước. Câu kết có “therefore” và từ khái quát “The figures”.",
w:[["starting salary","lương khởi điểm"],["a comparable increase","mức tăng tương đương"],["show little improvement","hầu như không cải thiện"],["a widening income gap","khoảng cách thu nhập ngày càng lớn"]]},

{ty:"p",ti:"An ageing population",ok:"cbdea",
seq:[["Vietnam is ageing faster than almost any other country in the region.","Việt Nam đang già hóa nhanh hơn gần như mọi quốc gia khác trong khu vực.","Câu chủ đề"],
["The proportion of people over 60 is expected to double within the next two decades.","Tỷ lệ người trên 60 tuổi dự kiến sẽ tăng gấp đôi trong hai thập kỷ tới.","Số liệu minh chứng"],
["Such a rapid demographic shift will put enormous pressure on the healthcare and pension systems.","Một sự chuyển dịch dân số nhanh như vậy sẽ gây áp lực khổng lồ lên hệ thống y tế và lương hưu.","Hệ quả 1"],
["At the same time, a shrinking workforce may slow economic growth unless productivity rises.","Đồng thời, lực lượng lao động thu hẹp có thể làm chậm tăng trưởng kinh tế nếu năng suất không tăng.","Hệ quả 2"],
["Preparing for this future demands policies that encourage healthy ageing and allow older people to remain active in society.","Chuẩn bị cho tương lai này đòi hỏi những chính sách khuyến khích già hóa khỏe mạnh và giúp người cao tuổi tiếp tục năng động trong xã hội.","Giải pháp – kết"]],
L:["(b) đưa số liệu chứng minh cho “ageing faster”.","“Such a rapid demographic shift” = từ khái quát cho việc tỷ lệ người già tăng gấp đôi.","“At the same time” – bổ sung hệ quả thứ hai song song.","“this future” tóm lại viễn cảnh vừa mô tả → giải pháp."],
t:"Cụm “Such a + danh từ khái quát” (Such a rapid demographic shift) luôn đứng sau câu chứa số liệu/sự kiện cụ thể mà nó tóm lại.",
w:[["an ageing population","dân số già hóa"],["demographic shift","sự chuyển dịch nhân khẩu học"],["pension system","hệ thống lương hưu"],["a shrinking workforce","lực lượng lao động thu hẹp"]]},

{ty:"c",ti:"Line graph – life expectancy",ok:"dceab",
seq:[["The graph shows changes in average life expectancy in Japan, Brazil and Nigeria from 1960 to 2020.","Biểu đồ thể hiện sự thay đổi tuổi thọ trung bình ở Nhật Bản, Brazil và Nigeria từ năm 1960 đến 2020.","Giới thiệu biểu đồ"],
["Japan consistently had the highest life expectancy, increasing from 68 to an impressive 84 years.","Nhật Bản luôn có tuổi thọ cao nhất, tăng từ 68 lên con số ấn tượng 84 tuổi.","Chi tiết 1: cao nhất"],
["Brazil started from a lower point of 54 years but narrowed the gap considerably over the following decades.","Brazil xuất phát từ mức thấp hơn là 54 tuổi nhưng đã thu hẹp khoảng cách đáng kể trong những thập kỷ sau đó.","Chi tiết 2: thu hẹp khoảng cách"],
["Nigeria's figure, though it also improved, remained the lowest, at just 55 years in 2020.","Con số của Nigeria, dù cũng cải thiện, vẫn thấp nhất, chỉ 55 tuổi vào năm 2020.","Chi tiết 3: thấp nhất"],
["In general, the disparity between developed and developing nations decreased, yet did not disappear.","Nhìn chung, chênh lệch giữa các nước phát triển và đang phát triển đã giảm nhưng chưa biến mất.","Tổng kết"]],
L:["Sau câu giới thiệu là nước có tuổi thọ cao nhất.","“a lower point… narrowed the gap” – “the gap” là khoảng cách với Nhật Bản.","“also improved… remained the lowest” – so sánh với hai nước trước.","“In general” tổng kết ở cuối."],
t:"Thứ tự cao nhất → trung bình → thấp nhất. “narrowed the gap” và “also improved” là tín hiệu ngầm cho thấy đã có mốc so sánh phía trước.",
w:[["life expectancy","tuổi thọ trung bình"],["narrow the gap","thu hẹp khoảng cách"],["disparity","sự chênh lệch"],["consistently","một cách nhất quán, luôn luôn"]]},

{ty:"p",ti:"Misinformation online",ok:"adecb",
seq:[["False information spreads on social media far more quickly than accurate news.","Thông tin sai lệch lan truyền trên mạng xã hội nhanh hơn nhiều so với tin tức chính xác.","Câu chủ đề"],
["One reason is that misleading stories are often designed to provoke strong emotions such as fear or anger.","Một lý do là những câu chuyện sai lệch thường được thiết kế để khơi gợi cảm xúc mạnh như sợ hãi hay giận dữ.","Nguyên nhân – mắt xích 1"],
["These emotions encourage users to share content instantly, without checking its source.","Những cảm xúc này thúc đẩy người dùng chia sẻ nội dung ngay lập tức mà không kiểm tra nguồn.","Mắt xích 2"],
["Platform algorithms then amplify such posts, since they generate high levels of engagement.","Thuật toán của nền tảng sau đó khuếch đại những bài đăng như vậy vì chúng tạo ra mức tương tác cao.","Mắt xích 3"],
["Breaking this cycle requires both better regulation of technology companies and stronger media literacy among users.","Phá vỡ vòng luẩn quẩn này đòi hỏi cả việc quản lý tốt hơn các công ty công nghệ lẫn năng lực truyền thông tốt hơn của người dùng.","Giải pháp – kết"]],
L:["“One reason” giải thích vì sao tin giả lan nhanh.","“These emotions” thay cho “fear or anger”.","“then… such posts” – bước tiếp theo trong chuỗi: bài được chia sẻ nhiều → thuật toán khuếch đại.","“this cycle” gói cả chuỗi cảm xúc → chia sẻ → khuếch đại → giải pháp."],
t:"Đây là đoạn văn dạng chuỗi nhân quả. Hãy lần theo: strong emotions → These emotions → such posts → this cycle. Mỗi từ thay thế chỉ có thể đứng sau danh từ gốc của nó.",
w:[["provoke strong emotions","khơi gợi cảm xúc mạnh"],["amplify","khuếch đại"],["engagement","sự tương tác"],["media literacy","năng lực truyền thông"]]},

{ty:"c",ti:"Bar chart – plastic waste treatment",ok:"adbec",
seq:[["The bar chart presents the proportion of plastic waste that was recycled, incinerated or sent to landfill in four countries in 2023.","Biểu đồ cột thể hiện tỷ lệ rác thải nhựa được tái chế, đốt hoặc chôn lấp ở bốn quốc gia năm 2023.","Giới thiệu biểu đồ"],
["Germany stood out as the most efficient, recycling almost two-thirds of its plastic waste.","Đức nổi bật là nước hiệu quả nhất, tái chế gần hai phần ba lượng rác nhựa.","Cực 1: Đức"],
["The remainder was mostly incinerated to generate energy, leaving only a tiny fraction for landfill.","Phần còn lại chủ yếu được đốt để tạo năng lượng, chỉ một phần rất nhỏ bị chôn lấp.","Bổ sung về Đức"],
["The opposite situation was found in Indonesia, where more than 70% of plastic waste ended up in landfills.","Tình huống ngược lại xảy ra ở Indonesia, nơi hơn 70% rác nhựa bị đưa đến bãi chôn lấp.","Cực 2: Indonesia"],
["The UK and South Korea fell between these two extremes, with recycling rates of around 45%.","Anh và Hàn Quốc nằm giữa hai thái cực này, với tỷ lệ tái chế khoảng 45%.","Nhóm ở giữa – kết"]],
L:["Sau câu giới thiệu là nước nổi bật nhất.","“The remainder” = một phần ba còn lại của Đức.","“The opposite situation” đối lập với Đức.","“these two extremes” = Đức và Indonesia → hai nước ở giữa."],
t:"“these two extremes” (hai thái cực) bắt buộc đứng sau khi cả hai thái cực đã được nêu. “The remainder” phải bám ngay câu có “two-thirds”.",
w:[["incinerate","thiêu, đốt"],["the remainder","phần còn lại"],["end up in landfills","cuối cùng bị chôn lấp"],["fall between two extremes","nằm giữa hai thái cực"]]},

{ty:"p",ti:"Taking a gap year",ok:"dcbea",
seq:[["Taking a gap year between secondary school and university is common in many Western countries but still rare in Vietnam.","Nghỉ một năm giữa THPT và đại học khá phổ biến ở nhiều nước phương Tây nhưng vẫn hiếm ở Việt Nam.","Câu chủ đề"],
["Supporters claim that a year of work or travel helps students mature and clarify their career goals.","Những người ủng hộ cho rằng một năm đi làm hoặc đi du lịch giúp học sinh trưởng thành và xác định rõ mục tiêu nghề nghiệp.","Quan điểm ủng hộ"],
["Those who return to study after such a break are often more motivated than their peers.","Những người quay lại học sau quãng nghỉ như vậy thường có động lực hơn bạn bè đồng trang lứa.","Bổ sung ủng hộ"],
["Opponents, on the other hand, worry that students may lose academic momentum or never return to education at all.","Mặt khác, những người phản đối lo rằng học sinh có thể mất đà học tập hoặc không bao giờ quay lại học nữa.","Quan điểm phản đối"],
["Ultimately, the value of a gap year depends less on the year itself than on how purposefully it is spent.","Rốt cuộc, giá trị của năm nghỉ phụ thuộc ít vào bản thân năm đó mà phụ thuộc nhiều vào việc nó được sử dụng có mục đích như thế nào.","Kết luận cân bằng"]],
L:["“Supporters claim” – quan điểm thứ nhất.","“such a break” thay cho “a year of work or travel”.","“Opponents, on the other hand” – cặp đối lập với “Supporters”.","“Ultimately” – kết luận dung hòa hai quan điểm."],
t:"Đoạn nghị luận hai chiều: Supporters → Opponents → Ultimately. Câu chứa “such a break” phải nằm trong phần ủng hộ, ngay sau câu “Supporters claim…” nhắc đến “a year of work or travel”.",
w:[["gap year","năm nghỉ giữa hai cấp học"],["clarify career goals","xác định rõ mục tiêu nghề nghiệp"],["lose academic momentum","mất đà học tập"],["purposefully","có mục đích"]]},

{ty:"c",ti:"Line graph – online shopping devices",ok:"cebad",
seq:[["The line graph compares the percentage of online purchases made via smartphones and via desktop computers in the US from 2012 to 2024.","Biểu đồ đường so sánh tỷ lệ giao dịch mua sắm trực tuyến qua điện thoại thông minh và qua máy tính để bàn ở Mỹ từ 2012 đến 2024.","Giới thiệu biểu đồ"],
["In 2012, desktops were overwhelmingly preferred, accounting for 85% of all online transactions.","Năm 2012, máy tính để bàn được ưa chuộng áp đảo, chiếm 85% tổng giao dịch trực tuyến.","Mốc đầu"],
["From then on, however, the share of mobile purchases grew rapidly, while the desktop figure declined at a similar pace.","Tuy nhiên, từ đó trở đi, tỷ lệ mua qua điện thoại tăng nhanh, trong khi con số của máy tính để bàn giảm với tốc độ tương tự.","Diễn biến"],
["The two lines crossed in 2018, when each method represented roughly half of the total.","Hai đường cắt nhau năm 2018, khi mỗi phương thức chiếm khoảng một nửa tổng số.","Điểm giao nhau"],
["By the end of the period, smartphones had become the dominant platform, with a share of 70%.","Đến cuối giai đoạn, điện thoại đã trở thành nền tảng chủ đạo với tỷ lệ 70%.","Mốc cuối"]],
L:["Mốc “In 2012” – thời điểm bắt đầu.","“From then on” = từ năm 2012 trở đi; “however” đảo chiều xu hướng.","Hai xu hướng ngược chiều dẫn tới “The two lines crossed” năm 2018.","“By the end of the period” – mốc cuối cùng."],
t:"Bài biểu đồ đường thường đi theo thời gian: 2012 → From then on → 2018 → By the end of the period. “From then on” cần một mốc thời gian đứng ngay trước nó.",
w:[["overwhelmingly preferred","được ưa chuộng áp đảo"],["at a similar pace","với tốc độ tương tự"],["the two lines crossed","hai đường cắt nhau"],["the dominant platform","nền tảng chủ đạo"]]}
];

ADV_NEW.push(
{ty:"p",ti:"Electric vehicles",ok:"bedac",
seq:[["Electric vehicles are widely promoted as a clean alternative to petrol and diesel cars.","Xe điện được quảng bá rộng rãi như một giải pháp sạch thay thế cho ô tô chạy xăng và dầu diesel.","Câu chủ đề"],
["Indeed, they produce no exhaust emissions, which helps to improve air quality in crowded cities.","Quả thực, chúng không thải khí từ ống xả, giúp cải thiện chất lượng không khí ở các thành phố đông đúc.","Khẳng định ưu điểm"],
["Their overall environmental benefit, however, depends heavily on how the electricity that powers them is generated.","Tuy nhiên, lợi ích môi trường tổng thể của chúng phụ thuộc nhiều vào cách sản xuất nguồn điện cung cấp cho chúng.","Bước ngoặt"],
["If that electricity comes mainly from coal, the reduction in total carbon emissions may be smaller than expected.","Nếu nguồn điện đó chủ yếu từ than, mức giảm tổng lượng khí thải carbon có thể nhỏ hơn mong đợi.","Giả định – chứng minh"],
["The transition to electric transport must therefore go hand in hand with the expansion of renewable energy.","Vì vậy, việc chuyển sang giao thông điện phải song hành với việc mở rộng năng lượng tái tạo.","Kết luận"]],
L:["“Indeed” khẳng định nhận định “a clean alternative”; “they” = electric vehicles.","“however” – đặt điều kiện cho lợi ích vừa khen ngợi.","“that electricity” chỉ “the electricity that powers them”.","“therefore” – kết luận gắn xe điện với năng lượng tái tạo."],
t:"“that electricity” là tham chiếu ngược: câu chứa nó phải đứng ngay sau câu nhắc “the electricity” lần đầu. “Indeed” luôn khẳng định câu ngay trước.",
w:[["a clean alternative to","giải pháp sạch thay thế cho"],["exhaust emissions","khí thải từ ống xả"],["depend heavily on","phụ thuộc nhiều vào"],["go hand in hand with","song hành với"]]},

{ty:"c",ti:"Table – fast food consumption by age",ok:"badec",
seq:[["The table shows how often people in different age groups in a Vietnamese city ate fast food in 2024.","Bảng cho thấy tần suất ăn đồ ăn nhanh của các nhóm tuổi ở một thành phố Việt Nam năm 2024.","Giới thiệu bảng"],
["Young people aged 15 to 24 were the most frequent consumers, with 40% eating fast food at least three times a week.","Người trẻ 15–24 tuổi ăn thường xuyên nhất, với 40% ăn đồ ăn nhanh ít nhất ba lần một tuần.","Nhóm 1: trẻ nhất"],
["This proportion fell steadily with age, dropping to 18% among those aged 25 to 44.","Tỷ lệ này giảm dần theo tuổi, xuống 18% ở nhóm 25–44 tuổi.","Nhóm 2"],
["Among people over 45, regular consumption was rare, as most of them reported eating fast food less than once a month.","Ở người trên 45 tuổi, việc ăn thường xuyên rất hiếm, đa số cho biết ăn đồ ăn nhanh chưa đến một lần mỗi tháng.","Nhóm 3: lớn tuổi nhất"],
["These figures suggest that fast food is closely associated with the lifestyle of younger generations.","Những số liệu này cho thấy đồ ăn nhanh gắn liền với lối sống của thế hệ trẻ.","Nhận xét – kết"]],
L:["Sau câu giới thiệu là nhóm ăn nhiều nhất.","“This proportion” = 40%; “fell steadily with age” chuyển sang nhóm lớn tuổi hơn.","Tiếp tục theo độ tuổi tăng dần: trên 45 tuổi.","“These figures suggest” – rút ra nhận xét."],
t:"Bảng số liệu theo nhóm tuổi: đi theo trật tự 15–24 → 25–44 → trên 45. “This proportion” không thể đứng trước câu có con số 40%.",
w:[["the most frequent consumers","những người tiêu dùng thường xuyên nhất"],["fall steadily with age","giảm dần theo độ tuổi"],["regular consumption","việc tiêu thụ thường xuyên"],["be closely associated with","gắn liền với"]]},

{ty:"p",ti:"Homework",ok:"ebcda",
seq:[["The amount of homework assigned to secondary school students has long been a subject of debate.","Lượng bài tập về nhà giao cho học sinh trung học từ lâu đã là chủ đề tranh luận.","Câu chủ đề"],
["Advocates maintain that regular homework reinforces classroom learning and builds self-discipline.","Những người ủng hộ khẳng định bài tập đều đặn giúp củng cố kiến thức trên lớp và rèn tính kỷ luật.","Quan điểm ủng hộ"],
["Too much of it, however, can leave students exhausted and deprive them of time for rest, hobbies and family.","Tuy nhiên, quá nhiều bài tập có thể khiến học sinh kiệt sức và lấy mất thời gian nghỉ ngơi, sở thích và gia đình.","Quan điểm phản đối"],
["This is particularly true in education systems where students also attend extra classes in the evening.","Điều này đặc biệt đúng ở những nền giáo dục mà học sinh còn đi học thêm buổi tối.","Nhấn mạnh"],
["A balanced approach, in which tasks are purposeful rather than merely time-consuming, may offer the best of both worlds.","Một cách tiếp cận cân bằng, trong đó bài tập có mục đích thay vì chỉ tốn thời gian, có thể dung hòa cả hai mặt.","Kết luận cân bằng"]],
L:["“Advocates maintain” – phía thứ nhất của cuộc tranh luận.","“Too much of it, however” – “it” = homework; đảo chiều sang phía phản đối.","“This is particularly true” – nhấn mạnh tình trạng kiệt sức vừa nêu.","“the best of both worlds” dung hòa hai quan điểm → kết."],
t:"“a subject of debate” báo hiệu đoạn sẽ trình bày hai phía. “the best of both worlds” chỉ có thể đứng cuối sau khi cả hai phía đã được nêu.",
w:[["a subject of debate","chủ đề tranh luận"],["reinforce classroom learning","củng cố kiến thức trên lớp"],["deprive sb of sth","lấy mất của ai cái gì"],["the best of both worlds","vẹn cả đôi đường"]]},

{ty:"c",ti:"Bar chart – women in the workforce",ok:"ecabd",
seq:[["The bar chart illustrates the percentage of women working in five occupational sectors in a country in 2000 and 2020.","Biểu đồ cột thể hiện tỷ lệ phụ nữ làm việc trong năm lĩnh vực nghề nghiệp ở một quốc gia vào năm 2000 và 2020.","Giới thiệu biểu đồ"],
["The most notable increase occurred in the management sector, where the proportion of women rose from 15% to 35%.","Mức tăng đáng chú ý nhất diễn ra ở lĩnh vực quản lý, nơi tỷ lệ phụ nữ tăng từ 15% lên 35%.","Chi tiết 1: tăng mạnh nhất"],
["Women also made significant gains in law and medicine, each of which approached gender parity by 2020.","Phụ nữ cũng có bước tiến đáng kể trong ngành luật và y, mỗi ngành đều gần đạt cân bằng giới vào năm 2020.","Chi tiết 2: tăng tiếp"],
["In nursing and primary education, however, women continued to make up the vast majority of employees.","Tuy nhiên, trong ngành điều dưỡng và giáo dục tiểu học, phụ nữ vẫn chiếm phần lớn nhân lực.","Chi tiết 3: không đổi"],
["This suggests that while barriers in traditionally male professions are falling, some jobs remain strongly associated with women.","Điều này cho thấy rằng trong khi rào cản ở các nghề truyền thống của nam giới đang giảm, một số nghề vẫn gắn chặt với phụ nữ.","Nhận xét – kết"]],
L:["Sau câu giới thiệu là thay đổi “most notable”.","“also made significant gains” – bổ sung các ngành tăng tiếp theo.","“however” – chuyển sang các ngành vẫn do phụ nữ chiếm đa số.","“This suggests” tổng hợp cả hai xu hướng → kết."],
t:"“also” và “however” giúp xếp chi tiết: tăng mạnh nhất → cũng tăng → tuy nhiên không đổi. Câu “This suggests…” đứng cuối.",
w:[["occupational sector","lĩnh vực nghề nghiệp"],["make significant gains","có bước tiến đáng kể"],["gender parity","cân bằng giới"],["the vast majority","phần lớn, đại đa số"]]},

{ty:"p",ti:"Coral bleaching",ok:"cdaeb",
seq:[["Coral reefs cover less than one per cent of the ocean floor, yet they support about a quarter of all marine species.","Rạn san hô chiếm chưa đến một phần trăm đáy đại dương, nhưng nuôi dưỡng khoảng một phần tư các loài sinh vật biển.","Câu chủ đề – tầm quan trọng"],
["These ecosystems are now under severe threat from rising sea temperatures.","Những hệ sinh thái này hiện đang bị đe dọa nghiêm trọng bởi nhiệt độ nước biển tăng.","Vấn đề"],
["When the water becomes too warm, corals expel the algae living inside them and turn completely white.","Khi nước quá nóng, san hô đẩy tảo sống bên trong ra ngoài và chuyển sang trắng hoàn toàn.","Mô tả quá trình"],
["This process, known as coral bleaching, does not kill the coral immediately, but it leaves it weak and vulnerable to disease.","Quá trình này, gọi là tẩy trắng san hô, không giết chết san hô ngay nhưng khiến nó yếu và dễ mắc bệnh.","Gọi tên quá trình"],
["If high temperatures persist, entire reefs may die, with devastating consequences for the fishing communities that depend on them.","Nếu nhiệt độ cao kéo dài, toàn bộ rạn san hô có thể chết, gây hậu quả tàn khốc cho các cộng đồng ngư dân phụ thuộc vào chúng.","Hậu quả – kết"]],
L:["“These ecosystems” thay cho “coral reefs”.","(a) giải thích cơ chế đe dọa: nước quá nóng → san hô thải tảo.","“This process, known as coral bleaching” – gọi tên quá trình vừa mô tả (quy nạp: mô tả trước, gọi tên sau).","“If high temperatures persist” – hậu quả lâu dài → kết."],
t:"Lối viết quy nạp: mô tả hiện tượng trước rồi mới gọi tên “This process, known as…”. Câu gọi tên không thể đứng trước câu mô tả.",
w:[["marine species","các loài sinh vật biển"],["under severe threat","bị đe dọa nghiêm trọng"],["coral bleaching","hiện tượng tẩy trắng san hô"],["vulnerable to disease","dễ mắc bệnh"]]},

{ty:"c",ti:"Pie charts – young people's news sources",ok:"daceb",
seq:[["The pie charts compare the main sources of news for people aged 18–25 in 2015 and 2025.","Các biểu đồ tròn so sánh nguồn tin tức chính của người 18–25 tuổi năm 2015 và 2025.","Giới thiệu biểu đồ"],
["In 2015, television was the most popular source, chosen by 40% of respondents.","Năm 2015, truyền hình là nguồn phổ biến nhất, được 40% người tham gia chọn.","Mốc 2015: dẫn đầu"],
["A decade later, its share had shrunk to only 15%, overtaken by social media platforms.","Mười năm sau, tỷ lệ của nó chỉ còn 15%, bị các nền tảng mạng xã hội vượt qua.","Mốc 2025: tụt hạng"],
["These platforms, which had accounted for just a quarter of responses in 2015, became the source for over half of young people in 2025.","Những nền tảng này, vốn chỉ chiếm một phần tư câu trả lời năm 2015, đã trở thành nguồn tin của hơn một nửa người trẻ năm 2025.","Mạng xã hội vươn lên"],
["Newspapers and radio, already minor sources at the start, declined further to a combined 10%.","Báo in và radio, vốn đã là nguồn tin nhỏ từ đầu, giảm tiếp xuống tổng cộng 10%.","Các nguồn còn lại – kết"]],
L:["Mốc 2015 với nguồn tin dẫn đầu.","“A decade later, its share” – “its” = television; mốc 2025.","“These platforms” thay cho “social media platforms”.","“already minor… declined further” – các nguồn nhỏ còn lại → kết."],
t:"Chuỗi tham chiếu: television → its share; social media platforms → These platforms. “A decade later” cần mốc 2015 đứng trước.",
w:[["respondent","người trả lời khảo sát"],["shrink to","giảm xuống còn"],["be overtaken by","bị vượt qua bởi"],["a combined 10%","tổng cộng 10%"]]},

{ty:"p",ti:"Handwriting vs typing",ok:"aebdc",
seq:[["As laptops and tablets become standard in classrooms, handwriting is gradually disappearing from students' daily lives.","Khi máy tính xách tay và máy tính bảng trở thành tiêu chuẩn trong lớp học, chữ viết tay dần biến mất khỏi đời sống hằng ngày của học sinh.","Câu chủ đề"],
["Typing is undoubtedly faster, allowing learners to record almost every word a teacher says.","Đánh máy chắc chắn nhanh hơn, cho phép người học ghi lại gần như mọi lời giáo viên nói.","Ưu điểm của đánh máy"],
["Paradoxically, it is precisely this speed that may reduce understanding.","Nghịch lý thay, chính tốc độ này lại có thể làm giảm sự hiểu bài.","Bước ngoặt (nghịch lý)"],
["Because handwriting is slower, students are forced to summarise and rephrase ideas, which deepens their processing of information.","Vì viết tay chậm hơn, học sinh buộc phải tóm tắt và diễn đạt lại ý, điều này giúp xử lý thông tin sâu hơn.","Giải thích"],
["For this reason, some educators recommend taking notes by hand, even in a digital age.","Vì lý do này, một số nhà giáo dục khuyên nên ghi chép bằng tay, ngay cả trong thời đại số.","Kết luận"]],
L:["(e) nêu ưu điểm của phương thức đang thay thế chữ viết tay.","“this speed” thay cho “faster”; “Paradoxically” – ưu điểm lại thành nhược điểm.","(d) giải thích nghịch lý: viết chậm buộc phải tóm tắt → hiểu sâu.","“For this reason” rút ra lời khuyên → kết."],
t:"Từ “Paradoxically” và cụm “this speed” cho biết câu đó phải đứng ngay sau câu nói về tốc độ (“faster”). “For this reason” đứng cuối.",
w:[["undoubtedly","chắc chắn, không nghi ngờ gì"],["paradoxically","nghịch lý thay"],["rephrase ideas","diễn đạt lại ý"],["take notes by hand","ghi chép bằng tay"]]},

{ty:"c",ti:"Line graph – museum visitors",ok:"bcaed",
seq:[["The line graph shows the number of visitors to three museums in Hanoi over a twelve-month period in 2024.","Biểu đồ đường cho thấy số lượt khách tham quan ba bảo tàng ở Hà Nội trong mười hai tháng năm 2024.","Giới thiệu biểu đồ"],
["The Museum of Ethnology attracted the largest number of visitors, with attendance peaking at 60,000 in July.","Bảo tàng Dân tộc học thu hút nhiều khách nhất, lượng khách đạt đỉnh 60.000 vào tháng Bảy.","Bảo tàng dẫn đầu"],
["Such a peak can be attributed to the summer holidays, when families with children are free to travel.","Đỉnh điểm như vậy có thể là do kỳ nghỉ hè, khi các gia đình có con nhỏ được tự do đi chơi.","Giải thích đỉnh"],
["The other two museums followed a different pattern, receiving the most visitors in February, around the Lunar New Year.","Hai bảo tàng còn lại theo một mô hình khác, đón nhiều khách nhất vào tháng Hai, quanh dịp Tết Nguyên đán.","Hai bảo tàng còn lại"],
["Throughout the year, however, neither of them managed to exceed 30,000 visitors in any single month.","Tuy nhiên, suốt cả năm, không bảo tàng nào trong hai bảo tàng này vượt quá 30.000 lượt khách trong bất kỳ tháng nào.","Bổ sung – kết"]],
L:["Sau câu giới thiệu là bảo tàng đông khách nhất.","“Such a peak” thay cho “peaking at 60,000 in July”.","“The other two museums… a different pattern” – đối chiếu với bảo tàng đầu tiên.","“neither of them” = hai bảo tàng còn lại → câu cuối."],
t:"“Such a peak” và “neither of them” là đại từ/từ thay thế ngầm: câu chứa chúng phải đứng sau danh từ gốc. “The other two” chỉ xuất hiện sau khi một bảo tàng đã được nêu.",
w:[["peak at","đạt đỉnh ở mức"],["be attributed to","được cho là do"],["follow a different pattern","theo một mô hình khác"],["neither of them","không ai/cái nào trong hai"]]},

{ty:"p",ti:"Overtourism",ok:"becad",
seq:[["Popular destinations such as Hoi An and Ha Long Bay welcome millions of visitors each year.","Những điểm đến nổi tiếng như Hội An và vịnh Hạ Long đón hàng triệu du khách mỗi năm.","Câu chủ đề"],
["Tourism brings significant economic benefits to these areas, creating jobs and supporting local businesses.","Du lịch mang lại lợi ích kinh tế đáng kể cho những khu vực này, tạo việc làm và hỗ trợ doanh nghiệp địa phương.","Lợi ích"],
["Excessive visitor numbers, however, can put a strain on infrastructure and damage the very attractions that draw tourists in the first place.","Tuy nhiên, lượng khách quá đông có thể gây quá tải hạ tầng và làm hư hại chính những thắng cảnh vốn thu hút du khách.","Bước ngoặt"],
["Local residents may also find that rising rents and crowded streets make their hometowns less liveable.","Người dân địa phương cũng có thể thấy giá thuê nhà tăng và đường phố đông đúc khiến quê hương kém đáng sống hơn.","Tác hại bổ sung"],
["To address these problems, some authorities have begun limiting daily visitor numbers and promoting less-visited sites.","Để giải quyết những vấn đề này, một số chính quyền đã bắt đầu giới hạn lượng khách mỗi ngày và quảng bá những điểm ít người đến.","Giải pháp – kết"]],
L:["“these areas” thay cho Hội An và vịnh Hạ Long.","“however” – đảo chiều từ lợi ích sang tác hại.","“also” bổ sung tác hại thứ hai: đối với người dân.","“these problems” gói lại các tác hại → giải pháp."],
t:"“Excessive visitor numbers” là từ đồng nghĩa ngầm với “millions of visitors” nhưng mang sắc thái tiêu cực – báo hiệu bước ngoặt sau phần lợi ích.",
w:[["put a strain on","gây áp lực, quá tải lên"],["in the first place","ngay từ đầu, vốn dĩ"],["liveable","đáng sống"],["less-visited sites","những điểm ít người ghé thăm"]]},

{ty:"c",ti:"Bar chart – water use by region",ok:"aecbd",
seq:[["The bar chart compares the proportion of water used for agriculture, industry and domestic purposes in three regions of the world.","Biểu đồ cột so sánh tỷ lệ nước dùng cho nông nghiệp, công nghiệp và sinh hoạt ở ba khu vực trên thế giới.","Giới thiệu biểu đồ"],
["Agriculture was the largest consumer in Asia and Africa, accounting for more than 80% of total usage in both.","Nông nghiệp là ngành dùng nhiều nước nhất ở châu Á và châu Phi, chiếm hơn 80% tổng lượng sử dụng ở cả hai.","Chi tiết 1"],
["In Europe, by contrast, industry consumed the greatest share of water, at just over half.","Ngược lại, ở châu Âu, công nghiệp tiêu thụ nhiều nước nhất, hơn một nửa một chút.","Chi tiết 2: đối lập"],
["Domestic use was relatively low in all three regions, although Europe's figure was noticeably higher than those of the other two.","Nước sinh hoạt chiếm tỷ lệ tương đối thấp ở cả ba khu vực, dù con số của châu Âu cao hơn rõ rệt so với hai khu vực còn lại.","Chi tiết 3"],
["These differences largely reflect the varying levels of industrialisation in each region.","Những khác biệt này phần lớn phản ánh mức độ công nghiệp hóa khác nhau ở mỗi khu vực.","Giải thích – kết"]],
L:["Sau câu giới thiệu là ngành dùng nhiều nhất ở hai khu vực.","“by contrast” – châu Âu khác với châu Á và châu Phi.","Sau hai ngành chính là mục thấp nhất: sinh hoạt; “the other two” = châu Á, châu Phi.","“These differences” gói lại các khác biệt → giải thích ở cuối."],
t:"“by contrast” cần đối tượng so sánh đứng trước. “These differences” chỉ có thể xuất hiện khi các khác biệt đã được trình bày đầy đủ.",
w:[["domestic purposes","mục đích sinh hoạt"],["the largest consumer","bên tiêu thụ nhiều nhất"],["noticeably higher","cao hơn rõ rệt"],["industrialisation","công nghiệp hóa"]]},

{ty:"p",ti:"AI chatbots in schools",ok:"cabde",
seq:[["AI chatbots can now produce well-organised essays within seconds, a development that has alarmed many teachers.","Chatbot AI giờ đây có thể viết những bài luận chặt chẽ chỉ trong vài giây, một bước phát triển khiến nhiều giáo viên lo ngại.","Câu chủ đề"],
["Their main fear is that students will submit machine-written work without engaging with the material themselves.","Nỗi lo chính của họ là học sinh sẽ nộp bài do máy viết mà không tự mình tìm hiểu tài liệu.","Giải thích nỗi lo"],
["Banning these tools outright, however, may prove both impractical and short-sighted.","Tuy nhiên, cấm hoàn toàn các công cụ này có thể vừa không khả thi vừa thiển cận.","Bước ngoặt"],
["After all, the ability to use AI effectively is likely to be a key skill in tomorrow's workplace.","Suy cho cùng, khả năng sử dụng AI hiệu quả nhiều khả năng sẽ là kỹ năng then chốt ở nơi làm việc tương lai.","Lý lẽ"],
["A more productive response would be to redesign assignments so that they reward critical thinking rather than mere text production.","Một phản ứng hiệu quả hơn là thiết kế lại bài tập để chúng khuyến khích tư duy phản biện thay vì chỉ tạo ra văn bản.","Đề xuất – kết"]],
L:["“Their main fear” – “Their” = many teachers; giải thích “alarmed”.","“Banning these tools, however” – phản bác giải pháp hiển nhiên mà nỗi lo dẫn tới.","“After all” – đưa lý lẽ ủng hộ nhận định “short-sighted”.","“A more productive response” – đề xuất thay thế cho việc cấm → kết."],
t:"“After all” (suy cho cùng) luôn đưa lý do cho câu ngay trước nó. “A more productive response” so sánh với giải pháp “banning” – phải đứng sau câu đó.",
w:[["alarm","làm lo ngại, báo động"],["engage with the material","tự tìm hiểu, tương tác với tài liệu"],["ban sth outright","cấm hoàn toàn"],["short-sighted","thiển cận"]]},

{ty:"c",ti:"Line graph – apartment prices",ok:"ceadb",
seq:[["The line graph shows the average price of an apartment per square metre in Hanoi and Ho Chi Minh City between 2015 and 2025.","Biểu đồ đường thể hiện giá căn hộ trung bình trên mỗi mét vuông ở Hà Nội và TP. Hồ Chí Minh từ 2015 đến 2025.","Giới thiệu biểu đồ"],
["Prices in both cities followed an upward trend, but the pace of growth differed considerably.","Giá ở cả hai thành phố đều có xu hướng tăng, nhưng tốc độ tăng khác nhau đáng kể.","Tổng quan"],
["In Ho Chi Minh City, the price rose steadily from 30 to 55 million VND per square metre.","Ở TP. Hồ Chí Minh, giá tăng đều từ 30 lên 55 triệu đồng/m².","Chi tiết 1"],
["Hanoi, which had started at a lower level, witnessed a more dramatic increase, especially after 2021.","Hà Nội, vốn xuất phát ở mức thấp hơn, chứng kiến mức tăng mạnh hơn, đặc biệt sau năm 2021.","Chi tiết 2: so sánh"],
["As a result, by 2025 apartments in the capital had become the more expensive of the two, at roughly 65 million VND.","Kết quả là đến năm 2025, căn hộ ở thủ đô đã trở thành nơi đắt hơn trong hai thành phố, khoảng 65 triệu đồng.","Kết quả – kết"]],
L:["Câu tổng quan nêu hai ý: cùng tăng nhưng tốc độ khác nhau.","Chi tiết đầu: thành phố tăng đều.","“a lower level… a more dramatic increase” – so sánh với TP.HCM vừa nêu.","“As a result… the capital” – “the capital” = Hà Nội → kết quả cuối."],
t:"Từ đồng nghĩa ngầm: Hanoi ↔ the capital. “a more dramatic increase” là so sánh hơn – cần một mức tăng khác đứng trước.",
w:[["per square metre","trên mỗi mét vuông"],["the pace of growth","tốc độ tăng trưởng"],["a more dramatic increase","mức tăng mạnh hơn"],["the more expensive of the two","cái đắt hơn trong hai"]]},

{ty:"p",ti:"Minimalism",ok:"edacb",
seq:[["In recent years, a growing number of young people have embraced minimalism, choosing to own fewer but better things.","Những năm gần đây, ngày càng nhiều người trẻ theo đuổi chủ nghĩa tối giản, chọn sở hữu ít đồ hơn nhưng tốt hơn.","Câu chủ đề"],
["This lifestyle is partly a reaction against consumer culture, which equates happiness with constant buying.","Lối sống này phần nào là phản ứng chống lại văn hóa tiêu dùng – thứ đánh đồng hạnh phúc với việc mua sắm liên tục.","Nguồn gốc"],
["Its followers claim that decluttering their homes has also helped to clear their minds.","Những người theo đuổi nó cho rằng việc dọn bớt đồ đạc trong nhà cũng giúp đầu óc thông thoáng hơn.","Lợi ích"],
["Critics, though, point out that minimalism is easier to practise for those who can afford to replace items whenever they need them.","Tuy vậy, những người phê phán chỉ ra rằng chủ nghĩa tối giản dễ thực hành hơn với những ai đủ tiền thay đồ bất cứ khi nào cần.","Phản biện"],
["In that sense, the movement may say as much about privilege as it does about simplicity.","Theo nghĩa đó, phong trào này có thể nói lên nhiều về đặc quyền chẳng kém gì về sự giản dị.","Kết luận"]],
L:["“This lifestyle” thay cho “minimalism”.","“Its followers” – “Its” = this lifestyle.","“Critics, though” đối lập với “Its followers”.","“In that sense” – từ lập luận của người phê phán rút ra kết luận về “privilege”."],
t:"Cặp đối lập ngầm: followers ↔ critics. Câu kết “In that sense…” phải đứng ngay sau ý về khả năng chi trả (afford), vì “privilege” = đặc quyền của người có tiền.",
w:[["embrace minimalism","theo đuổi chủ nghĩa tối giản"],["equate A with B","đánh đồng A với B"],["declutter","dọn bớt đồ đạc"],["privilege","đặc quyền"]]},

{ty:"c",ti:"Table – Vietnamese students abroad",ok:"edbca",
seq:[["The table gives information about the number of Vietnamese students studying in five foreign countries in 2015 and 2025.","Bảng cung cấp thông tin về số lượng du học sinh Việt Nam ở năm quốc gia vào năm 2015 và 2025.","Giới thiệu bảng"],
["Japan and Australia were the top destinations in 2015, each hosting around 20,000 students.","Nhật Bản và Úc là hai điểm đến hàng đầu năm 2015, mỗi nước có khoảng 20.000 sinh viên.","Mốc 2015"],
["Ten years later, however, South Korea had emerged as the most popular choice, with its numbers rising nearly fourfold.","Tuy nhiên, mười năm sau, Hàn Quốc đã trở thành lựa chọn phổ biến nhất, với số lượng tăng gần gấp bốn.","Mốc 2025: thay đổi lớn"],
["This growth was likely driven by generous scholarship schemes and the global popularity of Korean culture.","Sự tăng trưởng này có lẽ được thúc đẩy bởi các chương trình học bổng hào phóng và sự phổ biến toàn cầu của văn hóa Hàn Quốc.","Giải thích"],
["The United States and the UK, meanwhile, recorded only modest increases over the decade.","Trong khi đó, Mỹ và Anh chỉ ghi nhận mức tăng khiêm tốn trong thập kỷ.","Các nước còn lại – kết"]],
L:["Mốc 2015 với các điểm đến hàng đầu.","“Ten years later, however” – bước ngoặt ở mốc 2025.","“This growth” = số lượng sinh viên ở Hàn Quốc tăng gần gấp bốn.","“meanwhile” chuyển sang hai nước còn lại → câu cuối."],
t:"“This growth” phải đứng ngay sau câu có “rising nearly fourfold”. “Ten years later” cần mốc 2015 đứng trước.",
w:[["host students","tiếp nhận sinh viên"],["emerge as","nổi lên thành"],["nearly fourfold","gần gấp bốn lần"],["scholarship scheme","chương trình học bổng"]]},

{ty:"p",ti:"Saltwater intrusion in the Mekong Delta",ok:"dbcae",
seq:[["The Mekong Delta, often called Vietnam's rice bowl, is facing an increasingly serious threat from saltwater intrusion.","Đồng bằng sông Cửu Long, thường được gọi là vựa lúa của Việt Nam, đang đối mặt mối đe dọa ngày càng nghiêm trọng từ xâm nhập mặn.","Câu chủ đề"],
["During the dry season, seawater pushes further inland, contaminating rivers and canals used for irrigation.","Vào mùa khô, nước biển lấn sâu vào đất liền, làm nhiễm mặn sông và kênh rạch dùng để tưới tiêu.","Mô tả hiện tượng"],
["This problem has been aggravated by upstream dams, which reduce the flow of fresh water reaching the delta.","Vấn đề này càng trầm trọng do các đập thủy điện ở thượng nguồn làm giảm lượng nước ngọt chảy về đồng bằng.","Nguyên nhân làm trầm trọng"],
["Many farmers have responded by switching from rice to shrimp farming or salt-tolerant crops.","Nhiều nông dân đã ứng phó bằng cách chuyển từ trồng lúa sang nuôi tôm hoặc trồng cây chịu mặn.","Ứng phó"],
["Such adaptations, while promising, cannot fully replace long-term regional cooperation on water management.","Những cách thích ứng như vậy, dù đầy hứa hẹn, không thể thay thế hoàn toàn sự hợp tác dài hạn trong khu vực về quản lý nguồn nước.","Kết luận"]],
L:["(b) mô tả cụ thể “saltwater intrusion”.","“This problem” = nước biển lấn sâu, nhiễm mặn; “aggravated” – bị làm trầm trọng hơn.","“responded” – phản ứng của nông dân trước vấn đề.","“Such adaptations” = chuyển sang nuôi tôm, cây chịu mặn → kết."],
t:"Chuỗi: saltwater intrusion → This problem → responded → Such adaptations. Câu chứa “Such adaptations” luôn đứng sau câu mô tả cách thích ứng cụ thể.",
w:[["saltwater intrusion","xâm nhập mặn"],["be aggravated by","bị làm trầm trọng bởi"],["salt-tolerant crops","cây trồng chịu mặn"],["regional cooperation","hợp tác khu vực"]]},

{ty:"c",ti:"Bar chart – students' sleep",ok:"bdeca",
seq:[["The bar chart illustrates the average number of hours of sleep per night among students at five different grade levels.","Biểu đồ cột thể hiện số giờ ngủ trung bình mỗi đêm của học sinh ở năm khối lớp khác nhau.","Giới thiệu biểu đồ"],
["There was a clear downward trend as students moved up through school.","Có một xu hướng giảm rõ rệt khi học sinh lên lớp trên.","Tổng quan"],
["Grade 6 students slept the longest, averaging just over nine hours a night.","Học sinh lớp 6 ngủ nhiều nhất, trung bình hơn chín giờ mỗi đêm.","Chi tiết: điểm cao nhất"],
["By grade 12, this figure had dropped to less than six and a half hours, well below the recommended amount.","Đến lớp 12, con số này giảm xuống dưới sáu tiếng rưỡi, thấp hơn nhiều so với mức khuyến nghị.","Chi tiết: điểm thấp nhất"],
["This decline coincides with heavier academic workloads and greater use of electronic devices in the later years of secondary school.","Sự sụt giảm này trùng với khối lượng học tập nặng hơn và việc dùng thiết bị điện tử nhiều hơn ở những năm cuối cấp.","Giải thích – kết"]],
L:["Câu tổng quan “a clear downward trend” đứng sau câu giới thiệu.","Chi tiết bắt đầu từ khối nhỏ nhất – điểm cao nhất.","“By grade 12, this figure” – “this figure” = hơn 9 giờ của lớp 6.","“This decline” gói lại xu hướng giảm → giải thích nguyên nhân ở cuối."],
t:"Chuỗi tham chiếu: nine hours → this figure → This decline. “By grade 12” là mốc cuối nên phải đứng sau “Grade 6”.",
w:[["grade level","khối lớp"],["a clear downward trend","xu hướng giảm rõ rệt"],["the recommended amount","lượng khuyến nghị"],["coincide with","trùng với"]]},

{ty:"c",ti:"Pie charts – family spending",ok:"acedb",
seq:[["The two pie charts compare how an average family in Vietnam spent its monthly income in 2005 and 2025.","Hai biểu đồ tròn so sánh cách một gia đình Việt Nam trung bình chi tiêu thu nhập hằng tháng vào năm 2005 và 2025.","Giới thiệu biểu đồ"],
["In 2005, food was the largest category of expenditure, taking up almost half of the family budget.","Năm 2005, thực phẩm là khoản chi lớn nhất, chiếm gần một nửa ngân sách gia đình.","Mốc 2005"],
["By 2025, this proportion had fallen to just under 30%, even though the actual amount spent on food had risen.","Đến năm 2025, tỷ lệ này giảm xuống dưới 30%, dù số tiền thực tế chi cho thực phẩm đã tăng.","Mốc 2025"],
["The money released from food spending was largely redirected towards education and leisure, the shares of which both doubled.","Phần tiền dôi ra từ chi tiêu thực phẩm phần lớn được chuyển sang giáo dục và giải trí, tỷ lệ của cả hai đều tăng gấp đôi.","Khoản tăng"],
["Housing costs, meanwhile, remained a constant burden, at roughly a fifth of income in both years.","Trong khi đó, chi phí nhà ở vẫn là gánh nặng không đổi, khoảng một phần năm thu nhập trong cả hai năm.","Khoản ổn định – kết"]],
L:["Mốc 2005 với khoản chi lớn nhất.","“this proportion” = gần một nửa ngân sách; “By 2025” – mốc sau.","“The money released from food spending” – phần tiền giảm từ thực phẩm được chuyển đi đâu.","“meanwhile” – khoản không thay đổi → câu cuối."],
t:"“this proportion” và “The money released from food spending” đều bám vào thông tin về thực phẩm – hai câu này đứng liền sau câu 2005.",
w:[["category of expenditure","khoản chi tiêu"],["take up","chiếm (phần)"],["be redirected towards","được chuyển hướng sang"],["a constant burden","gánh nặng không đổi"]]},

{ty:"c",ti:"Line graph – wild tiger populations",ok:"dabec",
seq:[["The line graph illustrates changes in the wild tiger population in India and Russia from 2000 to 2022.","Biểu đồ đường thể hiện sự thay đổi số lượng hổ hoang dã ở Ấn Độ và Nga từ năm 2000 đến 2022.","Giới thiệu biểu đồ"],
["India's tiger numbers fell to a low of around 1,400 in 2006 before beginning a remarkable recovery.","Số lượng hổ ở Ấn Độ giảm xuống mức thấp khoảng 1.400 con năm 2006 trước khi bắt đầu phục hồi ngoạn mục.","Ấn Độ: điểm thấp nhất"],
["This turnaround followed the introduction of stricter anti-poaching laws and the expansion of protected reserves.","Sự đảo chiều này diễn ra sau khi ban hành luật chống săn trộm nghiêm ngặt hơn và mở rộng các khu bảo tồn.","Giải thích sự đảo chiều"],
["By 2022, the population had more than doubled, exceeding 3,100 individuals.","Đến năm 2022, quần thể đã tăng hơn gấp đôi, vượt 3.100 cá thể.","Ấn Độ: mốc cuối"],
["Russia's tigers, in contrast, showed a much slower but steady rise, from about 400 to 750 over the same period.","Ngược lại, hổ ở Nga tăng chậm hơn nhiều nhưng đều đặn, từ khoảng 400 lên 750 con trong cùng giai đoạn.","Đối chiếu: Nga – kết"]],
L:["Sau câu giới thiệu là diễn biến của Ấn Độ – nước có biến động lớn.","“This turnaround” = “a remarkable recovery” (đồng nghĩa).","“By 2022, the population had more than doubled” – kết quả của sự phục hồi.","“in contrast… over the same period” – so sánh Nga với Ấn Độ → câu cuối."],
t:"Đồng nghĩa ngầm: recovery ↔ turnaround. “much slower” và “in contrast” cho biết Nga được mô tả sau Ấn Độ.",
w:[["fall to a low of","giảm xuống mức thấp"],["a remarkable recovery","sự phục hồi ngoạn mục"],["turnaround","sự đảo chiều"],["anti-poaching laws","luật chống săn trộm"]]}
);

function _mk(x,i){
  const ok=x.ok, sw=(s,p,q)=>{const a=s.split('');[a[p],a[q]]=[a[q],a[p]];return a.join('')};
  let opts,key;
  if(x.opts){opts=x.opts;key=x.k}
  else{
    const c=[sw(ok,1,2),sw(ok,3,4),sw(ok,0,1),sw(ok,2,3),sw(ok,1,3)];
    const d=[];c.forEach(o=>{if(o!==ok&&!d.includes(o)&&d.length<3)d.push(o)});
    key=(i*3+1)%4; opts=d.slice(); opts.splice(key,0,ok);
  }
  const s={},r={},v={};
  x.seq.forEach((q,j)=>{s[ok[j]]=q[0];v[ok[j]]=q[1];r[ok[j]]=q[2]});
  const L=x.L.map((t,j)=>`(${ok[j]}) → (${ok[j+1]}): `+t);
  return {cat:"adv",ty:x.ty,title:(x.ty==="c"?"📊 Mô tả biểu đồ · ":"📝 Đoạn văn nghị luận · ")+x.ti,s,opts,key,ana:{r,v,L,t:x.t,w:x.w},src:x.src};
}
const ADV=[...ADV_SRC.map(_mk),
  ...ADV_OLD.map(x=>Object.assign({},x,{cat:"adv",ty:"p",title:"📝 Đoạn văn nghị luận · "+x.title})),

{ty:"Thư ứng tuyển tình nguyện viên (Volunteer application)",open:"Dear Ms. Taylor,",close:"Yours sincerely,<br>Pham Bao Ngoc",ok:"dbeac",
seq:[["I am writing to apply for the volunteer position at the Green City summer camp, which I saw advertised on your Facebook page.","Em viết thư này để ứng tuyển vị trí tình nguyện viên tại trại hè Green City mà em thấy được đăng trên trang Facebook của chị.","Lý do viết thư"],
["I am seventeen years old and have been a member of my school's environment club for two years.","Em mười bảy tuổi và đã là thành viên câu lạc bộ môi trường của trường được hai năm.","Giới thiệu bản thân"],
["During that time, I have helped organise several clean-up campaigns and tree-planting days for younger students.","Trong thời gian đó, em đã giúp tổ chức nhiều chiến dịch dọn rác và ngày trồng cây cho các em khóa dưới.","Kinh nghiệm"],
["I am available for the whole of July and would be happy to attend an interview at any time.","Em có thể tham gia trọn tháng Bảy và sẵn sàng phỏng vấn bất cứ lúc nào.","Thời gian & sự sẵn sàng"],
["Thank you for considering my application, and I look forward to hearing from you.","Cảm ơn chị đã xem xét đơn của em, và em mong sớm nhận được hồi âm.","Kêu gọi hồi âm – kết thư"]],
L:["Sau khi nêu mục đích “I am writing to apply for…”, người viết giới thiệu bản thân.","“During that time” = “for two years” trong CLB môi trường ở câu trước.","Sau kinh nghiệm là thông tin thực tế: thời gian có thể tham gia, sẵn sàng phỏng vấn.","“Thank you for considering my application” – câu chốt kinh điển của thư ứng tuyển."],
t:"Thư ứng tuyển chuẩn: Mục đích (I am writing to apply…) → Giới thiệu → Kinh nghiệm → Sẵn sàng → Mong hồi âm. “During that time” không thể đứng trước câu có mốc “for two years”.",
w:[["I am writing to apply for…","Tôi viết thư để ứng tuyển…"],["clean-up campaign","chiến dịch dọn rác"],["be available for","có thể tham gia (thời gian)"],["Thank you for considering my application.","Cảm ơn ông/bà đã xem xét đơn của tôi."]]},

{ty:"Thư xin học bổng (Scholarship application)",open:"Dear Scholarship Committee,",close:"Yours faithfully,<br>Le Hoang Nam",ok:"caebd",
seq:[["I would like to apply for the Bright Future Scholarship for students wishing to study engineering at your university.","Em xin ứng tuyển học bổng Tương Lai Tươi Sáng dành cho học sinh muốn học ngành kỹ thuật tại quý trường.","Lý do viết thư"],
["Throughout high school, I have maintained an average score of 9.2 and won second prize in the provincial physics competition.","Suốt những năm THPT, em duy trì điểm trung bình 9,2 và đạt giải Nhì cuộc thi Vật lý cấp tỉnh.","Thành tích học tập"],
["Apart from my studies, I spend my weekends teaching maths to children in my village free of charge.","Ngoài việc học, em dành cuối tuần dạy toán miễn phí cho các em nhỏ trong làng.","Hoạt động ngoại khóa"],
["However, my family's income is limited, and without financial support I may not be able to afford the tuition fees.","Tuy nhiên, thu nhập của gia đình em có hạn, và nếu không có hỗ trợ tài chính, em có thể không đủ khả năng đóng học phí.","Hoàn cảnh – lý do cần học bổng"],
["I have enclosed my school reports and a letter of recommendation from my form teacher.","Em xin gửi kèm học bạ và thư giới thiệu của giáo viên chủ nhiệm.","Hồ sơ đính kèm – kết thư"]],
L:["Sau lời ứng tuyển là thành tích học tập – yếu tố quan trọng nhất của học bổng.","“Apart from my studies” – chuyển từ học tập sang hoạt động khác.","“However” – chuyển từ điểm mạnh sang hoàn cảnh khó khăn, lý do cần học bổng.","“I have enclosed…” – thông báo hồ sơ đính kèm, thường ở cuối thư trang trọng."],
t:"“Dear Scholarship Committee” → kết thư bằng “Yours faithfully”. Câu “I would like to apply for…” mở thư; “I have enclosed…” thường nằm cuối. “Apart from my studies” cần câu về học tập đứng trước.",
w:[["apply for a scholarship","xin học bổng"],["maintain an average score of","duy trì điểm trung bình"],["free of charge","miễn phí"],["I have enclosed…","Tôi xin gửi kèm…"]]},

["Last summer, I worked as a part-time guide at Trang An, where I showed foreign visitors around in English.","Hè năm ngoái, em làm hướng dẫn viên bán thời gian ở Tràng An, giới thiệu cảnh quan cho khách nước ngoài bằng tiếng Anh.","Kinh nghiệm"],
