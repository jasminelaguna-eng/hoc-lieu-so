["I would be grateful for the chance to learn from your team, even for just a few weeks.","Em sẽ rất biết ơn nếu có cơ hội học hỏi từ đội ngũ của anh, dù chỉ trong vài tuần.","Mong muốn – kết thư"]],
L:["Sau khi nêu người giới thiệu và mục đích, người viết giải thích vì sao quan tâm đến ngành du lịch.","Động cơ được chứng minh bằng kinh nghiệm thực tế ở Tràng An.","“This experience” thay cho công việc hướng dẫn viên ở câu trước.","“I would be grateful for the chance…” – lời đề nghị lịch sự kết thư."],
t:"Câu nêu người giới thiệu “Ms. Lan suggested that I contact you…” là câu mở. “This experience” phải đứng ngay sau câu kể kinh nghiệm.",
w:[["internship","kỳ thực tập"],["show sb around","dẫn ai đi tham quan"],["demanding","khó tính, đòi hỏi cao"],["I would be grateful for the chance to…","Tôi sẽ rất biết ơn nếu có cơ hội…"]]},

{ty:"Thư ứng tuyển việc làm thêm (Part-time job)",open:"Dear Manager,",close:"Yours faithfully,<br>Do Minh Khoa",ok:"ecbda",
seq:[["I am writing in response to your advertisement for a weekend café assistant in the local newspaper.","Tôi viết thư này để phản hồi quảng cáo tuyển nhân viên phục vụ quán cà phê cuối tuần trên báo địa phương.","Lý do viết thư"],
["Although I have not worked in a café before, I often help at my aunt's small restaurant during the holidays.","Dù chưa từng làm ở quán cà phê, tôi thường phụ giúp nhà hàng nhỏ của dì vào các kỳ nghỉ.","Kinh nghiệm liên quan"],
["There, I take orders, serve customers and sometimes handle the cash register.","Ở đó, tôi nhận gọi món, phục vụ khách và đôi khi quản lý quầy thu ngân.","Chi tiết công việc"],
["I am hard-working and punctual, and I learn new tasks quickly.","Tôi chăm chỉ, đúng giờ và học việc mới nhanh.","Phẩm chất"],
["Please find my CV attached, and do not hesitate to contact me if you need further information.","Xin gửi kèm CV của tôi, và đừng ngần ngại liên hệ nếu ông/bà cần thêm thông tin.","Đính kèm – kết thư"]],
L:["“Although I have not worked in a café before” – nhượng bộ rồi nêu kinh nghiệm gần giống.","“There” = ở nhà hàng của dì – trạng từ chỉ nơi chốn thay thế.","Sau kinh nghiệm là phẩm chất cá nhân.","“Please find my CV attached” – câu kết chuẩn của thư xin việc."],
t:"“I am writing in response to your advertisement…” luôn đứng đầu. “There” phải đứng ngay sau câu nhắc đến địa điểm (nhà hàng của dì).",
w:[["in response to","để phản hồi"],["punctual","đúng giờ"],["handle the cash register","quản lý quầy thu ngân"],["Do not hesitate to contact me.","Đừng ngần ngại liên hệ với tôi."]]},

// ===== THƯ PHÀN NÀN =====
{ty:"Thư phàn nàn khách sạn (Hotel complaint)",open:"Dear Sir or Madam,",close:"Yours faithfully,<br>Hoang Thi Thu",ok:"adbec",
seq:[["I am writing to express my dissatisfaction with my recent stay at your hotel from 10 to 12 June.","Tôi viết thư này để bày tỏ sự không hài lòng về kỳ lưu trú gần đây tại khách sạn của quý vị từ ngày 10 đến 12 tháng Sáu.","Lý do viết thư"],
["When I arrived, I was told that the sea-view room I had booked was no longer available.","Khi tôi đến, tôi được thông báo rằng phòng hướng biển tôi đã đặt không còn trống.","Vấn đề 1"],
["The room I was given instead was noisy, and the air conditioner did not work at all.","Căn phòng tôi được đổi sang lại ồn ào, và điều hòa hoàn toàn không hoạt động.","Vấn đề 2"],
["Despite several complaints to the reception, nobody came to fix it during my entire stay.","Dù tôi đã phàn nàn với lễ tân nhiều lần, không ai đến sửa trong suốt thời gian tôi ở.","Không được xử lý"],
["I would therefore appreciate a partial refund for the inconvenience I experienced.","Vì vậy, tôi mong được hoàn lại một phần tiền cho sự bất tiện tôi gặp phải.","Yêu cầu – kết thư"]],
L:["Sau lời phàn nàn chung, người viết kể sự cố đầu tiên khi đến nơi.","“The room I was given instead” – căn phòng thay thế cho phòng hướng biển ở câu trước.","“to fix it” – “it” = the air conditioner; dù phàn nàn vẫn không được sửa.","“therefore” – yêu cầu bồi thường là hệ quả của mọi sự cố."],
t:"Thư phàn nàn: Lý do → Sự cố theo trình tự thời gian → Đã phản ánh nhưng không được giải quyết → Yêu cầu. “instead” và “it” là manh mối nối các câu giữa.",
w:[["express my dissatisfaction with","bày tỏ sự không hài lòng về"],["no longer available","không còn trống"],["a partial refund","hoàn tiền một phần"],["inconvenience","sự bất tiện"]]},

{ty:"Thư phàn nàn đơn hàng (Late delivery)",open:"Dear Customer Service Team,",close:"Regards,<br>Vu Duc Anh",ok:"cbade",
seq:[["I ordered a pair of running shoes from your website on 2 May and paid in advance by bank transfer.","Tôi đặt một đôi giày chạy bộ trên trang web của quý công ty vào ngày 2 tháng Năm và đã thanh toán trước bằng chuyển khoản.","Bối cảnh đơn hàng"],
["According to your confirmation email, the shoes should have arrived within five working days.","Theo email xác nhận của quý công ty, đôi giày lẽ ra phải đến trong vòng năm ngày làm việc.","Cam kết của công ty"],
["However, it has now been three weeks, and I have still not received anything.","Tuy nhiên, giờ đã ba tuần trôi qua mà tôi vẫn chưa nhận được gì.","Vấn đề"],
["I have tried calling your hotline twice, but each time I was put on hold for over twenty minutes.","Tôi đã thử gọi đường dây nóng hai lần, nhưng lần nào cũng phải chờ máy hơn hai mươi phút.","Đã liên hệ không thành"],
["Could you please let me know where my order is, or cancel it and refund my money?","Xin quý công ty cho tôi biết đơn hàng của tôi đang ở đâu, hoặc hủy đơn và hoàn tiền cho tôi?","Yêu cầu – kết thư"]],
L:["Sau thông tin đơn hàng là cam kết thời gian giao hàng trong email xác nhận.","“However” – thực tế trái ngược với cam kết “five working days”.","Người viết kể việc đã cố liên hệ nhưng không được giải quyết.","Câu hỏi yêu cầu cụ thể – kết thư phàn nàn."],
t:"“However, it has now been three weeks…” cần câu nói về thời hạn giao hàng đứng trước. Câu kết của thư phàn nàn thường là yêu cầu: “Could you please…?”",
w:[["pay in advance","thanh toán trước"],["confirmation email","email xác nhận"],["working days","ngày làm việc"],["be put on hold","bị bắt chờ máy"]]},

{ty:"Thư phàn nàn với chủ nhà (Landlord complaint)",open:"Dear Mrs. Brown,",close:"Kind regards,<br>Linh",ok:"ebdac",
seq:[["I hope you are well. I am writing about a problem in the flat that I have been renting from you since September.","Mong bà vẫn khỏe. Tôi viết thư về một vấn đề trong căn hộ tôi thuê của bà từ tháng Chín.","Hỏi thăm + lý do viết thư"],
["For the past two weeks, water has been leaking from the bathroom ceiling whenever it rains.","Hai tuần qua, nước rỉ từ trần nhà tắm mỗi khi trời mưa.","Mô tả vấn đề"],
["As a result, there are now dark patches of mould on the walls, and the room smells unpleasant.","Kết quả là trên tường giờ có những mảng nấm mốc đen và căn phòng có mùi khó chịu.","Hậu quả"],
["I am worried that this could damage my health, as I already suffer from asthma.","Tôi lo điều này có thể ảnh hưởng đến sức khỏe vì tôi vốn bị hen suyễn.","Lo ngại"],
["I would be very grateful if you could send someone to repair the roof as soon as possible.","Tôi sẽ rất biết ơn nếu bà có thể cử người sửa mái nhà càng sớm càng tốt.","Đề nghị – kết thư"]],
L:["Sau lời mở, người viết mô tả cụ thể vấn đề: nước rỉ từ trần nhà tắm.","“As a result” – nấm mốc là hậu quả của việc nước rỉ.","“this could damage my health” – “this” = nấm mốc và mùi khó chịu.","Lời đề nghị lịch sự “I would be very grateful if…” khép thư."],
t:"Thư phàn nàn lịch sự với người quen: Hỏi thăm → Vấn đề → Hậu quả → Lo ngại → Đề nghị. “As a result” và “this” giúp cố định thứ tự giữa thư.",
w:[["leak","rỉ, dột"],["mould","nấm mốc"],["suffer from asthma","bị hen suyễn"],["as soon as possible","càng sớm càng tốt"]]},

{ty:"Thư góp ý căng tin trường (School canteen)",open:"Dear Mr. Hung,",close:"Yours sincerely,<br>Students of Class 11A2",ok:"daecb",
seq:[["We are writing on behalf of Class 11A2 to share our concerns about the food in the school canteen.","Chúng em viết thư thay mặt lớp 11A2 để chia sẻ những lo ngại về đồ ăn ở căng tin trường.","Lý do viết thư"],
["Recently, most of the meals have been fried and contain very few vegetables.","Gần đây, hầu hết các bữa ăn đều là đồ chiên và có rất ít rau.","Vấn đề 1"],
["In addition, drinks are often served in single-use plastic cups, which creates a lot of waste.","Ngoài ra, đồ uống thường được phục vụ trong cốc nhựa dùng một lần, gây ra rất nhiều rác thải.","Vấn đề 2"],
["We understand that providing healthy food at a low price is not easy.","Chúng em hiểu rằng cung cấp đồ ăn lành mạnh với giá rẻ không hề dễ dàng.","Nhượng bộ – thông cảm"],
["Nevertheless, we hope the canteen could offer at least one vegetarian option each day and switch to reusable cups.","Tuy vậy, chúng em mong căng tin có thể có ít nhất một món chay mỗi ngày và chuyển sang dùng cốc tái sử dụng.","Đề xuất – kết thư"]],
L:["Sau khi nêu mục đích, thư đi vào vấn đề thứ nhất: đồ ăn chiên rán, ít rau.","“In addition” – bổ sung vấn đề thứ hai.","“We understand that…” – nhượng bộ, thể hiện sự thông cảm trước khi đề xuất.","“Nevertheless” – dù khó, vẫn mong có thay đổi → đề xuất cụ thể."],
t:"Cặp “We understand that… / Nevertheless…” là cặp nhượng bộ – đối lập luôn đi liền nhau ở cuối thư góp ý. “In addition” không thể đứng ngay sau câu mở.",
w:[["on behalf of","thay mặt cho"],["share our concerns about","chia sẻ những lo ngại về"],["vegetarian option","món chay"],["reusable cups","cốc tái sử dụng"]]},

// ===== THƯ MỜI =====
{ty:"Thư mời sinh nhật (Birthday invitation)",open:"Hi Hoa,",close:"Love,<br>Thao",ok:"bceda",
seq:[["I'm turning eighteen next Sunday, and I'm having a small party to celebrate!","Chủ nhật tới tớ tròn mười tám tuổi và tớ sẽ tổ chức một bữa tiệc nhỏ để ăn mừng!","Lý do viết thư"],
["It'll be at the pizza restaurant near our school, from 6 to 9 p.m.","Tiệc sẽ ở nhà hàng pizza gần trường mình, từ 6 đến 9 giờ tối.","Thời gian – địa điểm"],
["Only a few close friends are coming, so it'll be relaxed and fun.","Chỉ có vài người bạn thân đến thôi nên sẽ thoải mái và vui lắm.","Chi tiết bữa tiệc"],
["Please don't bring a present – your company is more than enough!","Đừng mang quà nhé – cậu đến là quá đủ rồi!","Lời dặn"],
["Let me know if you can come by Thursday so I can book a table.","Báo tớ trước thứ Năm nếu cậu đến được để tớ đặt bàn nhé.","Yêu cầu hồi âm – kết thư"]],
L:["“It'll be at…” – “It” = the party ở câu trước.","Sau thời gian, địa điểm là quy mô bữa tiệc: vài bạn thân.","“Please don't bring a present” – lời dặn sau khi đã giới thiệu bữa tiệc.","“Let me know… by Thursday” – yêu cầu hồi âm luôn ở cuối thư mời."],
t:"Thư mời: Lý do → Thời gian, địa điểm → Chi tiết → Lời dặn → Yêu cầu hồi âm. Câu có đại từ “It” không thể mở thư.",
w:[["turn eighteen","tròn mười tám tuổi"],["close friends","bạn thân"],["your company","sự có mặt của bạn"],["book a table","đặt bàn"]]},

{ty:"Thư mời dự buổi hòa nhạc của trường (School concert)",open:"Dear Mr. and Mrs. Smith,",close:"Yours sincerely,<br>Nguyen Thu Trang<br>(Head of the Music Club)",ok:"aebcd",
seq:[["On behalf of the Music Club, I would like to invite you to our annual charity concert.","Thay mặt Câu lạc bộ Âm nhạc, em trân trọng kính mời ông bà đến dự buổi hòa nhạc từ thiện thường niên của chúng em.","Lời mời"],
["The event will take place in the school hall on Saturday, 20 December, at 7 p.m.","Sự kiện sẽ diễn ra tại hội trường trường vào lúc 7 giờ tối thứ Bảy, ngày 20 tháng Mười Hai.","Thời gian – địa điểm"],
["Students from every grade will perform traditional and modern songs.","Học sinh từ tất cả các khối sẽ biểu diễn những bài hát truyền thống và hiện đại.","Nội dung chương trình"],
["All money raised from ticket sales will go towards buying books for a primary school in Ha Giang.","Toàn bộ tiền bán vé sẽ được dùng để mua sách cho một trường tiểu học ở Hà Giang.","Mục đích từ thiện"],
["We would be honoured if you could attend, and please reply by 15 December.","Chúng em sẽ rất vinh dự nếu ông bà có thể đến dự, và xin vui lòng hồi âm trước ngày 15 tháng Mười Hai.","Mong hồi âm – kết thư"]],
L:["“The event” thay cho “our annual charity concert”.","Sau thời gian, địa điểm là nội dung biểu diễn.","Từ chương trình chuyển sang mục đích từ thiện (charity concert).","“We would be honoured if you could attend” – câu kết trang trọng của thư mời."],
t:"Thư mời trang trọng mở bằng “On behalf of…, I would like to invite you to…” và kết bằng “We would be honoured if you could attend”. “The event” không thể đứng trước câu nêu tên sự kiện.",
w:[["annual charity concert","buổi hòa nhạc từ thiện thường niên"],["take place","diễn ra"],["money raised","số tiền quyên góp được"],["We would be honoured if…","Chúng tôi sẽ rất vinh dự nếu…"]]},

{ty:"Thư mời đi cắm trại (Camping trip)",open:"Hey Quan,",close:"Cheers,<br>Duy",ok:"cdaeb",
seq:[["A few of us are planning a camping trip to Cuc Phuong National Park next weekend – fancy joining us?","Vài đứa bọn tớ đang lên kế hoạch đi cắm trại ở Vườn quốc gia Cúc Phương cuối tuần tới – cậu có muốn đi cùng không?","Lời mời"],
["We'll leave early on Saturday morning by bus and come back on Sunday afternoon.","Bọn tớ sẽ đi xe buýt từ sáng sớm thứ Bảy và về vào chiều Chủ nhật.","Lịch trình"],
["The plan is to hike to the thousand-year-old tree and then cook dinner by the campfire.","Kế hoạch là đi bộ đến cây nghìn năm tuổi rồi nấu bữa tối bên lửa trại.","Hoạt động"],
["Since you're the best photographer in our class, it would be great if you could bring your camera.","Vì cậu là người chụp ảnh đẹp nhất lớp, nếu cậu mang máy ảnh theo thì tuyệt lắm.","Lời đề nghị"],
["Text me by Wednesday if you're in, and I'll add you to the group chat.","Nhắn tớ trước thứ Tư nếu cậu tham gia nhé, tớ sẽ thêm cậu vào nhóm chat.","Yêu cầu hồi âm – kết thư"]],
L:["Sau lời mời là lịch trình đi – về.","“The plan is to…” – các hoạt động cụ thể trong chuyến đi.","Lời đề nghị riêng với người được mời (mang máy ảnh).","“Text me… if you're in” – yêu cầu hồi âm."],
t:"Thư mời thân mật mở bằng câu hỏi “fancy joining us?” và kết bằng “Text me… if you're in”. “if you're in” = nếu cậu tham gia.",
w:[["fancy + V-ing?","có muốn… không? (thân mật)"],["hike","đi bộ đường dài"],["campfire","lửa trại"],["be in","tham gia"]]},

{ty:"Thư mời tham gia câu lạc bộ (Club invitation)",open:"Dear Minh,",close:"Best wishes,<br>Ms. Hanh<br>(English Club coordinator)",ok:"edcab",
seq:[["I noticed your excellent performance in the school speaking contest last month, and I'd like to invite you to join our English Club.","Cô thấy em thể hiện rất xuất sắc trong cuộc thi nói tiếng Anh của trường tháng trước, nên cô muốn mời em tham gia Câu lạc bộ Tiếng Anh.","Lý do viết thư – lời mời"],
["The club meets every Friday afternoon in Room 204.","Câu lạc bộ sinh hoạt vào mỗi chiều thứ Sáu tại phòng 204.","Thời gian – địa điểm"],
["Our activities include debates, drama performances and online exchanges with students in Australia.","Các hoạt động gồm tranh biện, biểu diễn kịch và giao lưu trực tuyến với học sinh Úc.","Hoạt động"],
["These are great opportunities to build confidence and use English in real situations.","Đây là những cơ hội tuyệt vời để tự tin hơn và dùng tiếng Anh trong tình huống thực tế.","Lợi ích"],
["If you are interested, just come along to our next meeting this Friday.","Nếu em thấy hứng thú, cứ đến buổi sinh hoạt tiếp theo vào thứ Sáu này nhé.","Lời mời hành động – kết thư"]],
L:["Sau lời mời là thời gian, địa điểm sinh hoạt.","Tiếp theo là các hoạt động của câu lạc bộ.","“These” thay cho các hoạt động: tranh biện, kịch, giao lưu.","“If you are interested, just come along…” – lời mời hành động kết thư."],
t:"Câu mở nêu lý do mời (thành tích ở cuộc thi). “These” cần câu liệt kê hoạt động đứng trước. Câu kết là lời kêu gọi “just come along”.",
w:[["excellent performance","màn thể hiện xuất sắc"],["debate","tranh biện"],["build confidence","xây dựng sự tự tin"],["come along to","đến tham dự"]]},

// ===== THƯ TRAO ĐỔI HỌC TẬP =====
{ty:"Thư mượn vở ghi (Asking for notes)",open:"Hi Lan,",close:"Thanks a million,<br>Mai",ok:"bdcea",
seq:[["I'm sorry I missed school last week – I had a bad flu and had to stay in bed for four days.","Tớ xin lỗi vì tuần trước nghỉ học – tớ bị cúm nặng và phải nằm giường bốn ngày.","Lý do vắng mặt"],
["I'm feeling much better now, but I'm worried about falling behind in chemistry.","Giờ tớ đã đỡ nhiều rồi, nhưng tớ lo bị tụt lại môn hóa.","Mối lo"],
["Could you lend me your notes on the lessons about acids and bases?","Cậu cho tớ mượn vở ghi các bài về axit và bazơ được không?","Lời nhờ"],
["I'll photocopy them and give them back to you on Monday.","Tớ sẽ photo rồi trả cậu vào thứ Hai.","Lời hứa"],
["In return, I'd be happy to help you with English vocabulary before the next test!","Đổi lại, tớ sẵn lòng giúp cậu ôn từ vựng tiếng Anh trước bài kiểm tra tới!","Đề nghị đáp lễ – kết thư"]],
L:["Sau khi giải thích lý do nghỉ, người viết nêu mối lo hiện tại.","Mối lo “falling behind in chemistry” dẫn tới lời nhờ mượn vở hóa.","“them” = your notes; người viết hứa trả lại.","“In return” – đề nghị giúp lại để khép thư."],
t:"Thư nhờ vả: Hoàn cảnh → Mối lo → Lời nhờ (Could you…?) → Lời hứa → Đáp lễ (In return). Đại từ “them” phải đứng sau câu có “your notes”.",
w:[["fall behind","bị tụt lại"],["lend sb sth","cho ai mượn cái gì"],["photocopy","photo, sao chụp"],["in return","đổi lại"]]},

{ty:"Thư lập nhóm học (Study group)",open:"Dear classmates,",close:"See you then,<br>Tuan (class monitor)",ok:"cabed",
seq:[["With the graduation exam only three months away, I think we should start revising together.","Chỉ còn ba tháng nữa là thi tốt nghiệp, mình nghĩ chúng ta nên bắt đầu ôn tập cùng nhau.","Lý do viết thư"],
["My idea is to form small groups of four or five, each focusing on one subject that its members find difficult.","Ý tưởng của mình là lập các nhóm nhỏ bốn, năm người, mỗi nhóm tập trung vào một môn mà các thành viên thấy khó.","Đề xuất"],
["Stronger students could take turns explaining key topics, while others prepare practice questions.","Những bạn học tốt hơn có thể thay phiên giảng các chủ đề chính, trong khi các bạn khác chuẩn bị câu hỏi luyện tập.","Cách thức hoạt động"],
["This way, everyone both teaches and learns, which is the best way to remember things.","Bằng cách này, ai cũng vừa dạy vừa học, đó là cách tốt nhất để ghi nhớ.","Lợi ích"],
["Let's discuss the details during our class meeting on Monday.","Chúng ta hãy bàn chi tiết trong giờ sinh hoạt lớp thứ Hai nhé.","Kêu gọi – kết thư"]],
L:["Sau lý do (sắp thi), người viết đưa ra ý tưởng cụ thể.","Giải thích cách các nhóm hoạt động.","“This way” = cách thay phiên giảng và chuẩn bị câu hỏi.","“Let's discuss the details…” – lời kêu gọi kết thư."],
t:"“My idea is to…” cần lý do đứng trước; “This way” cần câu mô tả cách làm đứng trước. Câu “Let's…” thường ở cuối thư kêu gọi.",
w:[["revise","ôn tập"],["take turns + V-ing","thay phiên làm gì"],["practice questions","câu hỏi luyện tập"],["class meeting","giờ sinh hoạt lớp"]]},

{ty:"Thư trao đổi dự án nhóm (Group project)",open:"Hi Nam,",close:"Talk soon,<br>Ha",ok:"debca",
seq:[["I've just finished reading the first draft of our presentation on renewable energy.","Tớ vừa đọc xong bản nháp đầu tiên của bài thuyết trình về năng lượng tái tạo của nhóm mình.","Lý do viết thư"],
["Overall, it looks great, especially your section on solar power.","Nhìn chung bài rất tốt, nhất là phần của cậu về năng lượng mặt trời.","Nhận xét tích cực"],
["However, I think the part about wind energy is a bit too long and contains too many figures.","Tuy nhiên, tớ thấy phần năng lượng gió hơi dài và có quá nhiều số liệu.","Góp ý"],
["Maybe we could replace some of the numbers with a simple chart so the audience can follow more easily.","Có lẽ mình nên thay bớt số liệu bằng một biểu đồ đơn giản để khán giả dễ theo dõi hơn.","Đề xuất"],
["Can we meet in the library after school on Wednesday to finish it?","Thứ Tư sau giờ học mình gặp nhau ở thư viện để hoàn thành nhé?","Hẹn gặp – kết thư"]],
L:["“Overall” – nhận xét chung sau khi đọc bản nháp.","“However” – chuyển từ khen sang góp ý.","“some of the numbers” = “too many figures” – đề xuất cách sửa.","Hẹn gặp để hoàn thành bài → kết thư."],
t:"Góp ý khéo léo: Khen (Overall… great) → However (điểm cần sửa) → Đề xuất (Maybe we could…) → Hẹn gặp. “However” không đứng ngay sau câu mở.",
w:[["first draft","bản nháp đầu tiên"],["renewable energy","năng lượng tái tạo"],["figures","số liệu"],["follow (a talk)","theo dõi, nắm được (bài nói)"]]},

{ty:"Thư hỏi kinh nghiệm thi (Exam advice)",open:"Dear Hieu,",close:"Best wishes,<br>Khanh",ok:"aecbd",
seq:[["Congratulations again on your excellent score in last year's graduation exam!","Một lần nữa chúc mừng anh đã đạt điểm xuất sắc trong kỳ thi tốt nghiệp năm ngoái!","Lời chúc mừng mở đầu"],
["I'm taking the exam this June, and I'm finding the English reading section really challenging.","Tháng Sáu này em sẽ thi, và em thấy phần đọc hiểu tiếng Anh thật sự khó.","Lý do viết thư"],
["In particular, I often run out of time on the sentence arrangement questions.","Đặc biệt, em thường không đủ thời gian làm các câu sắp xếp câu.","Khó khăn cụ thể"],
["How did you manage to work through them so quickly?","Anh đã làm cách nào để giải chúng nhanh như vậy?","Câu hỏi"],
["Any tips would be greatly appreciated, and I promise to treat you to bubble tea after the exam!","Bất kỳ mẹo nào cũng sẽ rất quý với em, và em hứa sẽ mời anh trà sữa sau kỳ thi!","Lời cảm ơn trước – kết thư"]],
L:["Từ lời chúc mừng chuyển sang lý do viết thư: em sắp thi.","“In particular” – thu hẹp từ phần đọc hiểu nói chung sang dạng câu cụ thể.","“them” = the sentence arrangement questions.","“Any tips would be greatly appreciated” – câu kết của thư xin lời khuyên."],
t:"Đi từ chung đến riêng: English reading → In particular → sentence arrangement questions → them. Đại từ “them” trong câu hỏi phải đứng ngay sau câu nêu dạng bài.",
w:[["run out of time","hết thời gian"],["in particular","đặc biệt là"],["Any tips would be greatly appreciated.","Mọi lời khuyên đều rất quý."],["treat sb to sth","mời/đãi ai món gì"]]},

// ===== THƯ XIN LỖI =====
{ty:"Thư xin lỗi vì vắng mặt (Missed party)",open:"Dear Phuong,",close:"Hugs,<br>Yen",ok:"ceadb",
seq:[["I'm so sorry I couldn't come to your housewarming party on Saturday.","Tớ rất xin lỗi vì không thể đến tiệc tân gia của cậu hôm thứ Bảy.","Lời xin lỗi"],
["My grandmother was suddenly taken to hospital that morning, and my whole family had to go to Ninh Binh.","Sáng hôm đó bà tớ đột ngột phải nhập viện, và cả nhà tớ phải về Ninh Bình.","Lý do"],
["Luckily, she is recovering well now and should be home next week.","May mắn là bà đang hồi phục tốt và tuần sau sẽ được về nhà.","Tin tức hiện tại"],
["I've seen the photos on Facebook, and your new flat looks lovely!","Tớ đã xem ảnh trên Facebook, căn hộ mới của cậu trông đẹp quá!","Nhận xét về sự kiện"],
["Could I come over one evening next week to see it in person and bring you a small gift?","Tuần sau tớ qua nhà cậu một tối để tận mắt xem và mang cho cậu một món quà nhỏ được không?","Đề nghị bù đắp – kết thư"]],
L:["Sau lời xin lỗi là lý do vắng mặt.","“she” = my grandmother; cập nhật tình hình sức khỏe.","Chuyển từ chuyện gia đình sang bữa tiệc: đã xem ảnh căn hộ mới.","“to see it in person” – “it” = your new flat → đề nghị đến thăm."],
t:"Thư xin lỗi: Xin lỗi → Lý do → Cập nhật → Quan tâm tới người nhận → Đề nghị bù đắp. Đại từ “she” và “it” giúp khóa vị trí câu 3 và câu 5.",
w:[["housewarming party","tiệc tân gia"],["be taken to hospital","được đưa vào viện"],["recover well","hồi phục tốt"],["in person","trực tiếp, tận mắt"]]},

{ty:"Thư xin lỗi vì làm hỏng đồ (Broken item)",open:"Hi Tom,",close:"Sorry again,<br>Kevin",ok:"bacde",
seq:[["I have something embarrassing to tell you about the camera you lent me for the school trip.","Tớ có một chuyện ngại phải kể với cậu về chiếc máy ảnh cậu cho tớ mượn trong chuyến đi của trường.","Lý do viết thư"],
["While I was taking photos on the boat, I slipped and dropped it on the deck.","Khi đang chụp ảnh trên thuyền, tớ bị trượt chân và làm rơi nó xuống sàn.","Sự việc"],
["The camera still turns on, but the lens is badly scratched.","Máy ảnh vẫn bật được, nhưng ống kính bị xước nặng.","Hậu quả"],
["I feel terrible about it, and of course I'll pay for the repair.","Tớ thấy rất có lỗi, và tất nhiên tớ sẽ trả tiền sửa.","Nhận trách nhiệm"],
["I've already found a good repair shop near my house – shall we take it there together this weekend?","Tớ đã tìm được một tiệm sửa uy tín gần nhà – cuối tuần này mình cùng mang đến đó nhé?","Đề xuất – kết thư"]],
L:["Sau câu báo trước “something embarrassing”, người viết kể sự việc; “it” = the camera.","Hậu quả cụ thể: ống kính bị xước.","“I feel terrible about it” – bày tỏ hối lỗi và nhận trách nhiệm.","Đề xuất cụ thể để giải quyết → kết thư."],
t:"Câu báo trước “I have something embarrassing to tell you…” mở thư. Đại từ “it” ở câu kể sự việc cần “the camera” đứng trước.",
w:[["embarrassing","ngại ngùng, xấu hổ"],["slip","trượt chân"],["badly scratched","bị xước nặng"],["pay for the repair","trả tiền sửa chữa"]]},

{ty:"Thư xin lỗi vì trả lời muộn (Late reply)",open:"Dear Aunt Hien,",close:"Lots of love,<br>Vy",ok:"dcbae",
seq:[["Thank you for your lovely letter, and I'm sorry it has taken me so long to reply.","Cháu cảm ơn bức thư đáng yêu của dì, và cháu xin lỗi vì đã hồi âm muộn như vậy.","Cảm ơn + xin lỗi"],
["The past month has been extremely busy because of my mid-term exams.","Tháng vừa rồi cháu cực kỳ bận vì thi giữa kỳ.","Lý do"],
["The good news is that they went well, and I got the highest mark in my class for literature.","Tin vui là cháu thi tốt, và cháu được điểm văn cao nhất lớp.","Tin vui"],
["I've also started learning to swim at the weekends, which I'm really enjoying.","Cháu cũng bắt đầu học bơi vào cuối tuần, cháu rất thích.","Tin khác"],
["How are you and Uncle Long? Please write back and tell me all your news.","Dì và chú Long thế nào ạ? Dì viết thư kể cho cháu mọi chuyện nhé.","Hỏi thăm – kết thư"]],
L:["Sau lời xin lỗi là lý do bận: thi giữa kỳ.","“they went well” – “they” = my mid-term exams.","“also” – kể thêm tin khác.","Câu hỏi thăm và lời mời hồi âm kết thư."],
t:"Đại từ “they” (kỳ thi) cần câu có “mid-term exams” đứng trước. “also” không thể đứng ngay sau câu mở. Thư thân mật thường kết bằng câu hỏi thăm.",
w:[["It has taken me so long to reply.","Tôi đã hồi âm muộn quá."],["mid-term exams","kỳ thi giữa kỳ"],["go well","diễn ra tốt đẹp"],["tell me all your news","kể cho tôi mọi chuyện"]]},

// ===== THƯ XIN / CHO LỜI KHUYÊN =====
{ty:"Thư cho lời khuyên (Exam stress)",open:"Dear Linh,",close:"Take care,<br>Thu",ok:"eabdc",
seq:[["I'm sorry to hear that you've been feeling so stressed about the coming exams.","Tớ rất tiếc khi biết cậu đang căng thẳng như vậy vì kỳ thi sắp tới.","Lời đồng cảm"],
["First of all, try not to study late into the night, because sleep helps your brain remember what you've learnt.","Trước hết, cố đừng học khuya, vì giấc ngủ giúp não ghi nhớ những gì cậu đã học.","Lời khuyên 1"],
["It's also a good idea to make a realistic timetable and take a short break every hour.","Cậu cũng nên lập một thời gian biểu hợp lý và nghỉ ngắn sau mỗi giờ học.","Lời khuyên 2"],
["Finally, don't forget to talk to your family or friends when you feel worried.","Cuối cùng, đừng quên tâm sự với gia đình hoặc bạn bè khi cậu thấy lo lắng.","Lời khuyên 3"],
["I'm sure you'll do brilliantly – good luck!","Tớ chắc chắn cậu sẽ làm bài thật tốt – chúc may mắn!","Lời chúc – kết thư"]],
L:["Sau lời đồng cảm là lời khuyên đầu tiên “First of all”.","“It's also a good idea…” – lời khuyên thứ hai.","“Finally” – lời khuyên cuối.","Lời chúc động viên kết thư."],
t:"Thư khuyên nhủ: Đồng cảm (I'm sorry to hear…) → First of all → also → Finally → Lời chúc. Các từ nối liệt kê quyết định thứ tự.",
w:[["I'm sorry to hear that…","Tớ rất tiếc khi nghe rằng…"],["a realistic timetable","thời gian biểu hợp lý"],["take a short break","nghỉ ngắn"],["You'll do brilliantly.","Cậu sẽ làm thật tốt."]]},

{ty:"Thư xin lời khuyên chọn nghề (Career advice)",open:"Dear Ms. Thao,",close:"Yours sincerely,<br>Bui Thanh Tung",ok:"cbaed",
seq:[["I am writing to ask for your advice about choosing a university major.","Em viết thư này để xin lời khuyên của cô về việc chọn ngành học đại học.","Lý do viết thư"],
["My parents want me to study medicine, as both of them are doctors.","Bố mẹ muốn em học y vì cả hai đều là bác sĩ.","Mong muốn của bố mẹ"],
["However, I am much more interested in graphic design and have won several drawing competitions.","Tuy nhiên, em hứng thú với thiết kế đồ họa hơn nhiều và đã đạt giải trong một số cuộc thi vẽ.","Mong muốn của bản thân"],
["I do not want to disappoint them, but I am afraid I will be unhappy if I choose the wrong career.","Em không muốn làm bố mẹ thất vọng, nhưng em sợ sẽ không hạnh phúc nếu chọn sai nghề.","Băn khoăn"],
["Could I possibly meet you after class one day this week to talk about it?","Em có thể gặp cô sau giờ học một hôm trong tuần này để trao đổi được không ạ?","Đề nghị gặp – kết thư"]],
L:["Sau lý do viết thư, người viết trình bày mong muốn của bố mẹ.","“However” – đối lập: mong muốn của bản thân khác bố mẹ.","“disappoint them” – “them” = my parents; nêu nỗi băn khoăn.","“to talk about it” – lời đề nghị gặp kết thư."],
t:"Cặp đối lập “My parents want… / However, I am more interested in…” đứng liền nhau. “them” ở câu băn khoăn chỉ bố mẹ – cần câu (bố mẹ) đứng trước.",
w:[["university major","ngành học đại học"],["graphic design","thiết kế đồ họa"],["disappoint sb","làm ai thất vọng"],["Could I possibly…?","Liệu em có thể…? (rất lịch sự)"]]},

{ty:"Thư cho lời khuyên du học (Studying abroad)",open:"Hi Bao,",close:"Good luck,<br>Hai",ok:"bdeac",
seq:[["It's great to hear that you're thinking of studying in Australia next year!","Thật vui khi nghe cậu đang tính sang Úc du học năm sau!","Phản hồi tin của bạn"],
["Since I've been living in Melbourne for two years now, I'd be happy to share a few tips.","Vì tớ đã sống ở Melbourne được hai năm, tớ sẵn lòng chia sẻ vài kinh nghiệm.","Lý do có thể khuyên"],
["The most important thing is to improve your English before you come, especially listening.","Điều quan trọng nhất là cải thiện tiếng Anh trước khi sang, nhất là kỹ năng nghe.","Lời khuyên quan trọng nhất"],
["Australians speak quite fast and use a lot of slang, which surprised me at first.","Người Úc nói khá nhanh và dùng nhiều tiếng lóng, điều này làm tớ bất ngờ lúc đầu.","Giải thích"],
["You should also apply for accommodation early, as rooms near the university go very quickly.","Cậu cũng nên đăng ký chỗ ở sớm vì phòng gần trường hết rất nhanh.","Lời khuyên thứ hai – kết thư"]],
L:["Sau lời phản hồi, người viết cho biết vì sao mình có thể khuyên: đã sống ở Melbourne hai năm.","“The most important thing” – lời khuyên đầu tiên và quan trọng nhất.","Giải thích vì sao kỹ năng nghe quan trọng: người Úc nói nhanh, dùng tiếng lóng.","“also” – lời khuyên thứ hai."],
t:"“The most important thing” luôn là lời khuyên đầu tiên; “also” là lời khuyên bổ sung sau. Câu giải thích về cách nói của người Úc phải bám ngay lời khuyên về kỹ năng nghe.",
w:[["share a few tips","chia sẻ vài kinh nghiệm"],["slang","tiếng lóng"],["accommodation","chỗ ở"],["go very quickly","hết rất nhanh"]]},

// ===== THƯ HỎI THÔNG TIN =====
{ty:"Thư hỏi thông tin khóa học (Course enquiry)",open:"Dear Sir or Madam,",close:"Yours faithfully,<br>Dinh Thu Ha",ok:"aedbc",
seq:[["I am writing to enquire about the IELTS preparation course advertised on your website.","Tôi viết thư để hỏi thông tin về khóa luyện thi IELTS được đăng trên trang web của quý trung tâm.","Lý do viết thư"],
["I am a Grade 12 student hoping to achieve a band score of 6.5 before applying to university.","Tôi là học sinh lớp 12 mong đạt 6.5 IELTS trước khi nộp hồ sơ đại học.","Giới thiệu – mục tiêu"],
["Firstly, could you tell me whether there are evening or weekend classes available?","Thứ nhất, xin cho tôi biết có lớp buổi tối hoặc cuối tuần không?","Câu hỏi 1"],
["I would also like to know how many students there are in each class.","Tôi cũng muốn biết mỗi lớp có bao nhiêu học viên.","Câu hỏi 2"],
["Finally, is there a placement test, and if so, how much does it cost?","Cuối cùng, có bài kiểm tra xếp lớp không, và nếu có thì phí bao nhiêu?","Câu hỏi 3 – kết"]],
L:["Sau lý do viết thư, người viết giới thiệu bản thân và mục tiêu.","“Firstly” – câu hỏi đầu tiên.","“also” – câu hỏi thứ hai.","“Finally” – câu hỏi cuối."],
t:"Thư hỏi thông tin: “I am writing to enquire about…” → Giới thiệu → Firstly → also → Finally. Từ nối liệt kê khóa cứng thứ tự ba câu cuối.",
w:[["enquire about","hỏi thông tin về"],["band score","mức điểm (IELTS)"],["placement test","bài kiểm tra xếp lớp"],["if so","nếu vậy, nếu có"]]},

{ty:"Thư hỏi thông tin trại hè (Summer camp enquiry)",open:"Dear Camp Director,",close:"Kind regards,<br>Mrs. Lan (parent)",ok:"dcabe",
seq:[["My twelve-year-old son is very interested in your science summer camp in Da Lat.","Con trai mười hai tuổi của tôi rất thích trại hè khoa học của quý vị ở Đà Lạt.","Lý do viết thư"],
["Before registering, however, I have a few questions.","Tuy nhiên, trước khi đăng ký, tôi có vài câu hỏi.","Câu chuyển ý"],
["I would like to know what kind of activities the children will do each day.","Tôi muốn biết các em sẽ làm những hoạt động gì mỗi ngày.","Câu hỏi 1"],

["I have always loved books, and I visit the library almost every lunchtime.","Em luôn yêu sách và gần như trưa nào cũng đến thư viện.","Động cơ"],
["As a result, I am already familiar with how the shelves are organised.","Vì thế, em đã quen với cách sắp xếp các giá sách.","Lợi thế"],
["I am also good with computers and could help students search the online catalogue.","Em cũng thành thạo máy tính và có thể giúp các bạn tra cứu danh mục trực tuyến.","Kỹ năng bổ sung"],
["I am free on Tuesday and Thursday afternoons and would be glad to start whenever you need.","Em rảnh chiều thứ Ba và thứ Năm và sẵn lòng bắt đầu bất cứ khi nào cô cần.","Thời gian – kết thư"]],
L:["Sau lời ứng tuyển là động cơ: yêu sách, hay đến thư viện.","“As a result” – nhờ hay đến thư viện nên quen cách xếp sách.","“also” – kỹ năng bổ sung: máy tính.","Thông tin thời gian rảnh, sẵn sàng bắt đầu → kết thư."],
t:"“As a result” cần nguyên nhân đứng ngay trước (hay đến thư viện). Thư ứng tuyển thường kết bằng thời gian có thể làm việc.",
w:[["assembly","buổi chào cờ, tập trung toàn trường"],["be familiar with","quen thuộc với"],["online catalogue","danh mục tra cứu trực tuyến"]]},

{ty:"Thư ứng tuyển trợ giảng (Teaching assistant)",open:"Dear Director,",close:"Yours faithfully,<br>Le Bich Ngoc",ok:"bcade",
seq:[["I am writing to apply for the part-time teaching assistant job at Sunshine English Centre.","Tôi viết thư để ứng tuyển vị trí trợ giảng bán thời gian tại Trung tâm Anh ngữ Sunshine.","Lý do viết thư"],
["I recently achieved an IELTS score of 7.0 and am now a first-year student at Hanoi University.","Tôi vừa đạt IELTS 7.0 và hiện là sinh viên năm nhất Đại học Hà Nội.","Trình độ"],
["Besides my qualifications, I have experience working with children, as I tutor my two younger cousins every week.","Ngoài bằng cấp, tôi có kinh nghiệm làm việc với trẻ em vì tôi kèm hai em họ mỗi tuần.","Kinh nghiệm"],
["I believe that learning should be fun, so I often use songs and games in my lessons.","Tôi tin rằng việc học phải vui, nên tôi thường dùng bài hát và trò chơi trong các buổi học.","Quan điểm – phương pháp"],
["I would welcome the opportunity to discuss my application with you in person.","Tôi rất mong có cơ hội trao đổi trực tiếp với ông/bà về hồ sơ của mình.","Mong phỏng vấn – kết thư"]],
L:["Sau lời ứng tuyển là trình độ: IELTS 7.0, sinh viên năm nhất.","“Besides my qualifications” – chuyển từ bằng cấp sang kinh nghiệm.","“in my lessons” – từ việc kèm em họ, nói về phương pháp dạy.","“I would welcome the opportunity…” – câu kết trang trọng."],
t:"“Besides my qualifications” nhắc lại IELTS ở câu trước → đứng ngay sau. “I would welcome the opportunity to discuss…” là câu kết kinh điển của thư xin việc.",
w:[["teaching assistant","trợ giảng"],["qualifications","bằng cấp, trình độ"],["I would welcome the opportunity to…","Tôi rất mong có cơ hội…"]]},

{ty:"Thư ứng tuyển tình nguyện viên sự kiện (Event volunteer)",open:"Dear Organising Committee,",close:"Yours faithfully,<br>Hoang Gia Huy",ok:"cadeb",
seq:[["I saw your notice asking for volunteers to help at the Ninh Binh International Marathon, and I am keen to take part.","Em thấy thông báo tuyển tình nguyện viên cho Giải Marathon Quốc tế Ninh Bình và em rất muốn tham gia.","Lý do viết thư"],
["As a member of my school's running club, I understand what athletes need during a long race.","Là thành viên câu lạc bộ chạy bộ của trường, em hiểu vận động viên cần gì trong một cuộc đua dài.","Lợi thế 1"],
["I can speak English fairly well, so I could also assist foreign runners with directions.","Em nói tiếng Anh khá tốt nên cũng có thể hỗ trợ chỉ đường cho vận động viên nước ngoài.","Lợi thế 2"],
["I would be happy to work at a water station or at the finish line.","Em sẵn sàng làm ở trạm tiếp nước hoặc ở vạch đích.","Vị trí mong muốn"],
["Please contact me on 0912 345 678 if you require any further details.","Xin liên hệ em qua số 0912 345 678 nếu cần thêm thông tin.","Thông tin liên hệ – kết thư"]],
L:["Sau lời bày tỏ mong muốn, người viết nêu lợi thế đầu tiên: thành viên CLB chạy bộ.","“also” – lợi thế thứ hai: tiếng Anh.","Từ khả năng chuyển sang vị trí cụ thể muốn đảm nhận.","Thông tin liên hệ luôn ở cuối thư."],
t:"“also assist foreign runners” cần một lợi thế khác đứng trước. Câu cho số điện thoại “Please contact me on…” là câu kết.",
w:[["be keen to","rất muốn"],["water station","trạm tiếp nước"],["require further details","cần thêm thông tin"]]},

{ty:"Thư ứng tuyển ban biên tập báo trường (School newspaper)",open:"Dear Mr. Duc,",close:"Best regards,<br>Kieu Anh",ok:"edbac",
seq:[["I would love to join the editorial team of our school newspaper, 'The Young Voice'.","Em rất muốn tham gia ban biên tập tờ báo trường ‘Tiếng Nói Trẻ’.","Mong muốn"],
["Writing has been my passion since I was a child, and I keep a blog about local food.","Viết lách là đam mê của em từ nhỏ, và em có một blog về ẩm thực địa phương.","Đam mê"],
["Last year, one of my articles from that blog was even published in a provincial magazine.","Năm ngoái, một bài viết trên blog đó còn được đăng trên một tạp chí của tỉnh.","Thành tích"],
["If I join the team, I would like to start a monthly column interviewing students with unusual hobbies.","Nếu được vào ban, em muốn mở một chuyên mục hằng tháng phỏng vấn những bạn có sở thích độc đáo.","Ý tưởng đóng góp"],
["I have attached two of my best articles for you to read.","Em gửi kèm hai bài viết hay nhất để thầy đọc.","Đính kèm – kết thư"]],
L:["Sau mong muốn là lý do: đam mê viết, có blog riêng.","“that blog” = blog về ẩm thực ở câu trước.","Từ quá khứ chuyển sang ý tưởng đóng góp nếu được nhận.","Gửi kèm bài viết – câu kết thư ứng tuyển."],
t:"“that blog” phải đứng sau câu giới thiệu blog. Câu điều kiện “If I join the team…” nói về tương lai nên đứng sau phần kinh nghiệm.",
w:[["editorial team","ban biên tập"],["be published","được xuất bản, đăng"],["column","chuyên mục"]]},

{ty:"Thư ứng tuyển chương trình trao đổi (Exchange programme)",open:"Dear Selection Panel,",close:"Yours faithfully,<br>Tran Duc Manh",ok:"abdce",
seq:[["I am applying for a place on the Vietnam–Japan Student Exchange Programme this summer.","Em xin đăng ký một suất tham gia Chương trình Trao đổi Học sinh Việt Nam – Nhật Bản hè này.","Lý do viết thư"],
["I have been learning Japanese for three years and have passed the N4 level test.","Em đã học tiếng Nhật ba năm và đã đỗ trình độ N4.","Trình độ"],
["However, I have never had the chance to use the language with native speakers.","Tuy nhiên, em chưa bao giờ có cơ hội dùng tiếng Nhật với người bản ngữ.","Hạn chế"],
["This programme would therefore be an ideal way for me to improve my speaking skills.","Vì vậy, chương trình này sẽ là cách lý tưởng để em cải thiện kỹ năng nói.","Lợi ích"],
["In exchange, I would be proud to introduce Vietnamese culture to my Japanese host school.","Đổi lại, em sẽ tự hào giới thiệu văn hóa Việt Nam với trường bạn ở Nhật.","Đóng góp – kết thư"]],
L:["Sau lời đăng ký là trình độ tiếng Nhật.","“However” – dù có trình độ, chưa từng luyện với người bản xứ.","“therefore” – vì thiếu cơ hội nói nên chương trình rất cần thiết.","“In exchange” – đóng góp ngược lại, khép thư."],
t:"Chuỗi lập luận: Trình độ → However (hạn chế) → therefore (lợi ích) → In exchange (đóng góp). Bốn tín hiệu này khóa chặt thứ tự.",
w:[["apply for a place on","đăng ký một suất tham gia"],["native speakers","người bản ngữ"],["in exchange","đổi lại"]]},

{ty:"Thư ứng tuyển việc làm hè ở hiệu sách (Bookshop job)",open:"Dear Mrs. Mai,",close:"Kind regards,<br>Dao Thu Trang",ok:"dcaeb",
seq:[["My friend Linh, who worked at your bookshop last summer, told me that you are looking for summer staff.","Bạn em là Linh, người làm ở hiệu sách của cô hè năm ngoái, cho em biết cô đang tìm nhân viên làm hè.","Lý do viết thư"],
["She said it was a friendly place to work, so I would really like to apply.","Bạn ấy nói đó là nơi làm việc thân thiện, nên em rất muốn ứng tuyển.","Mong muốn"],
["I read a lot, especially novels and travel books, so I could give customers useful recommendations.","Em đọc nhiều, nhất là tiểu thuyết và sách du lịch, nên có thể gợi ý sách hữu ích cho khách.","Lợi thế"],
["I am also tidy and organised, which would help me keep the shelves in good order.","Em cũng gọn gàng, ngăn nắp, điều này giúp em giữ giá sách luôn trật tự.","Phẩm chất"],
["I could work full-time from mid-June to the end of August.","Em có thể làm toàn thời gian từ giữa tháng Sáu đến hết tháng Tám.","Thời gian – kết thư"]],
L:["“She” = Linh; lời nhận xét của bạn dẫn tới mong muốn ứng tuyển.","Sau mong muốn là lợi thế: đọc nhiều.","“also” – phẩm chất bổ sung.","Thời gian có thể làm – kết thư."],
t:"Đại từ “She” chỉ có nghĩa sau câu nhắc “My friend Linh”. Thư ứng tuyển thân mật vẫn kết bằng thông tin thời gian làm việc.",
w:[["summer staff","nhân viên làm hè"],["give recommendations","đưa ra gợi ý"],["in good order","ngăn nắp, trật tự"]]},

{ty:"Thư phàn nàn tiếng ồn công trình (Construction noise)",open:"Dear Sir or Madam,",close:"Yours faithfully,<br>Residents of Le Loi Street",ok:"bedca",
seq:[["We are writing to complain about the noise from the building site opposite our homes on Le Loi Street.","Chúng tôi viết thư để phàn nàn về tiếng ồn từ công trường đối diện nhà chúng tôi trên phố Lê Lợi.","Lý do viết thư"],
["Work often begins at 5 a.m. and continues until late at night, even at weekends.","Công trình thường bắt đầu từ 5 giờ sáng và kéo dài đến tối muộn, kể cả cuối tuần.","Mô tả vấn đề"],
["This is affecting the health of many residents, particularly young children and elderly people.","Điều này ảnh hưởng đến sức khỏe nhiều cư dân, nhất là trẻ nhỏ và người già.","Hậu quả"],
["We understand that the new hospital is important for the community.","Chúng tôi hiểu rằng bệnh viện mới rất quan trọng với cộng đồng.","Nhượng bộ"],
["Nevertheless, we ask that working hours be limited to between 7 a.m. and 6 p.m.","Tuy vậy, chúng tôi đề nghị giới hạn giờ thi công trong khoảng từ 7 giờ sáng đến 6 giờ chiều.","Đề nghị – kết thư"]],
L:["Sau lời phàn nàn chung, thư mô tả cụ thể giờ giấc thi công.","“This” = việc thi công từ 5 giờ sáng đến khuya → hậu quả.","“We understand that…” – nhượng bộ trước khi đề nghị.","“Nevertheless” – vẫn đề nghị giới hạn giờ làm."],
t:"Cặp nhượng bộ “We understand that… / Nevertheless…” luôn đứng liền nhau ở cuối. “This is affecting…” cần câu mô tả vấn đề đứng trước.",
w:[["building site","công trường"],["residents","cư dân"],["working hours","giờ làm việc"]]},

{ty:"Thư phàn nàn tiệm sửa máy tính (Repair shop)",open:"Dear Manager,",close:"Regards,<br>Ly Van Toan",ok:"cbeda",
seq:[["Two weeks ago, I left my laptop at your shop to have its screen replaced.","Hai tuần trước, tôi gửi máy tính xách tay ở cửa hàng của anh để thay màn hình.","Bối cảnh"],
["When I collected it on Friday, the new screen worked, but the keyboard had stopped working.","Khi tôi nhận máy hôm thứ Sáu, màn hình mới hoạt động nhưng bàn phím lại hỏng.","Vấn đề"],
["The keyboard had been perfectly fine before I brought the laptop in.","Trước khi tôi mang máy đến, bàn phím hoàn toàn bình thường.","Khẳng định lỗi do cửa hàng"],
["When I mentioned this to your technician, he said it was not his responsibility.","Khi tôi nói với kỹ thuật viên, anh ta bảo đó không phải trách nhiệm của mình.","Thái độ nhân viên"],
["I expect the keyboard to be repaired free of charge, or I will report the matter to the consumer protection office.","Tôi yêu cầu bàn phím được sửa miễn phí, nếu không tôi sẽ báo sự việc lên cơ quan bảo vệ người tiêu dùng.","Yêu cầu – kết thư"]],
L:["Từ việc gửi máy chuyển sang lúc nhận máy: phát sinh lỗi mới.","Khẳng định bàn phím trước đó vẫn tốt – lỗi do cửa hàng.","“mentioned this” – “this” = chuyện bàn phím hỏng sau khi sửa.","Yêu cầu sửa miễn phí, kèm cảnh báo – kết thư."],
t:"Trình tự thời gian: Two weeks ago → on Friday → (khẳng định) → khi phản ánh. Câu yêu cầu kèm cảnh báo “or I will report…” luôn ở cuối.",
w:[["have sth replaced","nhờ thay cái gì"],["technician","kỹ thuật viên"],["free of charge","miễn phí"]]},

{ty:"Thư góp ý phòng tập (Gym membership)",open:"Dear Fitness Plus Team,",close:"Kind regards,<br>Mai Huong",ok:"aecdb",
seq:[["I have been a member of your gym for over a year, and I have generally been very satisfied.","Tôi là hội viên phòng tập được hơn một năm và nhìn chung rất hài lòng.","Mở đầu tích cực"],
["Recently, however, the changing rooms have not been cleaned properly.","Tuy nhiên gần đây, phòng thay đồ không được dọn sạch sẽ.","Vấn đề 1"],
["Several of the treadmills have also been out of order for nearly a month.","Một vài máy chạy bộ cũng đã hỏng gần một tháng.","Vấn đề 2"],
["As a result, there are long queues for the remaining machines in the evenings.","Vì thế, buổi tối mọi người phải xếp hàng dài chờ những máy còn lại.","Hậu quả"],
["I hope these issues can be resolved soon, as I would like to renew my membership next month.","Tôi mong những vấn đề này sớm được giải quyết vì tôi muốn gia hạn thẻ hội viên vào tháng tới.","Mong muốn – kết thư"]],
L:["“however” – sau lời khen chung là vấn đề đầu tiên.","“also” – vấn đề thứ hai: máy chạy hỏng.","“As a result” – máy hỏng dẫn đến xếp hàng dài.","“these issues” gói các vấn đề → kết thư."],
t:"Thư góp ý khéo: Khen trước → however (vấn đề) → also → As a result → these issues. “As a result” phải theo ngay câu máy hỏng.",
w:[["changing rooms","phòng thay đồ"],["out of order","bị hỏng"],["renew my membership","gia hạn hội viên"]]},

{ty:"Thư góp ý xe buýt (Bus service)",open:"Dear Sir or Madam,",close:"Yours faithfully,<br>Vu Hai Yen",ok:"dbaec",
seq:[["I am writing about the number 05 bus service, which I use every day to get to school.","Tôi viết thư về tuyến xe buýt số 05 mà tôi đi hằng ngày đến trường.","Lý do viết thư"],
["Since the timetable changed in September, buses in the morning have been running only every forty minutes.","Từ khi lịch chạy thay đổi vào tháng Chín, xe buổi sáng chỉ chạy bốn mươi phút một chuyến.","Vấn đề"],
["Consequently, they are always overcrowded, and students are often left waiting at the stop.","Do đó, xe luôn quá tải và học sinh thường bị bỏ lại ở bến.","Hậu quả"],
["Last Tuesday, three of my classmates were late for an important exam because of this.","Thứ Ba tuần trước, ba bạn cùng lớp tôi đến muộn một kỳ thi quan trọng vì chuyện này.","Ví dụ cụ thể"],
["Would it be possible to add extra buses between 6 and 7 a.m. on school days?","Liệu có thể tăng thêm chuyến từ 6 đến 7 giờ sáng vào các ngày đi học không?","Đề xuất – kết thư"]],
L:["Từ việc giới thiệu tuyến xe, thư nêu thay đổi lịch chạy.","“Consequently, they…” – “they” = buses; hậu quả của việc giãn chuyến.","Ví dụ cụ thể: ba bạn đến muộn giờ thi “because of this”.","Đề xuất tăng chuyến giờ cao điểm → kết."],
t:"“Consequently” cần nguyên nhân đứng ngay trước. “because of this” là câu ví dụ minh họa hậu quả. Câu hỏi đề xuất “Would it be possible…?” ở cuối.",
w:[["timetable","lịch chạy"],["overcrowded","quá tải, chật kín"],["Would it be possible to…?","Liệu có thể… không?"]]},

{ty:"Thư phàn nàn giao sai hàng (Wrong item)",open:"Dear Customer Support,",close:"Thank you,<br>Ta Minh Duc",ok:"ebcad",
seq:[["I recently ordered a blue backpack, order number 45821, from your online store.","Tôi vừa đặt một chiếc ba lô màu xanh, mã đơn 45821, trên cửa hàng trực tuyến của quý vị.","Bối cảnh"],
["Unfortunately, the item I received yesterday was a pink handbag.","Không may, món hàng tôi nhận hôm qua lại là một chiếc túi xách màu hồng.","Vấn đề"],
["I have checked the packing slip, and it clearly shows someone else's name and address.","Tôi đã kiểm tra phiếu đóng gói, và nó ghi rõ tên, địa chỉ của người khác.","Bằng chứng"],
["It seems that our parcels were mixed up during delivery.","Có vẻ bưu kiện của chúng tôi đã bị nhầm trong quá trình giao hàng.","Nhận định"],
["Could you please arrange for the handbag to be collected and send me the correct backpack?","Quý vị vui lòng sắp xếp thu hồi chiếc túi và gửi cho tôi đúng chiếc ba lô được không?","Yêu cầu – kết thư"]],
L:["“Unfortunately” – thực tế trái với đơn đặt hàng.","Bằng chứng: phiếu đóng gói ghi tên người khác.","Từ bằng chứng rút ra nhận định: bưu kiện bị nhầm.","“the handbag” và “the correct backpack” nhắc lại hai món đã nêu → yêu cầu."],
t:"Thư phàn nàn: Đơn hàng → Unfortunately (sai hàng) → Bằng chứng → Nhận định → Yêu cầu. Mạo từ “the” trong câu cuối nhắc lại các đồ vật đã xuất hiện trước.",
w:[["order number","mã đơn hàng"],["packing slip","phiếu đóng gói"],["be mixed up","bị nhầm lẫn"]]},

{ty:"Thư phàn nàn nhà mạng (Internet provider)",open:"Dear VNNet Customer Service,",close:"Yours sincerely,<br>Nguyen Thi Hanh",ok:"caebd",
seq:[["I am writing to complain about the poor quality of my home internet connection.","Tôi viết thư để phàn nàn về chất lượng kết nối internet tại nhà kém.","Lý do viết thư"],
["For the past month, the connection has dropped several times every evening.","Một tháng qua, mạng bị mất kết nối nhiều lần mỗi tối.","Vấn đề"],
["This is a serious problem for me because I study online and often have video lessons at night.","Đây là vấn đề nghiêm trọng vì tôi học trực tuyến và thường có lớp học video buổi tối.","Mức độ ảnh hưởng"],
["Your technician visited last week but left without finding the cause.","Kỹ thuật viên của quý công ty đến tuần trước nhưng về mà không tìm ra nguyên nhân.","Đã xử lý nhưng không hiệu quả"],
["Unless the problem is fixed within a week, I will have to cancel my contract.","Nếu vấn đề không được khắc phục trong một tuần, tôi buộc phải hủy hợp đồng.","Cảnh báo – kết thư"]],
L:["Sau lời phàn nàn chung là mô tả cụ thể: rớt mạng mỗi tối.","“This” = việc rớt mạng; giải thích vì sao nghiêm trọng.","Người viết kể việc đã có kỹ thuật viên đến nhưng không giải quyết được.","“Unless… I will have to cancel” – lời cảnh báo kết thư."],
t:"Câu điều kiện “Unless…, I will have to…” là lời cảnh báo cuối thư. “This is a serious problem” cần câu mô tả vấn đề đứng trước.",
w:[["connection drops","mất kết nối"],["find the cause","tìm ra nguyên nhân"],["cancel my contract","hủy hợp đồng"]]},

{ty:"Thư mời dự lễ tốt nghiệp (Graduation ceremony)",open:"Dear Grandma and Grandpa,",close:"Love,<br>Your grandson Khoi",ok:"bdcea",
seq:[["I have some exciting news – I am graduating from high school next month!","Cháu có tin vui – tháng sau cháu tốt nghiệp THPT rồi!","Báo tin"],
["The ceremony will be held in the school yard on the morning of 28 May.","Buổi lễ sẽ được tổ chức ở sân trường vào sáng ngày 28 tháng Năm.","Thời gian – địa điểm"],
["It would mean the world to me if you could both be there.","Nếu ông bà đều có thể đến, điều đó sẽ vô cùng ý nghĩa với cháu.","Lời mời"],
["Dad says he can drive to Kim Son to pick you up the evening before.","Bố bảo bố có thể lái xe về Kim Sơn đón ông bà từ tối hôm trước.","Sắp xếp đi lại"],
["Please call Mum to let her know whether you can come.","Ông bà gọi cho mẹ để báo có đến được không nhé.","Yêu cầu hồi âm – kết thư"]],
L:["“The ceremony” = lễ tốt nghiệp vừa báo tin.","Sau thông tin buổi lễ là lời mời tha thiết.","Lo trước chuyện đi lại để ông bà yên tâm nhận lời.","“let her know” – “her” = Mum → yêu cầu hồi âm."],
t:"“The ceremony” cần câu báo tin tốt nghiệp đứng trước. Thư mời luôn kết bằng yêu cầu hồi âm (let … know whether you can come).",
w:[["graduate from","tốt nghiệp"],["It would mean the world to me.","Điều đó vô cùng ý nghĩa với tôi."],["pick sb up","đón ai"]]},

{ty:"Thư mời về quê ăn Tết (Tet holiday)",open:"Hi Emma,",close:"Can't wait!<br>Lan Anh",ok:"edabc",
seq:[["Tet, our Lunar New Year, is coming soon, and my family would love you to celebrate it with us in Ninh Binh.","Tết, năm mới âm lịch của chúng tớ, sắp đến rồi, và gia đình tớ rất muốn cậu về Ninh Bình đón Tết cùng.","Lời mời"],
["It's the biggest festival of the year, when families get together and visit relatives.","Đó là lễ hội lớn nhất trong năm, khi các gia đình sum họp và đi thăm họ hàng.","Giới thiệu Tết"],
["You could help us make bánh chưng, a square rice cake wrapped in banana leaves.","Cậu có thể cùng nhà tớ gói bánh chưng – loại bánh gạo vuông gói bằng lá dong.","Hoạt động 1"],
["On New Year's Day, children also receive lucky money in red envelopes!","Vào mùng Một, trẻ em còn được nhận lì xì trong phong bao đỏ!","Hoạt động 2"],
["Let me know by the end of December so that my parents can prepare a room for you.","Báo tớ trước cuối tháng Mười Hai để bố mẹ tớ chuẩn bị phòng cho cậu nhé.","Yêu cầu hồi âm – kết thư"]],
L:["“It's the biggest festival” – “It” = Tet; giới thiệu cho người nước ngoài.","Từ giới thiệu chung chuyển sang hoạt động cụ thể: gói bánh chưng.","“also” – hoạt động thứ hai: lì xì.","Yêu cầu hồi âm kèm lý do (chuẩn bị phòng)."],
t:"Thư mời bạn nước ngoài: Lời mời → Giải thích sự kiện → Hoạt động → also → Hồi âm. Đại từ “It” và từ “also” xác định vị trí câu 2 và câu 4.",
w:[["Lunar New Year","Tết Nguyên đán"],["get together","sum họp"],["lucky money","tiền lì xì"]]},

{ty:"Thư mời tham gia câu lạc bộ sách (Book club)",open:"Dear Book Lovers,",close:"Happy reading,<br>Thu Ha (Book Club leader)",ok:"cbade",
seq:[["Our school Book Club is starting again after the summer break, and we warmly invite new members to join.","Câu lạc bộ Sách của trường hoạt động trở lại sau kỳ nghỉ hè, và chúng mình nhiệt liệt chào đón thành viên mới.","Lời mời"],
["We meet in the library every second Thursday to discuss a book chosen by members.","Chúng mình sinh hoạt ở thư viện vào thứ Năm của tuần thứ hai mỗi tháng để thảo luận một cuốn sách do các thành viên chọn.","Hình thức"],
["This month's choice is 'Dế Mèn phiêu lưu ký', which most of you probably read as children.","Sách tháng này là ‘Dế Mèn phiêu lưu ký’, cuốn mà hẳn nhiều bạn đã đọc hồi nhỏ.","Sách tháng này"],
["Reading it again as teenagers, you may be surprised by how many new meanings you discover.","Đọc lại ở tuổi thiếu niên, có thể bạn sẽ ngạc nhiên vì phát hiện ra nhiều ý nghĩa mới.","Lợi ích"],
["Simply sign up at the library desk before Friday.","Chỉ cần đăng ký tại quầy thư viện trước thứ Sáu.","Hướng dẫn đăng ký – kết thư"]],
L:["Sau lời mời là cách thức sinh hoạt.","“a book chosen by members” → cuốn sách tháng này.","“Reading it again” – “it” = cuốn sách; “again” vì đã đọc hồi nhỏ.","Hướng dẫn đăng ký – lời kêu gọi kết thư."],
t:"“Reading it again” chỉ hợp lý sau câu nói “most of you probably read as children”. Câu hướng dẫn đăng ký luôn ở cuối thư mời.",
w:[["summer break","kỳ nghỉ hè"],["warmly invite","nhiệt liệt mời"],["sign up","đăng ký"]]},

{ty:"Thư mời chạy từ thiện (Charity run)",open:"Hi Duc,",close:"Run with us!<br>Phong",ok:"adceb",
seq:[["Our youth union is organising a 5 km charity run around Van Lam on 15 March, and I'd love you to join our team.","Đoàn thanh niên đang tổ chức giải chạy từ thiện 5 km quanh Văn Lâm vào ngày 15 tháng Ba, và tớ rất muốn cậu tham gia đội tớ.","Lời mời"],
["The aim is to raise money to build a new playground for children at Gia Vien orphanage.","Mục đích là quyên tiền xây sân chơi mới cho trẻ em ở trung tâm bảo trợ Gia Viễn.","Mục đích"],
["Each runner pays a registration fee of 50,000 dong, and all of it goes to the project.","Mỗi người chạy đóng lệ phí 50.000 đồng, và toàn bộ được dùng cho dự án.","Cách thức"],
["Don't worry if you're not a fast runner – you can walk part of the way if you need to.","Đừng lo nếu cậu chạy không nhanh – cậu có thể đi bộ một đoạn nếu cần.","Trấn an"],
["Text me your T-shirt size, and I'll register both of us.","Nhắn tớ cỡ áo của cậu, tớ sẽ đăng ký cho cả hai đứa.","Yêu cầu hồi âm – kết thư"]],
L:["Sau lời mời là mục đích của giải chạy.","Cách góp tiền: lệ phí đăng ký chuyển hết cho dự án.","Trấn an người được mời về tốc độ chạy.","“Text me…” – yêu cầu hành động kết thư."],
t:"“the project” ở câu lệ phí cần câu nêu mục đích (xây sân chơi) đứng trước. Câu “Text me…” mang tính hành động, đặt cuối thư.",
w:[["charity run","giải chạy từ thiện"],["raise money","quyên góp tiền"],["registration fee","lệ phí đăng ký"]]},

{ty:"Thư mời học nấu ăn (Cooking class)",open:"Dear Parents,",close:"Yours sincerely,<br>Ms. Nhung<br>(Home Economics teacher)",ok:"dbeac",
seq:[["We are pleased to invite you to a parent–child cooking class at our school on Sunday, 9 November.","Chúng tôi trân trọng mời quý phụ huynh tham gia lớp học nấu ăn dành cho phụ huynh và con tại trường vào Chủ nhật, ngày 9 tháng Mười Một.","Lời mời"],
["During the session, you and your child will prepare a healthy three-course meal together.","Trong buổi học, quý vị và con sẽ cùng chuẩn bị một bữa ăn lành mạnh ba món.","Nội dung"],
["All ingredients and equipment will be provided by the school.","Toàn bộ nguyên liệu và dụng cụ sẽ do nhà trường cung cấp.","Thông tin thực tế"],
["Places are limited to twenty families, so early registration is recommended.","Số lượng giới hạn hai mươi gia đình, vì vậy khuyến khích đăng ký sớm.","Lưu ý"],
["Please return the form below to your child's form teacher by Friday.","Xin gửi lại phiếu dưới đây cho giáo viên chủ nhiệm trước thứ Sáu.","Hướng dẫn đăng ký – kết thư"]],
L:["“During the session” – “the session” = lớp học nấu ăn vừa mời.","Sau nội dung là thông tin thực tế: nguyên liệu được cung cấp.","Lưu ý số lượng giới hạn → nên đăng ký sớm.","Hướng dẫn nộp phiếu đăng ký – kết thư."],
t:"Thư mời trang trọng: “We are pleased to invite you to…” → Nội dung → Thông tin → Lưu ý → Hướng dẫn đăng ký. “the session” không đứng trước câu nêu sự kiện.",
w:[["We are pleased to invite you to…","Chúng tôi trân trọng mời…"],["three-course meal","bữa ăn ba món"],["Places are limited.","Số lượng có hạn."]]},

{ty:"Thư mời dự đám cưới (Wedding)",open:"Dear Ms. Van,",close:"With warm regards,<br>Le Thi Thu",ok:"ecdab",
seq:[["My elder sister, Hong, is getting married on Saturday, 6 December, and our family would be delighted if you could attend.","Chị gái em là Hồng sẽ kết hôn vào thứ Bảy, ngày 6 tháng Mười Hai, và gia đình em rất vui nếu cô có thể đến dự.","Lời mời"],
["As you were her form teacher for three years, she often says you were her favourite teacher.","Vì cô là giáo viên chủ nhiệm của chị ấy ba năm, chị thường nói cô là cô giáo chị yêu quý nhất.","Lý do mời"],
["The reception will take place at Hoa Lu Restaurant, starting at 11 a.m.","Tiệc cưới sẽ diễn ra tại nhà hàng Hoa Lư, bắt đầu lúc 11 giờ.","Thời gian – địa điểm"],
["A formal invitation card is enclosed with this letter.","Thiệp mời chính thức được gửi kèm thư này.","Đính kèm"],
["We very much hope to see you there.","Gia đình em rất mong được gặp cô ở đó.","Lời mong – kết thư"]],
L:["“her form teacher” – “her” = chị Hồng; lý do mời riêng cô giáo.","Sau lý do là thông tin tiệc cưới.","Thiệp mời chính thức gửi kèm.","“We very much hope to see you there” – câu kết thư mời."],
t:"Đại từ “her/she” cần tên “Hong” đứng trước. “there” trong câu kết chỉ địa điểm tiệc cưới – phải đứng sau câu nêu nhà hàng.",
w:[["get married","kết hôn"],["reception","tiệc chiêu đãi (tiệc cưới)"],["be enclosed with","được gửi kèm"]]}

{ty:"Thư xin gia hạn nộp bài (Deadline extension)",open:"Dear Mr. Hai,",close:"Yours sincerely,<br>Pham Ngoc Mai (12A3)",ok:"cedab",
seq:[["I am writing to ask whether I could have a few more days to finish my history project.","Em viết thư để hỏi liệu em có thể được thêm vài ngày để hoàn thành dự án môn Lịch sử không ạ.","Lý do viết thư"],
["Last week, I represented the school at the provincial English competition in Ninh Binh City.","Tuần trước, em đại diện trường dự cuộc thi tiếng Anh cấp tỉnh ở thành phố Ninh Bình.","Hoàn cảnh"],
["Because of this, I missed three days of classes and could not visit the museum to collect information.","Vì vậy, em nghỉ học ba ngày và chưa thể đến bảo tàng thu thập thông tin.","Hệ quả"],
["I have already written the introduction and planned the remaining sections.","Em đã viết xong phần mở đầu và lên dàn ý các phần còn lại.","Tiến độ hiện tại"],

{ty:"Thư hỏi bạn về hệ thống giáo dục (Education system)",open:"Hi Lucas,",close:"Write soon,<br>Viet",ok:"abecd",
seq:[["In your last letter, you mentioned that you only go to school until 3 p.m. in Germany.","Trong thư trước, cậu kể rằng ở Đức cậu chỉ học đến 3 giờ chiều.","Nhắc lại thư trước"],
["That sounds amazing, because here in Vietnam many of us study until late evening with extra classes.","Nghe thật tuyệt, vì ở Việt Nam nhiều bạn bọn tớ học đến tối muộn với các lớp học thêm.","So sánh"],
["I'm curious about how you prepare for exams without so many lessons.","Tớ tò mò không biết các cậu ôn thi thế nào khi không có nhiều tiết học như vậy.","Câu hỏi 1"],
["I'd also like to know whether students in Germany have to wear uniforms.","Tớ cũng muốn biết học sinh ở Đức có phải mặc đồng phục không.","Câu hỏi 2"],
["If you send me some photos of your school, I'll send you some of mine too!","Nếu cậu gửi ảnh trường cậu, tớ cũng sẽ gửi ảnh trường tớ!","Đề nghị trao đổi – kết thư"]],
L:["“That sounds amazing” – “That” = việc chỉ học đến 3 giờ chiều.","Từ so sánh nảy sinh câu hỏi: ôn thi thế nào khi ít tiết.","“also” – câu hỏi thứ hai.","Đề nghị trao đổi ảnh – kết thư thân mật."],
t:"“That sounds amazing” là phản hồi trực tiếp cho thông tin ở thư trước. “also” xác định câu hỏi thứ hai.",
w:[["mention","đề cập"],["extra classes","lớp học thêm"],["I'm curious about…","Tớ tò mò về…"]]},

{ty:"Thư giới thiệu ứng dụng học tập (Study app)",open:"Hey Trang,",close:"Good luck,<br>Hien",ok:"dacbe",
seq:[["You told me you were struggling to remember new English words, so I thought I'd share something that really helped me.","Cậu bảo đang chật vật nhớ từ mới tiếng Anh, nên tớ nghĩ nên chia sẻ một thứ đã giúp tớ rất nhiều.","Lý do viết thư"],
["It's a free flashcard app called WordUp.","Đó là một ứng dụng thẻ ghi nhớ miễn phí tên là WordUp.","Giới thiệu"],
["The app shows you each word just before you are likely to forget it, so you review it at the perfect time.","Ứng dụng hiện từ ngay trước lúc cậu sắp quên, nên cậu ôn đúng thời điểm.","Cách hoạt động"],
["Using it for just ten minutes a day, I learnt over 500 words in two months.","Chỉ dùng mười phút mỗi ngày, tớ đã học hơn 500 từ trong hai tháng.","Hiệu quả"],
["Give it a try and tell me what you think!","Thử đi rồi kể tớ nghe cậu thấy thế nào nhé!","Lời khuyên – kết thư"]],
L:["“something that really helped me” → “It's a free flashcard app”.","“The app” – giải thích cách ứng dụng hoạt động.","“Using it” – kết quả thực tế khi dùng.","“Give it a try” – lời khuyên kết thư."],
t:"Chuỗi tham chiếu: something → It's a… app → The app → Using it → Give it a try. Mỗi câu chỉ có thể đứng sau danh từ mà nó tham chiếu.",
w:[["struggle to","chật vật, khó khăn khi"],["flashcard","thẻ ghi nhớ"],["give it a try","thử xem"]]},

{ty:"Thư rủ luyện nói tiếng Anh (Speaking practice)",open:"Hi Khanh,",close:"See you,<br>Quynh",ok:"bdaec",
seq:[["I've noticed that we both get nervous whenever we have to speak English in class.","Tớ để ý là cả hai đứa mình đều run mỗi khi phải nói tiếng Anh trên lớp.","Vấn đề chung"],
["So how about practising together for twenty minutes after school every day?","Vậy sao mình không luyện cùng nhau hai mươi phút sau giờ học mỗi ngày?","Đề xuất"],
["We could choose a topic from the textbook and talk about it without using any Vietnamese.","Mình có thể chọn một chủ đề trong sách giáo khoa và nói về nó mà không dùng tiếng Việt.","Cách thực hiện"],
["We could also record ourselves to check our pronunciation.","Mình cũng có thể tự ghi âm để kiểm tra phát âm.","Cách thực hiện bổ sung"],
["Let's start on Monday if you're free!","Bắt đầu từ thứ Hai nếu cậu rảnh nhé!","Hẹn – kết thư"]],
L:["“So how about…” – từ vấn đề chung đến đề xuất giải pháp.","Cách luyện cụ thể: chọn chủ đề, chỉ nói tiếng Anh.","“also” – cách luyện bổ sung: ghi âm.","Hẹn ngày bắt đầu → kết thư."],
t:"“So” nối vấn đề với giải pháp – câu đề xuất phải theo ngay câu nêu vấn đề. Hai câu “We could… / We could also…” có thứ tự cố định nhờ “also”.",
w:[["get nervous","bị run, lo lắng"],["How about + V-ing?","Sao không…?"],["record oneself","tự ghi âm"]]},

seq:[["Great news – our project idea on turning rice straw into paper has been accepted for the science fair!","Tin vui – ý tưởng dự án biến rơm rạ thành giấy của nhóm mình đã được duyệt dự thi khoa học kỹ thuật!","Báo tin"],
["Now we need to divide the work so that we can finish on time.","Giờ chúng ta cần chia việc để kịp tiến độ.","Chuyển ý"],
["I suggest that Mai and Tuan collect the straw and run the experiments.","Tớ đề nghị Mai và Tuấn thu gom rơm và làm thí nghiệm.","Phân công 1"],
